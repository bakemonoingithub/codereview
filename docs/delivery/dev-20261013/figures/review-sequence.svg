<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-1A703A" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1A703A"/></marker><marker id="arrow-245E8D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#245E8D"/></marker><marker id="arrow-9B6100" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9B6100"/></marker><marker id="arrow-65737B" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65737B"/></marker>
  </defs>
  <rect x="180" y="20" width="740" height="64" rx="8" fill="#F5F6F7" stroke="#65737B" stroke-width="2"/>
<text x="550.0" y="57.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="18" font-weight="600" fill="#263238">浏览器提交范围、策略或调查要求</text>
<line x1="550" y1="84" x2="550" y2="112" stroke="#1A703A" stroke-width="2" marker-end="url(#arrow-1A703A)"/>
<rect x="140" y="118" width="820" height="88" rx="8" fill="#EEF5EF" stroke="#1A703A" stroke-width="2"/>
<text x="550.0" y="154.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">POST /api/v2/review-tasks 或 /api/v2/agent-tasks</text>
<text x="550.0" y="178.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">校验项目与模型，冻结输入和配置快照，写入 QUEUED，返回 202</text>
<line x1="550" y1="206" x2="550" y2="234" stroke="#1A703A" stroke-width="2" marker-end="url(#arrow-1A703A)"/>
<rect x="140" y="240" width="820" height="64" rx="8" fill="#EEF5EF" stroke="#1A703A" stroke-width="2"/>
<text x="550.0" y="277.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="18" font-weight="400" fill="#263238">执行器将任务置为 PREPARING，随后 RUNNING</text>
<line x1="360" y1="304" x2="250" y2="340" stroke="#1A703A" stroke-width="2" marker-end="url(#arrow-1A703A)"/>
<line x1="740" y1="304" x2="850" y2="340" stroke="#1A703A" stroke-width="2" marker-end="url(#arrow-1A703A)"/>
<rect x="36" y="348" width="490" height="280" rx="8" fill="#EEF5EF" stroke="#1A703A" stroke-width="2"/>
<text x="281.0" y="432.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">专项审查</text>
<text x="281.0" y="456.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">按文件或提交差异制备单元</text>
<text x="281.0" y="480.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">超限则拆分；无法拆分则该目标失败</text>
<text x="281.0" y="504.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">JSON 模式调用模型</text>
<text x="281.0" y="528.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">问题、模式或耦合观察写入结果</text>
<text x="281.0" y="552.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">反馈在结果发布后单独保存</text>
<rect x="574" y="348" width="490" height="280" rx="8" fill="#EEF5EF" stroke="#1A703A" stroke-width="2"/>
<text x="819.0" y="432.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">Agent 分析</text>
<text x="819.0" y="456.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">历史原样回放，不压缩上下文</text>
<text x="819.0" y="480.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">只读工具，每轮最多 4 个</text>
<text x="819.0" y="504.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">只有 submit_result 才发布结果</text>
<text x="819.0" y="528.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">命中预算即停止，不追加总结</text>
<text x="819.0" y="552.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">不提供中断后的会话恢复</text>
<line x1="281" y1="628" x2="420" y2="668" stroke="#1A703A" stroke-width="2" marker-end="url(#arrow-1A703A)"/>
<line x1="819" y1="628" x2="680" y2="668" stroke="#1A703A" stroke-width="2" marker-end="url(#arrow-1A703A)"/>
<rect x="140" y="676" width="820" height="110" rx="8" fill="#EFF5FA" stroke="#245E8D" stroke-width="2"/>
<text x="550.0" y="711.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">浏览器轮询至终态：专项详情约 3 秒，Agent 详情约 2 秒</text>
<text x="550.0" y="735.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">审查中心列表不自动轮询，需手动刷新</text>
<text x="550.0" y="759.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">进程重启时，尚未结束的 QUEUED / RUNNING 标为 FAILED，原因 INTERRUPTED</text>
<text x="550" y="830" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="15" fill="#4E5B63">人工反馈、报告冻结与下载发生在任务到达终态之后，不改写模型原始输出。</text>
</svg>
