  <rect x="36" y="24" width="1028" height="150" rx="12" fill="#F5F6F7" stroke="#65737B" stroke-width="2" stroke-dasharray="8 5"/>
<text x="550" y="52" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" fill="#65737B">开发与 CI 构建区</text>
<rect x="70" y="68" width="960" height="84" rx="8" fill="#FFFFFF" stroke="#65737B" stroke-width="2"/>
<text x="550.0" y="102.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">GitHub Actions：Node 22 / pnpm 10.18.2 构建前端，Java 17 / Maven 打包</text>
<text x="550.0" y="126.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">导出 linux/amd64 应用镜像，并拉取 mysql:8.0.36，组成离线包</text>
<line x1="550" y1="174" x2="550" y2="214" stroke="#9B6100" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow-9B6100)"/>
<rect x="250" y="220" width="600" height="72" rx="8" fill="#FFFFFF" stroke="#9B6100" stroke-width="2"/>
<text x="550.0" y="248.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">离线包 codereview-offline-&lt;版本&gt;.tar.gz</text>
<text x="550.0" y="272.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">镜像、Compose、脚本、配置模板、源码快照、校验和</text>
<line x1="550" y1="292" x2="550" y2="332" stroke="#9B6100" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow-9B6100)"/>
<rect x="36" y="340" width="1028" height="470" rx="12" fill="#FFFFFF" stroke="#1A703A" stroke-width="2"/>
<text x="550" y="368" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" fill="#1A703A">内网运行区 · Docker Compose 项目 codereview</text>
<rect x="56" y="388" width="470" height="180" rx="8" fill="#EEF5EF" stroke="#1A703A" stroke-width="2"/>
<text x="291.0" y="434.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">app 容器</text>
<text x="291.0" y="458.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">JRE 17 + app.jar + static 前端</text>
<text x="291.0" y="482.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">宿主 APP_PORT 默认 18080 → 8080</text>
<text x="291.0" y="506.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">只读挂载 config/application.yml</text>
<text x="291.0" y="530.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">持久化 data/git-mirrors</text>
<rect x="560" y="388" width="470" height="180" rx="8" fill="#EFF5FA" stroke="#245E8D" stroke-width="2"/>
<text x="795.0" y="434.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">mysql 容器  8.0.36</text>
<text x="795.0" y="458.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">只在网络内提供 mysql:3306</text>
<text x="795.0" y="482.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">不发布宿主端口</text>
<text x="795.0" y="506.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">库 ai_code_review_agent</text>
<text x="795.0" y="530.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">由 agent.datasource 连接</text>
<line x1="526" y1="470" x2="560" y2="470" stroke="#245E8D" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-245E8D)"/>
<text x="543" y="458" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="14" fill="#245E8D">JDBC</text>
<rect x="56" y="590" width="470" height="190" rx="8" fill="#F5F6F7" stroke="#65737B" stroke-width="2"/>
<text x="291.0" y="641.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">内网 PC 浏览器</text>
<text x="291.0" y="665.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">http://&lt;目标机内网IP&gt;:18080</text>
<text x="291.0" y="689.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">首页为审查中心</text>
<text x="291.0" y="713.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">须配置 agent.datasource</text>
<text x="291.0" y="737.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">后业务接口才可用</text>
<rect x="560" y="590" width="470" height="190" rx="8" fill="#F5F6F7" stroke="#65737B" stroke-width="2"/>
<text x="795.0" y="641.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">经宿主出站访问</text>
<text x="795.0" y="665.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">内网 Gitea：REST / .diff / Git</text>
<text x="795.0" y="689.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">AI 网关：/chat/completions</text>
<text x="795.0" y="713.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">Agent 检索使用镜像目录中的 git</text>
<text x="795.0" y="737.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="16" font-weight="400" fill="#263238">镜像路径不宜过深</text>
<line x1="291" y1="590" x2="291" y2="568" stroke="#1A703A" stroke-width="2" marker-end="url(#arrow-1A703A)"/>
<text x="550" y="850" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="15" fill="#4E5B63">镜像回退不撤销 agent_schema_history。应用配置须包含 agent.datasource。</text>
<text x="550" y="920" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif" font-size="15" fill="#4E5B63">交付模板默认不写入 agent.datasource。启用工作台前须创建应用库并重启应用。</text>
</svg>
