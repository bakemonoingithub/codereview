/* ===== v3 light visual language overrides ===== */
:root{--ink:#0f172a;--muted:#64748b;--line:#e8edf3;--bg:#f8fafc;--blue:#2563eb;--soft:#eff4ff;--green:#059669;--amber:#b45309;--red:#dc2626;--nav:#ffffff;--radius:20px;--shadow:0 1px 2px #0f172a0a,0 4px 16px #0f172a08}
body{font:14px/1.65 "Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;background:var(--bg);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button{border:1px solid #e2e8f0;border-radius:12px;padding:9px 16px;font-weight:600;font-size:13px;box-shadow:0 1px 2px #0f172a0d;transition:background .15s,border-color .15s,box-shadow .15s}
button:hover:not(:disabled){border-color:#cbd5e1;background:#f8fafc}
.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px #2563eb38}
.primary:hover:not(:disabled){background:#1d4ed8;border-color:#1d4ed8}
.quiet,.linklike,.close,.source-link,.report-citation{box-shadow:none}
input,select,textarea{border:1px solid #e2e8f0;border-radius:12px;padding:9px 12px;background:#f8fafc}
input:focus,select:focus,textarea:focus{background:#fff;border-color:#93b4f5;box-shadow:0 0 0 3px #2563eb1f;outline:0}
h1{font-size:32px;font-weight:700;letter-spacing:-.8px}h2{font-size:18px;font-weight:700}h3{font-weight:650}
code{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;color:#334155}
.layout{grid-template-columns:240px minmax(0,1fr)}
.sidebar{width:240px;background:#fff;border-right:1px solid var(--line);color:#475569;padding:28px 16px}
.brand{color:var(--ink);font-size:19px;font-weight:700;padding:0 8px 30px;display:flex;align-items:center}
.brand b{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 6px 14px #2563eb40;margin-right:12px}
.nav-label{color:#94a3b8;font-weight:600;padding:16px 12px 10px}
.sidebar button{color:#475569;border-radius:12px;padding:11px 14px;font-weight:500;box-shadow:none}
.sidebar button:hover{background:#f1f5f9;color:var(--ink)}
.sidebar button.active{background:var(--soft);color:var(--blue);font-weight:650}
.sidebar .foot{margin:auto 0 0;padding:16px;background:#f8fafc;border:1px solid var(--line);border-radius:16px;color:#64748b}
.sidebar .foot strong{color:var(--ink);font-weight:650}
.topbar{height:72px;background:#ffffffcc;backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;padding:0 40px}
.breadcrumbs span{color:#cbd5e1}
.prototype-label{border-radius:999px;background:var(--soft);color:var(--blue);border-color:#dbe6fe;font-weight:600;padding:4px 12px}
.avatar{width:36px;height:36px;background:#f1f5f9;border:1px solid #e2e8f0;color:#334155;font-weight:700}
.content{padding:40px 40px 56px}
.heading{margin-bottom:32px}.heading p{font-size:15px;margin-top:8px}
.card{border-radius:var(--radius);border-color:var(--line);box-shadow:var(--shadow)}
.stats{gap:20px;margin-bottom:32px}
.stat{border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow)}
.stat .value{font-size:40px;font-weight:700;letter-spacing:-1.5px;margin:10px 0 4px}
.stat .value small{font-size:15px}
.filters{padding:20px 24px;gap:12px}
.filters input{min-width:300px;flex:1}
th{background:#fafbfc;color:#64748b;font-weight:600;padding:14px 24px}
td{padding:20px 24px;font-size:14px}td strong{font-weight:650}
tbody tr{transition:background .12s}tbody tr:hover td{background:#f8fafc}
.table-footer{padding:16px 24px}
.badge{border-radius:999px;padding:3px 10px;font-weight:600}
.dot{width:6px;height:6px}
.notice{border-radius:14px;padding:13px 16px}
.section-top{padding:18px 24px}
.tabbar{padding:0 24px;gap:28px}.tabbar button{box-shadow:none;font-weight:500}
.target{padding:18px 20px}.target.selected{background:var(--soft);border-left-color:var(--blue)}
.issue{padding:24px 26px}
.feedback{border-radius:14px;background:#f8fafc}
.mini{border-radius:14px;background:#f8fafc}
.mini b{font-weight:700}
.tree .file-row{border-radius:10px}
.codeview{background:#fcfdfe}
.code-line.marked{background:#eff4ff;border-left-color:var(--blue)}
.report-overview{border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 28px}
.report-overview b{font-size:30px;font-weight:700}
.report-body h2{font-size:24px}
.modal{border-radius:24px;box-shadow:0 30px 80px #0f172a33}
.modal::backdrop{background:#0f172a59;backdrop-filter:blur(4px)}
.modal-head{padding:22px 28px}.modal-head h2{font-size:20px}
.modal-body{padding:24px 28px}.modal-foot{padding:18px 28px;background:#f8fafc}
.step .num{background:var(--blue);color:#fff}
.switch-line,.file-note,.preview-code,.scope-tree,.scope-selected{border-radius:14px}
.segmented button.active,.preview-tabs .active,.choice.selected{background:var(--soft);color:var(--blue);border-color:#bfd2fb}
.scenario{margin-top:32px;padding:16px 20px;border:1px solid var(--line);border-radius:16px;background:#fff;color:#64748b}
.scenario button{border-radius:999px;padding:4px 12px;font-weight:500}
.toast{background:var(--ink);border-radius:14px;left:calc(50% + 120px)}
.diagram{border-radius:16px}.node{border-radius:10px}
@media(max-width:1100px){.layout{grid-template-columns:200px minmax(0,1fr)}.sidebar{width:200px}.content{padding:28px 24px}.topbar{padding:0 24px}.stat .value{font-size:32px}}
@media(max-width:760px){.layout{display:block}.sidebar{width:100%;position:static;border-right:0;border-bottom:1px solid var(--line)}.filters input{min-width:0}.content{padding:20px 14px}.toast{left:50%}h1{font-size:26px}}
.field label:has(>input[type=radio]),.field label:has(>input[type=checkbox]){display:inline-flex;gap:8px;align-items:center;margin-right:20px;font-weight:500}

/* PR 原型仅为新增内容补布局，基础视觉直接沿用 P29 工作台原型。 */
.page-tabs{margin-bottom:20px}.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:20px;align-items:start}.section{border-top:1px solid var(--line);padding:18px 0}.section:first-of-type{border-top:0;padding-top:0}.section-label{display:block;font-weight:650;margin-bottom:10px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}.field input,.field select{width:100%}.segment{display:inline-flex;gap:8px}.segment button.active{background:var(--soft);color:var(--blue);border-color:#bfd2fb}.btn.soft{background:var(--soft);color:var(--blue);border-color:#bfd2fb}.btn.text{border:0;background:transparent;color:var(--blue);box-shadow:none}.notice.warn{background:#fffaf0;color:#946b2c;border-color:#efdfbd}.notice.success{background:#eaf7ef;color:var(--green);border-color:#cbe9d7}.chip{display:inline-flex;border-radius:999px;background:#eef2f7;color:#5d6c80;padding:3px 10px;font-size:11px;font-weight:600}.chip.green{background:#eaf7ef;color:var(--green)}.chip.amber{background:#fff4e5;color:var(--amber)}.eyebrow{font-size:11px;color:var(--muted);font-weight:650;letter-spacing:.06em}.selected-pr{border:1px solid var(--line);border-radius:14px;padding:15px;background:#f8fafc;margin-top:12px}.pr-title{font-weight:650}.pr-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:8px 0}.version{color:var(--muted);font-size:12px;overflow-wrap:anywhere;margin:7px 0}.file-list{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px;max-height:240px;overflow-y:auto}.file-row{display:flex;gap:10px;align-items:center;border-bottom:1px solid #edf1f6;padding:8px 12px}.file-row:last-child{border:0}.file-row.disabled{background:#f8fafc;color:var(--muted)}.file-name{flex:1;min-width:0;overflow-wrap:anywhere;font:12px Consolas,monospace}.preview-empty{padding:35px 18px;text-align:center;background:#f8fafc;border:1px dashed #d6deea;border-radius:14px;color:var(--muted)}.preview-empty strong{display:block;color:var(--ink)}.summary{display:grid}.stat-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:9px 0}.stat-row span{color:var(--muted)}.result-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px}.result-aside{padding:18px}.target-button{width:100%;display:block;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:14px}.target-button.active{background:var(--soft);border-left:3px solid var(--blue);color:var(--blue)}.target-button small{display:block;color:var(--muted);margin-top:4px}.inner-tabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}.inner-tabs button{border:0;border-radius:0;box-shadow:none;background:none;color:var(--muted);padding:15px 0}.inner-tabs button.active{border-bottom:2px solid var(--blue);color:var(--blue)}.finding{padding:20px 0;border-bottom:1px solid var(--line)}.finding h3{font-size:16px;margin:9px 0}.finding p{margin:8px 0}.evidence{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.evidence button{background:var(--soft);color:var(--blue);border:0;box-shadow:none;font:12px Consolas,monospace}.kv{display:grid;grid-template-columns:145px minmax(0,1fr);gap:10px 14px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}.material-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.material-row span{min-width:0;overflow-wrap:anywhere}.call-row{padding:15px;border-bottom:1px solid var(--line)}.call-row button{float:right}.modal-backdrop{position:fixed;inset:0;background:#0f172a59;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.modal{display:block;background:#fff;overflow:auto}.modal-body{max-height:calc(90vh - 150px)}.modal-tools{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:10px;margin:14px 0}.modal-tools .search{width:100%}.pr-list{min-height:180px;max-height:370px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.pr-option{display:flex;width:100%;align-items:center;gap:12px;min-height:64px;padding:11px 14px;border:0;border-bottom:1px solid #edf1f6;border-radius:0;box-shadow:none;text-align:left}.pr-option:hover{background:#f7faff}.pr-option.active{background:var(--soft);box-shadow:inset 3px 0 0 var(--blue)}.pr-option .number{font:12px Consolas,monospace;color:var(--blue)}.pr-option .main{flex:1;min-width:0}.pr-option .main strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pr-option .main small,.pr-option .right{font-size:12px;color:var(--muted)}.pr-option .right{text-align:right}.close{border:0;box-shadow:none;font-size:20px}.code-toolbar{display:flex;align-items:center;gap:8px;margin:12px 0}.code-box{background:#fbfcfe;border:1px solid var(--line);border-radius:14px;max-height:390px;overflow:auto;padding:10px 0;font:12px/1.9 Consolas,monospace}.code-line{display:flex;white-space:pre}.code-line.highlight{background:#eff4ff;border-left:3px solid var(--blue)}.line-no{display:inline-block;min-width:52px;text-align:right;padding:0 14px;color:#9ca9b9;user-select:none}.code-line .add{color:var(--green)}.code-line .remove{color:var(--red)}.toast{z-index:30}.topbar .row{gap:10px}.content>.heading h1{font-size:28px}.content>.heading p{font-size:13px}.page-tabs button{box-shadow:none}.card.pad{padding:24px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}

<body>
  <div class="layout">
  <aside class="sidebar">
    <div class="brand"><b>⌘</b> CodeReview</div>
    <div class="nav-label">WORKSPACE</div>
    <button class="active" type="button">▦　审查中心</button>
    <button type="button" disabled>⌑　代码浏览</button>
    <button type="button" disabled>▤　报告</button>
    <div class="nav-label">MANAGE</div>
    <button type="button" disabled>⌂　项目管理</button>
    <button type="button" disabled>◈　模型管理</button>
    <div class="foot"><strong>交互原型</strong>使用示例 PR 与示例审查结果</div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumbs">审查中心 <span>/</span> PR 审查范围</div><div class="row"><span class="prototype-label">示例数据 · 无真实调用</span><span class="avatar">DEMO</span></div></header>
    <main class="content">
      <div class="heading"><div><h1>PR 审查范围</h1><p>选择待合并 PR，发起问题审查或 Agent 分析；查看固定版本的结果、代码证据和材料。</p></div></div>
      <nav class="tabbar page-tabs" aria-label="演示页面"><button data-page="issue" class="active">发起问题审查</button><button data-page="agent">发起 Agent 分析</button><button data-page="result">查看审查结果</button></nav>
      <div id="app"></div>
    </main>
  </div>
</div>
  <div id="overlay"></div><div id="toast" class="toast" hidden></div>
  <script>
    // 全部为本地示例数据；不连接 GitHub、Gitea 或业务 API。
    const H = '8a31e6d0f42c75a919e0b6d3872f0aa9a6b24410';
    const T = '3c947fe019bde46a22c9a8b1220d94b0e2a5651f';
    const B = '185a0f96bd21ab63ee4ac37d92f68802e106a43c';
    const prs = {
      github: [
        {n:128,title:'修复订单重复提交与重试处理',author:'chen',from:'feature/order-idempotency',to:'dev',updated:'今天 10:42',files:4,binary:1,head:H,target:T,base:B,items:[['src/order/OrderService.java','修改','text'],['src/order/RetryPolicy.java','新增','text'],['src/order/OrderController.java','修改','text'],['docs/order-flow.png','二进制','binary']]},
        {n:124,title:'调整支付回调状态映射',author:'lin',from:'fix/payment-callback',to:'dev',updated:'昨天 16:08',files:2,binary:0,head:'a'.repeat(40),target:T,base:'b'.repeat(40),items:[['src/payment/CallbackHandler.java','修改','text'],['src/payment/PaymentState.java','修改','text']]},
        {n:119,title:'更新管理端帮助截图',author:'wang',from:'docs/help-images',to:'main',updated:'11 月 3 日',files:2,binary:2,head:'c'.repeat(40),target:'d'.repeat(40),base:'e'.repeat(40),items:[['docs/help-01.png','二进制','binary'],['docs/help-02.png','二进制','binary']]}
      ],
      gitea: [
        {n:36,title:'完善审批记录与异常处理',author:'li',from:'verify/approval',to:'main',updated:'今天 09:12',files:3,binary:0,head:'f'.repeat(40),target:'1'.repeat(40),base:'2'.repeat(40),items:[['src/approval/ApprovalService.java','修改','text'],['src/approval/ApprovalMapper.java','修改','text'],['src/approval/ApprovalRecord.java','新增','text']]},
        {n:32,title:'替换报表导出图标',author:'zhao',from:'verify/report-icons',to:'main',updated:'11 月 4 日',files:1,binary:1,head:'3'.repeat(40),target:'1'.repeat(40),base:'2'.repeat(40),items:[['assets/export-icon.png','二进制','binary']]}
      ]
    };
    const state = {page:'issue',host:'github',selected:null,modal:null,draft:null,query:'',branch:'all',shown:2,issueFiles:new Set(),issueResult:null,agentResult:null,resultKind:'issue',detailTab:'result',target:0,codeSide:'after',material:null,issueModel:'deepseek-flash',agentModel:'deepseek-flash',agentNeed:'检查这个 PR 的重试与重复提交处理是否完整，并说明未覆盖的路径。',agentScope:'重点关注订单服务与回调处理。',issueNote:''};
    const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const short = s => s ? s.slice(0,10) : '—'; const hostName = h => h === 'github' ? 'GitHub' : 'Gitea 1.16.1';
    function toast(msg) { const el=$('#toast'); el.textContent=msg; el.hidden=false; clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.hidden=true,3200); }
    function setPage(page) { state.page=page; document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page)); render(); }
    document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
    function hostChange(v) { state.host=v; state.selected=null; state.issueFiles=new Set(); render(); }
    function selectPr(pr) { state.selected=pr; state.issueFiles=new Set(pr.items.filter(i=>i[2]==='text').map(i=>i[0])); state.modal=null; state.draft=null; render(); }
    function prCard() { const p=state.selected; if(!p) return '<div class="preview-empty"><strong>尚未选择 PR</strong>点击下方按钮，从待合并列表选择一个 PR。</div>'; return `<div class="selected-pr"><div class="pr-title">${hostName(state.host)} · #${p.n} ${esc(p.title)}</div><div class="pr-meta"><span class="chip green">待合并</span><span>${esc(p.from)} → ${esc(p.to)}</span><span>· ${p.files} 个变更文件</span><span>· ${p.binary} 个二进制</span></div><div class="version">源提交 <code>${short(p.head)}</code> · 目标提交 <code>${short(p.target)}</code> · 共同祖先 <code>${short(p.base)}</code></div></div>`; }
    function launchPage(kind) {
      const p=state.selected, issue=kind==='issue';
      const files=p?`<div class="file-list">${p.items.map(([path,status,type])=>`<label class="file-row ${type==='binary'?'disabled':''}"><input type="checkbox" data-file="${esc(path)}" ${state.issueFiles.has(path)?'checked':''} ${type==='binary'?'disabled':''}><span class="file-name">${esc(path)}</span><span class="chip ${type==='binary'?'amber':''}">${status}</span></label>`).join('')}</div>`:'';
      return `<div class="grid"><section class="card pad"><div class="card-head"><div><div class="eyebrow">${issue?'SPECIALIST REVIEW':'AGENT INVESTIGATION'}</div><h2>${issue?'发起问题审查':'发起 Agent 分析'}</h2></div><span class="chip">手工发起</span></div>
        <div class="section"><span class="section-label">审查项目</span><div class="field"><label for="host">代码仓库</label><select id="host"><option value="github" ${state.host==='github'?'selected':''}>验证仓库 · GitHub</option><option value="gitea" ${state.host==='gitea'?'selected':''}>内网仓库 · Gitea 1.16.1</option></select></div><div class="field"><label>审查范围</label><div class="segment"><button disabled>文件内容</button><button disabled>提交比较</button><button class="active">PR</button></div><p class="muted small" style="margin-top:7px">本原型集中展示新增的 PR 模式；既有范围入口在正式页面保留。</p></div>${prCard()}<div class="actions"><button class="btn soft" id="choose-pr">${p?'更换 PR':'选择 PR'}</button>${p?'<button class="btn text" id="clear-pr">清除选择</button>':''}</div></div>
        <div class="section"><span class="section-label">${issue?'审查目标文件':'调查目标'}</span>${p?(issue?`<p class="muted small">按 PR 净变化列出目标；逐文件形成结果。未选和二进制文件不会被标记为已审查。</p>${files}<p class="muted small" style="margin-top:8px">已选 ${state.issueFiles.size} / ${p.items.filter(i=>i[2]==='text').length} 个可审查文本文件</p>`:`<div class="notice">整个 PR 的净变化是一次 Agent 调查，不按其中的提交逐项发起。${p.binary?'其中二进制文件只记录为未覆盖范围。':''}</div><div class="field"><label for="agent-scope">范围补充说明（可选）</label><textarea id="agent-scope">${esc(state.agentScope)}</textarea></div>`):'<div class="notice">选择 PR 后显示它的净变化文件与固定版本。</div>'}</div>
        <div class="section"><span class="section-label">${issue?'审查设置':'本次要求'}</span>${issue?`<div class="field"><label for="issue-note">逐文件补充说明（示例输入，应用到已选文件）</label><textarea id="issue-note" placeholder="可补充本次文件审查关注点">${esc(state.issueNote)}</textarea></div><div class="field"><label for="issue-model">模型</label><select id="issue-model"><option>deepseek-flash</option><option>示例模型 B</option></select></div><label class="small"><input type="checkbox" id="split"> 智能拆分文件（默认关闭）</label>`:`<div class="field"><label for="agent-need">审查要求 <span style="color:#b83d41">*</span></label><textarea id="agent-need">${esc(state.agentNeed)}</textarea></div><div class="field"><label for="agent-model">模型</label><select id="agent-model"><option>deepseek-flash</option><option>示例模型 B</option></select></div>`}</div>
        <div class="actions"><button class="btn primary" id="launch" ${!p||p.items.every(i=>i[2]==='binary')?'disabled':''}>发起${issue?'问题审查':'Agent 分析'}</button><span class="muted small">示例交互：发起后立即展示模拟完成结果</span></div>${p&&p.items.every(i=>i[2]==='binary')?'<div class="notice warn">该 PR 只有二进制变更，无法发起文本审查。</div>':''}
      </section><aside class="card pad"><div class="eyebrow">SCOPE SNAPSHOT</div><h2 style="margin:5px 0 13px">本次会审查什么</h2>${p?`<div class="summary"><div class="stat-row"><span>来源</span><strong>${hostName(state.host)} PR #${p.n}</strong></div><div class="stat-row"><span>比较范围</span><strong>共同祖先 → 源提交</strong></div><div class="stat-row"><span>变更文件</span><strong>${p.files} 个</strong></div><div class="stat-row"><span>文本 / 二进制</span><strong>${p.files-p.binary} / ${p.binary}</strong></div><div class="stat-row"><span>审查单元</span><strong>${issue?'已选文件各 1 份结果':'整个 PR 1 次调查'}</strong></div></div><div class="notice warn">审查依据选择时固定的版本。之后 PR 或目标分支变化，旧结果会提示版本变化；是否重审由用户决定。</div>`:'<div class="preview-empty"><strong>等待选择范围</strong>这里会展示固定版本、覆盖文件和审查单元。</div>'}<div class="section" style="margin-top:19px"><h3>结果阅读入口</h3><p class="muted small">发起后可查看审查结果、代码证据、输入与配置、保存的材料及实际调用。也可以直接切到「查看审查结果」体验示例。</p><button class="btn" id="go-result" style="margin-top:12px">查看示例结果</button></div></aside></div>`;
    }
    function issueResult() { const p=state.issueResult?.pr || prs.github[0], selected=state.issueResult?.files || p.items.filter(i=>i[2]==='text').map(i=>i[0]); const target=selected[Math.min(state.target,selected.length-1)] || selected[0];
      return `<div class="result-layout"><aside class="card result-aside"><div class="eyebrow">TARGET FILES</div><h3 style="margin-top:6px">目标文件 <span class="muted small">${selected.length} 个</span></h3>${selected.map((f,i)=>`<button class="target-button ${state.target===i?'active':''}" data-target="${i}"><code>${esc(f)}</code><small>${i===0?'已完成 · 2 个待复核问题':'已完成 · 0 个问题'}</small></button>`).join('')}<div class="notice warn">覆盖 ${selected.length}/${p.items.filter(i=>i[2]==='text').length} 个文本文件；${p.binary} 个二进制文件未审查。</div></aside><section class="card pad"><div class="card-head"><div><div class="eyebrow">ISSUE REVIEW · ${hostName(state.issueResult?.host||'github')} PR #${p.n}</div><h2>${esc(p.title)}</h2></div><span class="chip green">已完成 · 示例</span></div><div class="version">${esc(p.from)} → ${esc(p.to)} · ${short(p.base)} → ${short(p.head)}</div>${detailTabs()}${state.detailTab==='result'?`<h3>${esc(target)}</h3><p class="muted small">本文件按 PR 净变化审查；结论仅针对固定版本。</p>${state.target===0?`<article class="finding"><span class="chip amber">较高严重度</span><h3>并发重试可能重复创建订单</h3><p>示例结论：状态检查与写入之间缺少同一事务的约束，两个请求可能同时通过检查。请结合实际业务规则复核。</p><div class="evidence"><button data-code="issue-after">修改后 · 第 42–47 行 ↗</button><button data-code="issue-before">修改前 · 第 39–43 行 ↗</button></div></article><article class="finding"><span class="chip">一般严重度</span><h3>重试次数耗尽后的错误未统一返回</h3><p>示例结论：异常路径的状态映射可能与调用方预期不一致。</p><div class="evidence"><button data-code="issue-after">修改后 · 第 52–56 行 ↗</button></div></article>`:'<div class="notice success">该文件的模拟审查未发现问题。此处不代表真实代码没有问题。</div>'}`:state.detailTab==='input'?inputPanel(p,target,'issue'):callsPanel('issue')}</section></div>`;
    }
    function agentResult() { const p=state.agentResult?.pr || prs.github[0]; return `<div class="result-layout"><aside class="card result-aside"><div class="eyebrow">INVESTIGATION</div><h3 style="margin-top:7px">调查概况</h3><div class="stat-row"><span>模型轮次</span><strong>4 / 48</strong></div><div class="stat-row"><span>工具尝试</span><strong>7 / 192</strong></div><div class="stat-row"><span>结论</span><strong>已形成结果</strong></div><div class="notice warn">本次调查未读取 ${p.binary} 个二进制文件；不能推断其内容。</div></aside><section class="card pad"><div class="card-head"><div><div class="eyebrow">AGENT ANALYSIS · ${hostName(state.agentResult?.host||'github')} PR #${p.n}</div><h2>${esc(p.title)}</h2></div><span class="chip green">已完成 · 示例</span></div><div class="version">${esc(p.from)} → ${esc(p.to)} · ${short(p.base)} → ${short(p.head)}</div>${detailTabs()}${state.detailTab==='result'?`<section><h3>调查结论</h3><p>示例结果：订单提交路径存在重复执行风险；重试上限后的回调行为需要业务确认。此结论只针对 PR 固定版本及已读取的代码材料。</p><div class="finding"><h3>依据与未解决事项</h3><p>读取了订单服务、重试策略及控制器。未检查二进制图片；没有运行测试，也未验证合并后的最终代码。</p></div><h3>代码证据</h3><div class="material-row"><span><code>E1 · src/order/OrderService.java</code><br><small class="muted">修改后 · ${short(p.head)} · 第 42–47 行</small></span><button class="btn soft" data-code="agent-after">查看证据 ↗</button></div><div class="material-row"><span><code>E2 · src/order/OrderService.java</code><br><small class="muted">修改前 · ${short(p.base)} · 第 39–43 行</small></span><button class="btn soft" data-code="agent-before">查看证据 ↗</button></div></section>`:state.detailTab==='input'?inputPanel(p,null,'agent'):callsPanel('agent')}</section></div>`; }
    function detailTabs() { return `<div class="inner-tabs" style="margin-top:18px"><button data-detail="result" class="${state.detailTab==='result'?'active':''}">审查结果</button><button data-detail="input" class="${state.detailTab==='input'?'active':''}">${state.resultKind==='issue'?'输入与配置':'审查输入'}</button><button data-detail="calls" class="${state.detailTab==='calls'?'active':''}">实际调用</button></div>`; }
    function inputPanel(p,target,kind) { return `<h3>任务配置与固定范围</h3><dl class="kv"><dt>审查来源</dt><dd>${hostName(kind==='issue'?(state.issueResult?.host||'github'):(state.agentResult?.host||'github'))} PR #${p.n} · ${esc(p.title)}</dd><dt>分支</dt><dd>${esc(p.from)} → ${esc(p.to)}</dd><dt>源提交</dt><dd><code>${p.head}</code></dd><dt>目标提交</dt><dd><code>${p.target}</code></dd><dt>共同祖先</dt><dd><code>${p.base}</code></dd><dt>变更范围</dt><dd>${p.files} 个净变化文件，其中 ${p.binary} 个二进制未审查</dd>${target?`<dt>当前目标文件</dt><dd><code>${esc(target)}</code></dd>`:`<dt>本次要求</dt><dd>${esc(state.agentResult?.need||state.agentNeed)}</dd>`}</dl><div class="section" style="margin-top:18px"><h3>代码材料</h3><p class="muted small">点击查看当次保存的材料、版本、行号及是否已提供给模型。</p><div class="material-row"><span><code>${esc(target||p.items.find(i=>i[2]==='text')?.[0]||'文本文件')}</code><br><small class="muted">目标材料 · 修改前 · ${short(p.base)} · 已提供</small></span><button class="btn" data-material="before">查看材料</button></div><div class="material-row"><span><code>${esc(target||p.items.find(i=>i[2]==='text')?.[0]||'文本文件')}</code><br><small class="muted">目标材料 · 修改后 · ${short(p.head)} · 已提供</small></span><button class="btn" data-material="after">查看材料</button></div><div class="material-row"><span><code>src/order/OrderRepository.java</code><br><small class="muted">辅助声明 · 修改后 · 已提供</small></span><button class="btn" data-material="aux">查看材料</button></div></div><div class="notice warn">本原型用示例材料演示阅读方式，不包含真实仓库源码。</div>`; }
    function callsPanel(kind) { return `<h3>保存的实际调用</h3><p class="muted small">点击一条记录查看示例参数和返回；PR 解析在任务创建时完成，不暴露可任意查询 PR 的模型工具。</p>${(kind==='issue'?['专项模型请求 · 目标文件','输出格式校验 · 完成']:['初始模型请求','read_diff · PR 净变化清单','read_code · 修改后代码','submit_result · 显式提交']).map((name,i)=>`<div class="call-row"><button class="btn text" data-call="${i}">查看参数与返回</button><strong>${name}</strong><br><small class="muted">第 ${i+1} 步 · ${i===0?'模型调用':'已保存'} · 示例</small></div>`).join('')}`; }
    function resultPage() { const haveIssue=!!state.issueResult, haveAgent=!!state.agentResult; return `<div class="card pad" style="margin-bottom:18px"><div class="card-head" style="margin-bottom:0"><div><div class="eyebrow">REVIEW CENTER</div><h2>审查结果示例</h2></div><span class="muted small">${haveIssue||haveAgent?'已发起的模拟任务可在此阅读':'未发起任务时使用预置示例'}</span></div><div class="actions" style="margin-top:12px"><div class="segment"><button data-result="issue" class="${state.resultKind==='issue'?'active':''}">问题审查${haveIssue?' · 已发起':''}</button><button data-result="agent" class="${state.resultKind==='agent'?'active':''}">Agent 分析${haveAgent?' · 已发起':''}</button></div></div></div>${state.resultKind==='issue'?issueResult():agentResult()}`; }
    function render() { $('#app').innerHTML=state.page==='result'?resultPage():launchPage(state.page); bind(); }
    function bind() {
      const host=$('#host'); if(host) host.onchange=e=>hostChange(e.target.value);
      const choose=$('#choose-pr'); if(choose) choose.onclick=()=>openPicker(); const clear=$('#clear-pr'); if(clear) clear.onclick=()=>{state.selected=null;state.issueFiles.clear();render();};
      document.querySelectorAll('[data-file]').forEach(el=>el.onchange=e=>{const path=e.target.dataset.file; e.target.checked?state.issueFiles.add(path):state.issueFiles.delete(path); render();});
      const issueNote=$('#issue-note'); if(issueNote) issueNote.oninput=e=>state.issueNote=e.target.value; const need=$('#agent-need'); if(need) need.oninput=e=>state.agentNeed=e.target.value; const scope=$('#agent-scope'); if(scope) scope.oninput=e=>state.agentScope=e.target.value;
      const launch=$('#launch'); if(launch) launch.onclick=()=>{const p=state.selected; if(!p)return; if(state.page==='issue'){const files=[...state.issueFiles]; if(!files.length)return toast('请至少选择一个文本文件。'); state.issueResult={pr:p,host:state.host,files};state.resultKind='issue';state.target=0;} else {if(!state.agentNeed.trim())return toast('请填写 Agent 审查要求。');state.agentResult={pr:p,host:state.host,need:state.agentNeed};state.resultKind='agent';}state.detailTab='result';setPage('result');toast('模拟任务已完成，可浏览结果、材料与证据。');};
      const go=$('#go-result'); if(go) go.onclick=()=>{state.resultKind=state.page==='agent'?'agent':'issue';state.detailTab='result';setPage('result');};
      document.querySelectorAll('[data-result]').forEach(el=>el.onclick=()=>{state.resultKind=el.dataset.result;state.detailTab='result';render();}); document.querySelectorAll('[data-detail]').forEach(el=>el.onclick=()=>{state.detailTab=el.dataset.detail;render();}); document.querySelectorAll('[data-target]').forEach(el=>el.onclick=()=>{state.target=Number(el.dataset.target);render();}); document.querySelectorAll('[data-code]').forEach(el=>el.onclick=()=>openCode(el.dataset.code)); document.querySelectorAll('[data-material]').forEach(el=>el.onclick=()=>openMaterial(el.dataset.material)); document.querySelectorAll('[data-call]').forEach(el=>el.onclick=()=>openCall(Number(el.dataset.call)));
    }
    function openPicker() { state.modal='picker';state.draft=state.selected;state.query='';state.branch='all';state.shown=2;renderPicker(); }
    function closeOverlay() { state.modal=null; $('#overlay').innerHTML=''; }
    function renderPicker() { const list=prs[state.host].filter(p=>(state.branch==='all'||p.to===state.branch)&&(!state.query||(`#${p.n} ${p.n} ${p.title} ${p.author} ${p.from} ${p.to}`).toLowerCase().includes(state.query.toLowerCase()))); const shown=list.slice(0,state.shown); const branches=[...new Set(prs[state.host].map(p=>p.to))];
      $('#overlay').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="选择 PR"><div class="modal-head"><div><h2>选择 PR</h2><p class="muted small">${hostName(state.host)} · 选择待合并到目标分支的 PR</p></div><button class="close" id="modal-close" aria-label="关闭">×</button></div><div class="modal-body"><div class="notice">沿用选择提交弹窗的列表和单选方式。此处仅筛选已加载示例；输入完整编号可直接定位。</div><div class="modal-tools"><input class="search" id="pr-query" placeholder="筛选标题、作者，或输入 PR 编号" value="${esc(state.query)}"><select class="search" id="pr-branch"><option value="all">全部目标分支</option>${branches.map(b=>`<option value="${esc(b)}" ${state.branch===b?'selected':''}>${esc(b)}</option>`).join('')}</select><button class="btn" id="pr-locate">按编号定位</button></div><div class="pr-list">${shown.length?shown.map(p=>`<button class="pr-option ${state.draft?.n===p.n?'active':''}" data-pr="${p.n}"><span class="number">#${p.n}</span><span class="main"><strong>${esc(p.title)}</strong><small>${esc(p.from)} → ${esc(p.to)} · ${p.files} 个变更文件${p.binary?' · '+p.binary+' 个二进制':''}</small></span><span class="right">${esc(p.author)}<br>${esc(p.updated)}</span></button>`).join(''):'<div class="preview-empty">当前筛选下没有 PR</div>'}</div><div class="actions"><span class="muted small">已显示 ${shown.length} / ${list.length} 条示例</span>${list.length>shown.length?'<button class="btn text" id="pr-more">加载更多</button>':''}</div></div><div class="modal-foot"><button class="btn" id="pr-cancel">取消</button><button class="btn primary" id="pr-confirm" ${state.draft?'':'disabled'}>确认选择</button></div></div></div>`;
      $('#modal-close').onclick=$('#pr-cancel').onclick=closeOverlay; $('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeOverlay();}; $('#pr-query').oninput=e=>{const pos=e.target.selectionStart;state.query=e.target.value;renderPicker();const inp=$('#pr-query');inp.focus();inp.setSelectionRange(pos,pos);}; $('#pr-branch').onchange=e=>{state.branch=e.target.value;renderPicker();}; $('#pr-locate').onclick=()=>{const n=Number(state.query.replace(/^#/,''));const p=prs[state.host].find(x=>x.n===n);if(p){state.branch='all';state.query='';state.draft=p;renderPicker();toast(`已定位 PR #${n}`);}else toast('请输入此示例仓库中的完整 PR 编号。');}; const more=$('#pr-more');if(more)more.onclick=()=>{state.shown+=2;renderPicker();};document.querySelectorAll('[data-pr]').forEach(el=>el.onclick=()=>{state.draft=prs[state.host].find(x=>x.n===Number(el.dataset.pr));renderPicker();});$('#pr-confirm').onclick=()=>{if(state.draft)selectPr(state.draft);closeOverlay();};
    }
    const codeBefore=['public Order submit(Request request) {','    if (repository.exists(request.key())) {','        return repository.find(request.key());','    }','    return repository.save(new Order(request));','}'];
    const codeAfter=['public Order submit(Request request) {','    if (repository.exists(request.key())) {','        return repository.find(request.key());','    }','    // 重试请求继续执行','    return repository.save(new Order(request));','}'];
    function codeLines(side) { const lines=side==='before'?codeBefore:codeAfter; const start=side==='before'?39:42; return lines.map((line,i)=>`<div class="code-line ${i>=1&&i<=4?'highlight':''}"><span class="line-no">${start+i}</span><span class="${i===4?(side==='before'?'remove':'add'):''}">${esc(line)}</span></div>`).join(''); }
    function codeDialog(title,side,meta) { const p=(state.resultKind==='issue'?state.issueResult?.pr:state.agentResult?.pr)||prs.github[0];state.codeSide=side;state.modal='code';$('#overlay').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="代码证据"><div class="modal-head"><div><h2>${esc(title)}</h2><p class="muted small">${esc(meta)} · 固定版本代码证据</p></div><button class="close" id="modal-close" aria-label="关闭">×</button></div><div class="modal-body"><p><code>src/order/OrderService.java</code></p><div class="code-toolbar"><div class="segment"><button data-side="before" class="${side==='before'?'active':''}">修改前 · 共同祖先</button><button data-side="after" class="${side==='after'?'active':''}">修改后 · 源提交</button></div></div><p class="version">固定 SHA：<code>${side==='before'?p.base:p.head}</code></p><div class="code-box">${codeLines(side)}</div><div class="notice">高亮行来自保存的示例证据；切换前后侧会保留各自的原始行号。</div></div><div class="modal-foot"><button class="btn" id="modal-done">关闭</button></div></div></div>`;$('#modal-close').onclick=$('#modal-done').onclick=closeOverlay;document.querySelectorAll('[data-side]').forEach(el=>el.onclick=()=>codeDialog(title,el.dataset.side,meta));$('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeOverlay();}; }
    function openCode(which) { codeDialog('查看代码证据',which.includes('before')?'before':'after',which.startsWith('agent')?'Agent 引用 E1 / E2':'专项问题位置'); }
    function openMaterial(which) { const side=which==='before'?'before':'after'; if(which==='aux') { codeDialog('查看辅助声明','after','辅助材料 · 已提供给模型 · 声明摘要示例');return; } codeDialog('查看保存的代码材料',side,`${which==='before'?'目标材料 · 修改前':'目标材料 · 修改后'} · 已提供给模型`); }
    function openCall(i) { state.modal='call';const agent=state.resultKind==='agent';const names=agent?['初始模型请求','read_diff','read_code','submit_result']:['专项模型请求','输出格式校验'];const name=names[i]||'调用';const body=agent&&i===1?'{\n  "comparisonId": "PR1",\n  "path": null\n}':agent&&i===2?'{\n  "version": "V_SOURCE",\n  "path": "src/order/OrderService.java"\n}':'{\n  "taskScope": "固定 PR 净变化",\n  "model": "deepseek-flash"\n}';$('#overlay').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="实际调用"><div class="modal-head"><div><h2>${esc(name)}</h2><p class="muted small">保存的参数和返回 · 示例数据</p></div><button class="close" id="modal-close" aria-label="关闭">×</button></div><div class="modal-body"><h3>参数</h3><div class="code-box" style="padding:14px"><pre style="margin:0">${esc(body)}</pre></div><h3 style="margin-top:18px">返回</h3><div class="code-box" style="padding:14px"><pre style="margin:0">${esc(JSON.stringify({status:'OK',completeness:'COMPLETE',message:'已保存本轮调用与材料引用'},null,2))}</pre></div></div><div class="modal-foot"><button class="btn" id="modal-done">关闭</button></div></div></div>`;$('#modal-close').onclick=$('#modal-done').onclick=closeOverlay;$('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeOverlay();}; }
    render();
  </script>
</body>
</html>
