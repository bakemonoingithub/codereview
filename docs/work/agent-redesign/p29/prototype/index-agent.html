/* ===== v3 light visual language overrides ===== */
:root{--ink:#0f172a;--muted:#64748b;--line:#e8edf3;--bg:#f8fafc;--blue:#2563eb;--soft:#eff4ff;--green:#059669;--amber:#b45309;--red:#dc2626;--nav:#ffffff;--radius:20px;--shadow:0 1px 2px #0f172a0a,0 4px 16px #0f172a08}
body{font:14px/1.65 "Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;background:var(--bg);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button{border:1px solid #e2e8f0;border-radius:12px;padding:9px 16px;font-weight:600;font-size:13px;box-shadow:0 1px 2px #0f172a0d;transition:background .15s,border-color .15s,box-shadow .15s}
button:hover:not(:disabled){border-color:#cbd5e1;background:#f8fafc}
.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px #2563eb38}
.primary:hover:not(:disabled){background:#1d4ed8;border-color:#1d4ed8}
.quiet,.linklike,.close,.source-link,.report-citation{box-shadow:none}
input,select,textarea{border:1px solid #e2e8f0;border-radius:12px;padding:9px 12px;background:#f8fafc}
input:focus,select:focus,textarea:focus{background:#fff;border-color:#93b4f5;box-shadow:0 0 0 3px #2563eb1f;outline:0}
h1{font-size:32px;font-weight:700;letter-spacing:-.8px}h2{font-size:18px;font-weight:700}h3{font-weight:650}
code{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;color:#334155}
.layout{grid-template-columns:240px minmax(0,1fr)}
.sidebar{width:240px;background:#fff;border-right:1px solid var(--line);color:#475569;padding:28px 16px}
.brand{color:var(--ink);font-size:19px;font-weight:700;padding:0 8px 30px;display:flex;align-items:center}
.brand b{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 6px 14px #2563eb40;margin-right:12px}
.nav-label{color:#94a3b8;font-weight:600;padding:16px 12px 10px}
.sidebar button{color:#475569;border-radius:12px;padding:11px 14px;font-weight:500;box-shadow:none}
.sidebar button:hover{background:#f1f5f9;color:var(--ink)}
.sidebar button.active{background:var(--soft);color:var(--blue);font-weight:650}
.sidebar .foot{margin:auto 0 0;padding:16px;background:#f8fafc;border:1px solid var(--line);border-radius:16px;color:#64748b}
.sidebar .foot strong{color:var(--ink);font-weight:650}
.topbar{height:72px;background:#ffffffcc;backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;padding:0 40px}
.breadcrumbs span{color:#cbd5e1}
.prototype-label{border-radius:999px;background:var(--soft);color:var(--blue);border-color:#dbe6fe;font-weight:600;padding:4px 12px}
.avatar{width:36px;height:36px;background:#f1f5f9;border:1px solid #e2e8f0;color:#334155;font-weight:700}
.content{padding:40px 40px 56px}
.heading{margin-bottom:32px}.heading p{font-size:15px;margin-top:8px}
.card{border-radius:var(--radius);border-color:var(--line);box-shadow:var(--shadow)}
.stats{gap:20px;margin-bottom:32px}
.stat{border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow)}
.stat .value{font-size:40px;font-weight:700;letter-spacing:-1.5px;margin:10px 0 4px}
.stat .value small{font-size:15px}
.filters{padding:20px 24px;gap:12px}
.filters input{min-width:300px;flex:1}
th{background:#fafbfc;color:#64748b;font-weight:600;padding:14px 24px}
td{padding:20px 24px;font-size:14px}td strong{font-weight:650}
tbody tr{transition:background .12s}tbody tr:hover td{background:#f8fafc}
.table-footer{padding:16px 24px}
.badge{border-radius:999px;padding:3px 10px;font-weight:600}
.dot{width:6px;height:6px}
.notice{border-radius:14px;padding:13px 16px}
.section-top{padding:18px 24px}
.tabbar{padding:0 24px;gap:28px}.tabbar button{box-shadow:none;font-weight:500}
.target{padding:18px 20px}.target.selected{background:var(--soft);border-left-color:var(--blue)}
.issue{padding:24px 26px}
.feedback{border-radius:14px;background:#f8fafc}
.mini{border-radius:14px;background:#f8fafc}
.mini b{font-weight:700}
.tree .file-row{border-radius:10px}
.codeview{background:#fcfdfe}
.code-line.marked{background:#eff4ff;border-left-color:var(--blue)}
.report-overview{border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 28px}
.report-overview b{font-size:30px;font-weight:700}
.report-body h2{font-size:24px}
.modal{border-radius:24px;box-shadow:0 30px 80px #0f172a33}
.modal::backdrop{background:#0f172a59;backdrop-filter:blur(4px)}
.modal-head{padding:22px 28px}.modal-head h2{font-size:20px}
.modal-body{padding:24px 28px}.modal-foot{padding:18px 28px;background:#f8fafc}
.step .num{background:var(--blue);color:#fff}
.switch-line,.file-note,.preview-code,.scope-tree,.scope-selected{border-radius:14px}
.segmented button.active,.preview-tabs .active,.choice.selected{background:var(--soft);color:var(--blue);border-color:#bfd2fb}
.scenario{margin-top:32px;padding:16px 20px;border:1px solid var(--line);border-radius:16px;background:#fff;color:#64748b}
.scenario button{border-radius:999px;padding:4px 12px;font-weight:500}
.toast{background:var(--ink);border-radius:14px;left:calc(50% + 120px)}
.diagram{border-radius:16px}.node{border-radius:10px}
@media(max-width:1100px){.layout{grid-template-columns:200px minmax(0,1fr)}.sidebar{width:200px}.content{padding:28px 24px}.topbar{padding:0 24px}.stat .value{font-size:32px}}
@media(max-width:760px){.layout{display:block}.sidebar{width:100%;position:static;border-right:0;border-bottom:1px solid var(--line)}.filters input{min-width:0}.content{padding:20px 14px}.toast{left:50%}h1{font-size:26px}}
.field label:has(>input[type=radio]),.field label:has(>input[type=checkbox]){display:inline-flex;gap:8px;align-items:center;margin-right:20px;font-weight:500}

px 20px;font-weight:500}.agent-call-list button.active{background:var(--soft);color:var(--blue)}.agent-call-list small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.agent-call-content{padding:20px;min-width:0}.agent-call-content .preview-code{max-height:470px}.agent-evidence{display:block;text-align:left;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.agent-evidence:last-child{border-bottom:0}.agent-evidence .source-link{white-space:normal;text-align:left;line-height:1.7}.agent-scope-list{display:grid;gap:10px}.agent-scope-choice{padding:14px 16px;border:1px solid var(--line);border-radius:14px;display:flex;align-items:start;gap:12px}.agent-scope-choice input{margin-top:5px}.agent-scope-choice code{white-space:normal}.agent-scope-choice p{font-size:12px;color:var(--muted);margin-top:5px}.agent-context{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:16px 20px;background:#f8fafc;border-bottom:1px solid var(--line)}.agent-case-bar{margin-top:24px}.agent-case-bar .active{color:var(--blue);background:var(--soft);border-color:#bfd2fb}.agent-version-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px}.agent-call-json{font-size:11px}.agent-quick{color:var(--blue);background:var(--soft);border:1px solid #dbe6fe;border-radius:16px;padding:16px 20px;margin-bottom:24px}.agent-quick .row{flex-wrap:wrap}.agent-quick p{font-size:12px;margin-top:5px;color:var(--muted)}.agent-main-tabs{margin-bottom:24px;border:1px solid var(--line);border-radius:16px;overflow:auto}.agent-missing{color:var(--amber)}
@media(max-width:1250px){.agent-layout{grid-template-columns:minmax(0,1fr) 260px}.agent-meters{gap:10px}.agent-meter{padding:14px}.agent-article{padding:24px}.agent-call-layout{grid-template-columns:180px minmax(0,1fr)}}
@media(max-width:1000px){.agent-layout{grid-template-columns:1fr}.agent-meters{grid-template-columns:repeat(2,1fr)}.agent-side{display:grid;grid-template-columns:1fr 1fr;gap:16px}.agent-call-layout{grid-template-columns:1fr}.agent-call-list{display:flex;max-height:none;border-right:0;border-bottom:1px solid var(--line);overflow:auto}.agent-call-list button{min-width:170px;border-right:1px solid var(--line)}}
@media(max-width:760px){.agent-side{display:block}.agent-side>.card{margin-bottom:16px}.agent-article{padding:20px}.agent-meter strong{font-size:16px}.agent-main-tabs{gap:18px}.heading .actions{flex-wrap:wrap}.agent-context{flex-wrap:wrap}.agent-scope-choice{padding:12px}}

<dialog class="modal scope-modal" id="scope-dialog" aria-labelledby="scope-title"><div class="modal-head"><div><h2 id="scope-title">选择审查文件</h2><p class="small muted">勾选确定审查目标，点击蓝色文件名预览；关闭预览后继续选择。</p></div><button class="close" aria-label="关闭范围选择" onclick="closeScopePicker()">×</button></div><div id="scope-body" class="modal-body"></div><div class="modal-foot"><span id="scope-selection-count" class="muted small"></span><span class="spacer"></span><button onclick="closeScopePicker()">取消</button><button class="primary" id="scope-confirm" onclick="confirmScopePicker()">确认选择</button></div></dialog>

<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const files=['OrderService.java','PaymentGateway.java','OrderRepository.java'];
const paths=files.map(f=>'src/main/java/com/shop/order/'+f);
const state={page:'center',type:'ISSUE',target:0,tab:'result',filterType:'ALL',filterState:'ALL',query:'',project:'ALL',selected:new Set([0,1]),browserFile:0,browserMode:'file',scenario:'normal',drafts:{},saved:{'issue-1':{assessment:'准确',comment:'已复现重复请求。',revision:1}},reportSelection:new Set(['r1']),reportReady:false,reportFailed:false,newTask:false,taskCancelled:false,returnPage:'center'};
let form={type:'ISSUE',scope:'FILES',notes:{},smartSplit:false,source:'main',model:'默认模型',strategy:'订单服务规范',chosen:new Set([0,1]),dirty:false,fromHistory:false,sourceMoved:false};
const sampleCode=['package com.shop.order;','','import com.shop.payment.PaymentGateway;','import com.shop.order.OrderRepository;','','public class OrderService {','    private final PaymentGateway paymentGateway;','    private final OrderRepository repository;','','    public void submit(Order order) {','        repository.save(order);','        // 订单持久化后发送支付请求','        paymentGateway.charge(order.getPayment());','    }','','    public void retryPayment(Order order) {','        paymentGateway.charge(order.getPayment());','    }','}'];
const callText=JSON.stringify({model:'review-model',messages:[{role:'system',content:'你负责问题审查。内置任务和输出协议优先，文件说明优先于策略。只报告有代码依据的问题，返回包含 summary、issues、limitations 的 JSON。'},{role:'user',content:'策略：订单服务规范。\n文件说明：重点关注支付重试是否幂等。\n目标版本：b7a312e（演示简写）。\n目标文件：'+paths[0]+'\n'+sampleCode.map((l,i)=>(i+1)+': '+l).join('\n')+'\n辅助材料：PaymentGateway 接口声明，版本 b7a312e，第 8–14 行。charge(Payment payment)：发起支付请求，未提供幂等保证。\n缺口：第三方支付实现不可获取。\n输出协议：summary(string)、issues(array)、limitations(array)；问题需提供类别、严重度、目标位置、原因及建议。'}],max_tokens:4096},null,2);
const codeSamples={
 'OrderService.java':sampleCode,
 'PaymentGateway.java':['package com.shop.order;','','import com.shop.payment.Payment;','','/** 支付策略接口。 */','public interface PaymentGateway {','','    /**','     * 发起支付请求。','     * 调用方负责处理失败与超时。','     * 本接口未约定幂等保证。','     */','    void charge(Payment payment);','}'],
 'OrderRepository.java':['package com.shop.order;','','public interface OrderRepository {','    void save(Order order);','}']
};
let readerText='',toastTimer;
let readingFile='OrderService.java',readingStart=16,readingEnd=17;
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function badge(text,color=''){return `<span class="badge ${color}"><i class="dot"></i>${esc(text)}</span>`}
function scenarioBar(){return `<div class="scenario"><span>评审情境</span><button onclick="scenario('normal')">默认</button><button onclick="scenario('empty')">空列表</button><button onclick="scenario('load-error')">加载失败</button><button onclick="scenario('running')">执行中 / 取消</button><button onclick="scenario('capacity')">容量超限</button><button onclick="scenario('conflict')">反馈冲突</button><button onclick="scenario('no-denominator')">无明确判定</button><button onclick="scenario('missing-source')">原文缺失</button><button onclick="scenario('report-failed')">报告失败</button></div>`}
function scenario(s){state.scenario=s;if(['running','capacity','conflict','missing-source'].includes(s)){state.type='ISSUE';state.target=s==='capacity'?2:0;go('detail')}else if(s==='report-failed'){state.reportReady=false;state.reportFailed=true;go('reports')}else{render()}toast('已切换演示情境')}
function canLeave(){return !Object.values(state.drafts).some(d=>d.dirty)||confirm('有尚未保存的反馈。离开此页面将丢弃这些修改，是否继续？')}
function go(page){if(page!==state.page&&!canLeave())return;if(page!==state.page)state.drafts={};state.page=page;render();window.scrollTo(0,0)}
function render(){document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===state.page||(state.page==='detail'&&el.dataset.nav==='center')||(state.page==='report'&&el.dataset.nav==='reports')));$('#crumb').textContent=({center:'审查中心',browser:'代码浏览',detail:'审查详情',reports:'报告',report:'报告阅读',settings:'项目管理',models:'模型管理',prompts:'提示词管理',strategies:'策略管理'})[state.page];$('#app').innerHTML=({center:renderCenter,browser:renderBrowser,detail:renderDetail,reports:renderReports,report:renderReport,settings:renderSettings,models:renderModels,prompts:renderPrompts,strategies:renderStrategies})[state.page]()}
const tasks=[{name:'订单提交与支付重试',type:'ISSUE',project:'订单服务',range:'文件内容 · 3 个文件',status:'部分完成',color:'amber',counts:'2 完成 / 1 失败',time:'10-20 10:42',version:'b7a312e',id:'t1'},{name:'支付路由策略识别',type:'PATTERN',project:'订单服务',range:'文件内容 · 1 个文件',status:'已完成',color:'green',counts:'1 / 1 完成',time:'10-20 10:18',version:'b7a312e',id:'t2'},{name:'订单核心文件依赖',type:'COUPLING',project:'订单服务',range:'文件内容 · 1 个文件',status:'已完成',color:'green',counts:'1 / 1 完成',time:'10-20 09:56',version:'a84cd92',id:'t3'},{name:'修复重试逻辑的提交',type:'ISSUE',project:'支付服务',range:'提交差异 · 2 个文件',status:'已完成',color:'green',counts:'2 / 2 完成',time:'10-19 17:24',version:'e91bd20',id:'t4'}];
tasks.forEach(t=>t.projectId=t.project==='订单服务'?'project-order':'project-payment');
const typeLabel=t=>({ISSUE:'问题审查',PATTERN:'设计模式',COUPLING:'耦合度',AGENT:'Agent 分析'})[t];
function renderCenter(){let list=tasks.filter(t=>(!state.reviewProjectId||t.projectId===state.reviewProjectId)&&(state.filterType==='ALL'||t.type===state.filterType)&&(state.filterState==='ALL'||t.status===state.filterState)&&(state.project==='ALL'||t.project===state.project)&&t.name.includes(state.query));if(state.scenario==='empty')list=[];return `<div class="heading"><div><h1>审查中心</h1><p>查看逐文件分析结果，跟进反馈，并将已完成结果整理成报告。</p></div><div class="actions"><button onclick="openReportForm()">生成报告</button><button class="primary" onclick="openForm()">＋ 发起审查</button></div></div><div class="stats center-stats"><div class="stat"><span class="muted small">审查任务</span><div class="value">4<small>个</small></div><span class="muted small">覆盖 2 个项目</span></div><div class="stat"><span class="muted small">结果级反馈</span><div class="value">—<small>暂无明确判定</small></div><span class="muted small">模式 1 项、耦合 1 项未反馈</span></div></div>${state.reviewProjectId?`<div class="notice row">当前项目：${esc(managedName('projects',state.reviewProjectId))}<span class="spacer"></span><button class="quiet" onclick="state.reviewProjectId=null;render()">查看全部项目</button></div>`:''}${state.newTask?'<div class="notice">新任务已受理。此处为演示记录，刷新页面后重置。</div>':''}<section class="card"><div class="filters"><input aria-label="搜索任务" placeholder="搜索任务名称" value="${esc(state.query)}" onchange="state.query=this.value;render()"><select aria-label="项目筛选" onchange="state.project=this.value;state.reviewProjectId=null;render()">${opts(['ALL','订单服务','支付服务'],['全部项目','订单服务','支付服务'],state.project)}</select><select aria-label="类型筛选" onchange="state.filterType=this.value;render()">${opts(['ALL','ISSUE','PATTERN','COUPLING'],['全部专项类型','问题审查','设计模式','耦合度'],state.filterType)}</select><select aria-label="状态筛选" onchange="state.filterState=this.value;render()">${opts(['ALL','已完成','部分完成'],['全部状态','已完成','部分完成'],state.filterState)}</select><span class="spacer"></span><span class="muted small">专项审查</span></div>${state.scenario==='load-error'?'<div class="pad"><div class="notice red">加载下一页失败。已显示的记录保持不变。<button class="quiet" onclick="scenario(\'normal\')">重试</button></div></div>':''}<div class="table-wrap"><table><thead><tr><th>审查任务</th><th>类型 / 范围</th><th>状态</th><th>代码版本</th><th>发起时间</th><th></th></tr></thead><tbody>${list.map(t=>`<tr><td><strong>${t.name}</strong><span class="muted">${t.project}</span></td><td>${typeLabel(t.type)}<span class="muted">${t.range}</span></td><td>${badge(t.status,t.color)}<span class="muted">${t.counts}</span></td><td><code>${t.version}</code></td><td>${t.time}</td><td><button class="quiet" onclick="openTask('${t.id}')">查看详情 →</button></td></tr>`).join('')}</tbody></table></div>${!list.length?'<div class="empty">没有符合条件的审查任务。<br><button class="quiet" onclick="state.query=\'\';state.filterType=\'ALL\';state.filterState=\'ALL\';state.project=\'ALL\';state.reviewProjectId=null;scenario(\'normal\')">重置筛选</button></div>':''}<div class="table-footer"><span>共 ${list.length} 条记录 · 按发起时间排序</span><div class="row"><button disabled aria-label="上一页">‹</button><button class="primary">1</button><button disabled aria-label="下一页">›</button></div></div></section>${scenarioBar()}`}
function opts(values,labels,current){return values.map((v,i)=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(labels[i])}</option>`).join('')}
function openTask(id){state.newTask=false;state.detailTargets=null;const t=tasks.find(x=>x.id===id);state.type=t.type;state.target=0;state.tab='result';state.detailDiff=id==='t4';state.detailTaskId=id;state.returnPage='center';state.scenario='normal';go('detail')}
function renderBrowser(){return `<div class="heading"><div><h1>代码浏览</h1><p>浏览固定版本的代码，选择文件后发起专项审查。</p></div><button class="primary" onclick="openForm(true)">审查已选文件 (${state.selected.size})</button></div><section class="card"><div class="filters"><select aria-label="代码项目"><option>订单服务</option></select><select aria-label="代码分支"><option>main</option></select><code>b7a312e</code><span class="muted small">当前浏览版本</span><span class="spacer"></span><button class="quiet" onclick="state.browserMode=state.browserMode==='file'?'diff':'file';render()">${state.browserMode==='file'?'查看提交差异':'返回文件内容'}</button></div><div class="browser-grid"><aside class="tree"><input id="path-filter" style="width:100%" aria-label="筛选文件路径" placeholder="筛选文件路径" oninput="filterPaths(this.value)"><div class="folder">▾ src / main / java / com / shop</div><div class="folder" style="padding-left:15px">▾ order</div>${files.map((f,i)=>fileTreeRow(i,{checked:state.selected.has(i),active:state.browserFile===i,context:'browser'})).join('')}<p class="muted small" style="margin-top:16px">点击文件名阅读代码，勾选复选框加入审查；两种操作相互独立。</p></aside><div class="codeview"><div class="codebar"><strong>${files[state.browserFile]}</strong><span class="spacer"></span>${state.browserMode==='diff'?'<span class="badge blue">父提交 12ac80f → b7a312e</span>':'<span class="muted">b7a312e · 完整原文</span>'}</div>${codeHtml(state.browserMode==='diff',false)}</div></div></section>${scenarioBar()}`}
function fileTreeRow(i,{checked=false,active=false,context='browser',status=''}={}){const viewer=context==='scope'?'openScopePreview':'openBrowserFile',checker=context==='scope'?'toggleScopeFile':'toggleBrowserFile';return `<div class="file-row ${active?'selected':''}" data-file="${esc(files[i])}" data-tree-context="${context}"><input aria-label="选择 ${esc(files[i])} 参与审查" title="勾选审查文件" type="checkbox" ${checked?'checked':''} onchange="${checker}(${i},this.checked)"><button type="button" class="linklike file-name" title="阅读 ${esc(files[i])}" ${active?'aria-current="true"':''} onclick="event.stopPropagation();${viewer}(${i})">${esc(files[i])}</button>${status?`<span class="badge scope-status">${esc(status)}</span>`:''}</div>`}
function openBrowserFile(i){const filter=$('#path-filter')?.value||'',scroll=document.querySelector('.tree')?.scrollTop||0;state.browserFile=i;render();$('#path-filter').value=filter;filterPaths(filter);document.querySelector('.tree').scrollTop=scroll;}
function filterPaths(v){document.querySelectorAll('[data-file]').forEach(el=>el.classList.toggle('hidden',!el.dataset.file.toLowerCase().includes(v.toLowerCase())))}
function toggleBrowserFile(i,v){v?state.selected.add(i):state.selected.delete(i);const b=document.querySelector('.heading .primary');b.textContent=`审查已选文件 (${state.selected.size})`}
function codeHtml(diff=false,highlight=true){const name=highlight?readingFile:files[state.browserFile];return `<div class="code-lines">${codeSamples[name].map((line,i)=>`<div class="code-line ${highlight&&i+1>=readingStart&&i+1<=readingEnd?'marked':''} ${diff&&i===16?'added':''}" ${highlight&&i+1===readingStart?'id="evidence-line"':''}><span class="ln">${i+1}</span><span class="source">${diff&&i===16?'+ ':''}${esc(line)}</span></div>`).join('')}</div>`}

function renderDetail(){const running=state.scenario==='running'&&!state.taskCancelled;const issueType=state.type==='ISSUE',partial=issueType&&state.detailTaskId!=='t4',displayTask=tasks.find(t=>t.id===state.detailTaskId&&t.type===state.type);let title=displayTask&&!state.newTask?displayTask.name:issueType?'订单提交与支付重试':state.type==='PATTERN'?'支付路由策略识别':'订单核心文件依赖';return `<div style="margin-bottom:16px"><button class="quiet" style="padding-left:0" onclick="go(state.returnPage)">← 返回${state.returnPage==='browser'?'代码浏览':'审查中心'}</button></div><div class="heading"><div><div class="row" style="margin-bottom:8px"><h1>${title}</h1>${badge(state.taskCancelled&&state.scenario==='running'?'已取消':running?'执行中':partial?'部分完成':'已完成',running?'blue':partial?'amber':'green')}</div><p>${esc(detailMaterialSource().project)} <span style="padding:0 9px">/</span> ${typeLabel(state.type)} <span style="padding:0 9px">/</span> ${state.detailDiff?'提交差异 · '+detailMaterialSource().baseSha+' → '+detailMaterialSource().headSha:'文件内容 · main'} <span style="padding:0 9px">/</span> <code>${detailMaterialSource().headSha}</code></p></div><div class="actions">${running?'<button class="danger" onclick="cancelTask()">取消任务</button>':''}<button onclick="openForm(false,true)">复制参数新建</button><button onclick="openReportForm()">选结果生成报告</button></div></div>${running?(state.newTask?'<div class="notice">演示任务正在执行，尚未产生完整结果。所选文件按独立目标展示，未调用真实模型。</div>':'<div class="notice">正在分析 PaymentGateway.java。OrderService.java 已完成；取消后保留已完成的结果。</div>'):state.taskCancelled&&state.scenario==='running'?'<div class="notice amber">任务已取消。已完成文件仍可阅读；其他文件已停止，不会自动继续。</div>':partial?'<div class="notice amber">2 个文件已完成，1 个文件失败。已完成结果可阅读和选材；失败不表示该文件没有问题。</div>':''}${renderTaskAssessment()}<div class="two-col"><aside class="card"><div class="section-top"><h3>目标文件</h3><span class="spacer"></span><span class="muted small">${state.newTask?'0 / '+detailFiles().length:issueType?'2 / '+detailFiles().length:'1 / 1'} 完成</span></div>${detailFiles().map((f,i)=>`<div class="target ${state.target===i?'selected':''}" role="button" tabindex="0" onkeydown="if(event.key==='Enter')selectTarget(${i})" onclick="selectTarget(${i})"><strong>${esc(f)}</strong><div class="muted small">src/main/java/com/shop/order</div><div class="meta">${state.newTask?badge(state.taskCancelled?'已取消':'待完成',state.taskCancelled?'amber':'blue'):badge(i===2?'失败':i===1&&running?'执行中':'已完成',i===2?'red':i===1&&running?'blue':'green')}<span class="muted small">${state.newTask?'暂无完整结果':issueType?(i===0?'2 个问题':i===1?'未发现问题':'上下文超限'):state.type==='PATTERN'?'1 个模式候选':'2 个已解析依赖'}</span></div></div>`).join('')}<div class="pad small muted">每个文件独立准备材料和保存结果。辅助文件不会自动成为审查目标。</div></aside><section class="card"><div class="section-top"><h2>${detailFiles()[state.target]||detailFiles()[0]}</h2><span class="spacer"></span><span class="muted small">版本 ${detailMaterialSource().headSha}</span></div><div class="tabbar">${[['result','审查结果'],['materials','材料与边界'],['calls','实际调用']].map(([k,v])=>`<button class="${state.tab===k?'active':''}" onclick="state.tab='${k}';render()">${v}</button>`).join('')}</div>${state.tab==='calls'?renderCalls():state.tab==='materials'?renderMaterials():renderResults()}</section></div>${scenarioBar()}`}
function selectTarget(i){state.target=i;state.tab='result';render()}
function renderTaskAssessment(){if(state.type!=='ISSUE')return '';const subjects=state.newTask?[]:['issue-1','issue-2'];const counts={accurate:0,inaccurate:0,unknown:0,unassessed:0};subjects.forEach(id=>{const a=state.scenario==='no-denominator'?null:state.saved[id]?.assessment;counts[a==='准确'?'accurate':a==='不准确'?'inaccurate':a==='无法判断'?'unknown':'unassessed']++});const denominator=counts.accurate+counts.inaccurate;return `<div class="notice row wrap" data-task-assessment><strong>本任务问题判定准确率</strong><span>${denominator?Math.round(counts.accurate/denominator*100)+'%':'— · 暂无明确判定'}</span><span class="muted small">准确 ${counts.accurate} · 不准确 ${counts.inaccurate} · 无法判断 ${counts.unknown} · 未反馈 ${counts.unassessed}</span><span class="spacer"></span><span class="small muted">仅统计本任务已完成结果中的问题</span></div>`}
function renderResults(){if(state.newTask)return '<div class="empty">'+(state.taskCancelled?'任务已取消，当前文件没有完整结果。':'文件正在等待分析，尚无完整结果。')+'</div>';if(state.type==='ISSUE'&&state.target===2)return `<div class="pad"><div class="notice red"><strong>文件分析失败：上下文超限</strong><br>模型无法容纳完整请求。本次未开启智能拆分，未发送拆分请求；已保存调用输入和错误。</div><p class="muted small">此文件没有完整审查结果，不能计为「未发现问题」，也不能选作报告材料。</p><div class="actions" style="margin-top:18px"><button onclick="state.tab='calls';render()">查看失败调用</button><button class="primary" onclick="openForm(false,true)">复制参数并调整</button></div></div>`;if(state.type==='ISSUE'&&state.target===1)return `<div class="pad"><div class="notice">基于本次目标代码及已取得声明，未发现有证据支持的问题。</div><p class="small muted">审查已完成。未发现问题不等于完整验证了依赖实现或业务正确性。</p></div>`;if(state.type==='PATTERN')return `<div class="pad"><div class="row"><h2>策略模式候选</h2>${badge('行为型','blue')}</div><p class="muted small" style="margin:6px 0 15px">目标角色：支付策略接口</p><p>PaymentGateway 将支付动作抽象为统一接口，调用方依赖接口而非具体支付实现。当前可见代码符合策略接口角色。</p><div style="margin:16px 0"><button class="source-link" onclick="openCode('PaymentGateway.java',8,14)">PaymentGateway.java : 8–14 ↗</button></div><div class="notice amber">仅分析目标文件及有限声明，未调查所有实现与调用方；不据此确认整个模块已完整采用策略模式。</div>${feedback('result-pattern','整个设计模式审查结果')}</div>`;if(state.type==='COUPLING')return `<div class="pad"><h2>文件级依赖关系</h2><p class="muted small">由声明中的类型引用计算，解释以已取得的关系为限。</p><div class="subgrid"><div class="mini"><b>2</b><span>仓库内已解析出向依赖</span></div><div class="mini"><b>1</b><span>未可靠定位的类型</span></div><div class="mini"><b>3</b><span>声明引用的不同外部类型</span></div></div><div class="diagram"><div class="node focus">OrderService</div><div class="edge">→</div><div style="display:grid;gap:12px"><div class="node">PaymentGateway</div><div class="node">OrderRepository</div></div></div><p class="small">目标文件依赖支付接口与订单仓储。支付契约的调整可能影响提交和重试路径，可优先保持接口职责稳定。</p><p style="margin:12px 0"><button class="source-link" onclick="openCode('OrderService.java',6,8)">OrderService.java : 6–8 ↗</button></p><div class="notice amber">第三方 Payment 类型未可靠定位。此处不包含全仓入向关系，不将未解析类型计为零依赖。</div>${feedback('result-coupling','整个耦合度审查结果')}</div>`;return `<div class="issue"><div class="result-title">${badge('高','red')}<h3>重试支付可能造成重复扣款</h3><span class="spacer"></span><span class="muted small">正确性</span></div><button class="source-link" onclick="openCode('OrderService.java',16,17)">OrderService.java : 16–17 ${state.detailDiff?'· 修改后':''} ↗</button><div class="body"><strong>原因</strong><p>retryPayment 直接再次调用扣款接口，没有传递稳定的幂等标识；可见接口契约未承诺重复请求只扣款一次。客户端或调度器重试时，可能重复发起支付。</p><p style="margin-top:9px"><strong>建议</strong><br>为同一订单支付使用稳定的请求标识，并在调用前检查或记录支付状态，明确失败与超时后的查询流程。</p></div>${feedback('issue-1','此问题')}</div><div class="issue"><div class="result-title">${badge('中','amber')}<h3>支付失败后订单状态缺少明确处理</h3></div><button class="source-link" onclick="openCode('OrderService.java',10,13)">OrderService.java : 10–13 ↗</button><div class="body">订单保存后立即发起支付；支付抛出异常时，已有订单的状态和后续处理未在目标代码中体现。建议显式记录待支付状态并定义失败处理；事务及补偿实现尚未取得，需保留判断边界。</div>${feedback('issue-2','此问题')}</div>`}
function feedback(id,subject){const saved=state.saved[id]||{assessment:null,comment:'',revision:0};const d=state.drafts[id]||(state.drafts[id]={...saved,dirty:false});return `<section class="feedback" data-feedback="${id}"><div class="row"><strong class="small">准确度反馈</strong><span class="muted small">作用于${subject}</span><span class="spacer"></span><span class="feedback-status">${d.dirty?'尚未保存':saved.revision?'已保存 · 10-20 10:48':'尚未反馈'}</span></div><div class="choices">${['准确','不准确','无法判断'].map(a=>`<button class="choice ${d.assessment===a?'selected':''}" onclick="chooseAssessment('${id}','${a}')">${a}</button>`).join('')}<button class="quiet small" onclick="chooseAssessment('${id}',null)">清除评价</button></div><textarea aria-label="${id} 独立评论" placeholder="可选评论，可不选择评价而单独保存" oninput="editComment('${id}',this.value)">${esc(d.comment)}</textarea><div class="row"><span class="muted small">评论与评价分别保留；切换问题时保留页面内输入。</span><span class="spacer"></span><button class="primary" onclick="saveFeedback('${id}')">保存反馈</button></div><div class="feedback-error" aria-live="polite"></div></section>`}
function chooseAssessment(id,a){const d=state.drafts[id];d.assessment=a;d.dirty=true;render()}
function editComment(id,v){state.drafts[id].comment=v;state.drafts[id].dirty=true;const el=document.querySelector(`[data-feedback="${id}"] .feedback-status`);if(el)el.textContent='尚未保存'}
function saveFeedback(id){const d=state.drafts[id],el=document.querySelector(`[data-feedback="${id}"] .feedback-error`);if(state.scenario==='conflict'){el.innerHTML='<div class="notice amber" style="margin:12px 0 0">其他页面已更新反馈，当前输入已保留。请读取最新内容后合并，再保存。<button class="quiet" onclick="resolveConflict(\''+id+'\')">读取最新内容</button></div>';return}if(state.scenario==='load-error'){el.innerHTML='<p class="error-text">保存失败，输入已保留。请重试。</p>';return}state.saved[id]={assessment:d.assessment,comment:d.comment,revision:(state.saved[id]?.revision||0)+1};d.dirty=false;render();toast('反馈已保存（本页演示）')}
function resolveConflict(id){state.scenario='normal';const el=document.querySelector(`[data-feedback="${id}"] .feedback-error`);el.innerHTML='<div class="notice" style="margin:12px 0 0">最新评价：无法判断；最新评论：待补充支付契约。当前输入保持不变，请手工合并后再保存。</div>';toast('已读取最新版本，可合并后保存')}
function detailMaterialSource(){let task=tasks.find(t=>t.id===state.detailTaskId&&t.type===state.type)||tasks.find(t=>t.type===state.type);if(state.newTask)return {taskId:'new-task',project:'订单服务',headSha:state.lastInput?.version||'b7a312e',baseSha:state.detailDiff?'12ac80f':null};return {taskId:task.id,project:task.project,headSha:task.version,baseSha:state.detailDiff?'12ac80f':null}}
function demoMaterialCode(sha,file){if(sha==='b7a312e')return codeSamples[file]?.slice();if(sha==='a84cd92'&&file==='OrderService.java')return reportSourceData.r5.code.split('\n');if(sha==='12ac80f'){if(file==='OrderService.java')return sampleCode.slice(0,15).concat('}');if(file==='PaymentGateway.java')return codeSamples[file].slice()}if(sha==='e91bd20'){if(file==='OrderService.java')return sampleCode.map(l=>l.replace('charge(order.getPayment());','charge(order.getPayment(), order.getId());'));if(file==='PaymentGateway.java')return codeSamples[file].map(l=>l.replace('charge(Payment payment);','charge(Payment payment, String requestId);'))}return null}
function detailMaterials(){if(state.newTask)return [];const source=detailMaterialSource(),name=detailFiles()[state.target]||detailFiles()[0],i=files.indexOf(name),after=demoMaterialCode(source.headSha,name),before=source.baseSha?demoMaterialCode(source.baseSha,name):null;const materials=[{id:source.taskId+':'+name+':target',name,path:paths[i],role:'分析目标',disposition:'已发送',kind:source.baseSha?'DIFF':'CODE',sha:source.headSha,baseSha:source.baseSha,firstLine:1,content:after,fullContent:after,before,complete:true}];if(name==='OrderService.java'){const full=demoMaterialCode(source.headSha,'PaymentGateway.java');materials.push({id:source.taskId+':'+name+':contract',name:'PaymentGateway.java',path:paths[1],role:'辅助接口声明',disposition:'已发送',kind:'CODE',sha:source.headSha,firstLine:8,content:full?full.slice(7,14):null,fullContent:full,complete:false});const repo=demoMaterialCode(source.headSha,'OrderRepository.java');materials.push({id:source.taskId+':'+name+':unused',name:'OrderRepository.java',path:paths[2],role:'辅助成员签名',disposition:'已读取，未发送',kind:'CODE',sha:source.headSha,firstLine:3,content:repo?repo.slice(2,4):null,fullContent:repo,complete:false})}return materials}
function activeDetailMaterial(){const materials=detailMaterials();let selected=materials.find(m=>m.id===state.materialId);if(!selected){selected=materials[0];state.materialId=selected?.id;state.materialMode=selected?.kind==='DIFF'?'changes':'content'}return selected}
function selectDetailMaterial(id){if(!detailMaterials().some(m=>m.id===id))return;state.materialId=id;state.materialMode=detailMaterials().find(m=>m.id===id).kind==='DIFF'?'changes':'content';state.tab='materials';openMaterialReader()}
function changeMaterialMode(mode){state.materialMode=mode;openMaterialReader()}
function diffCodeHtml(before,after){const rows=scopeDiffRows(before,after);return `<div class="codeview scope-preview"><div class="code-lines">${rows.map(r=>`<div class="code-line ${r.kind}"><span class="ln">${r.oldLine||''}</span><span class="ln">${r.newLine||''}</span><span class="source">${r.kind==='added'?'＋':r.kind==='deleted'?'−':' '} ${esc(r.text)}</span></div>`).join('')}</div></div>`}
function materialViewText(material,mode='content'){if(!material)return '';if(material.kind==='DIFF'&&mode==='changes'){if(!material.before||!material.content)return '';const rows=scopeDiffRows(material.before,material.content);return `--- ${material.baseSha}/${material.path}\n+++ ${material.sha}/${material.path}\n`+rows.map(r=>(r.kind==='added'?'+':r.kind==='deleted'?'-':' ')+r.text).join('\n')}return (material.kind==='DIFF'&&mode==='before'?material.before:material.content)?.join('\n')||''}
function materialViewHtml(material,mode='content'){if(!material)return '<div class="empty">尚未准备材料，当前没有可阅读的代码快照。</div>';if(state.scenario==='missing-source')return '<div class="notice red">对应版本的材料原文不可取得，不能用当前分支或其他文件内容替换。</div>';if(material.kind==='DIFF'){if(mode==='before'&&!material.before)return '<div class="notice amber">修改前原文未保存，不能用修改后内容替代。</div>';if(!material.content)return '<div class="notice amber">修改后材料原文未保存，无法完整显示差异。</div>';if(mode==='changes'){if(!material.before)return '<div class="notice amber">修改前原文缺失，无法显示完整差异。</div>';return `<div class="small muted" style="margin-bottom:8px">修改前 ${material.baseSha} → 修改后 ${material.sha} · 前后侧原始行号</div>`+diffCodeHtml(material.before,material.content)}const lines=mode==='before'?material.before:material.content;return `<div class="small muted" style="margin-bottom:8px">${mode==='before'?'修改前 '+material.baseSha:'修改后 '+material.sha}</div>`+scopeCodeBlock(lines,1)}if(!material.content)return '<div class="notice amber">该版本的材料原文未保存。仅保留来源记录，不将缺失解释为空文件。</div>';return `<div class="small muted" style="margin-bottom:8px">${material.complete?'完整目标原文':'已保存的声明片段'} · 第 ${material.firstLine}–${material.firstLine+material.content.length-1} 行</div>`+scopeCodeBlock(material.content,material.firstLine)}
function materialLineRange(lines,firstLine=1){return lines?lines.length?`第 ${firstLine}–${firstLine+lines.length-1} 行`:'空文件，无代码行':'行范围未保存'}
function materialMetadata(material){return material.kind==='DIFF'?`修改前 ${material.baseSha} · ${materialLineRange(material.before)}<br>修改后 ${material.sha} · ${materialLineRange(material.content)}`:`${material.sha} · ${materialLineRange(material.content,material.firstLine)}`}
function renderMaterials(){const source=detailMaterialSource(),materials=detailMaterials();return `<div class="pad"><h3>实际分析材料</h3><p class="small muted" style="margin:8px 0 17px">目标：${esc(detailFiles()[state.target]||detailFiles()[0])} · ${esc(source.project)}<br>点击「查看代码」阅读保存的原文或变更，发送状态按材料逐项标记。</p>${materials.length?`<div class="table-wrap"><table><thead><tr><th>材料 / 固定版本</th><th>用途</th><th>调用输入</th><th>阅读</th></tr></thead><tbody>${materials.map(m=>`<tr><td><strong>${esc(m.name)}</strong><span class="muted small">${materialMetadata(m)}</span></td><td>${m.role}<span class="muted">${m.kind==='DIFF'?'修改前后与改动':m.complete?'完整目标文件':'必要声明片段'}</span></td><td>${badge(m.disposition,m.disposition==='已发送'?'blue':'')}</td><td><button class="quiet" onclick="selectDetailMaterial('${m.id}')">查看代码</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">尚未准备材料，当前没有可阅读的代码快照。</div>'}<div class="notice amber" style="margin-top:18px">第三方资料缺失与未发送材料分别记录。辅助声明仅作为背景，不自动成为审查目标。</div><button onclick="state.tab='calls';render()">查看完整调用</button></div>`}

function freezeReportSources(ids,feedback){return [...new Set(ids)].map(id=>{const candidate=candidates.find(c=>c.id===id),data=reportSourceData[id];if(!candidate?.ok||!data)throw new Error('报告材料必须是完整的审查结果');const snapshot=JSON.parse(JSON.stringify({...data,id}));snapshot.feedback={};const subjects=snapshot.kind==='问题审查'?snapshot.findings.map(f=>f.id):[snapshot.feedbackId];subjects.forEach(key=>snapshot.feedback[key]=JSON.parse(JSON.stringify(feedback[key]||{assessment:null,comment:'',revision:0})));return snapshot})}

function reportGroups(sources=reportSources()){const groups=new Map();sources.forEach(source=>{const key=source.repo+'@'+source.sha;if(!groups.has(key))groups.set(key,{project:source.project,repo:source.repo,sha:source.sha,sources:[]});groups.get(key).sources.push(source)});return [...groups.values()]}
function reportFeedbackSummary(kind,sources=reportSources()){const values=sources.filter(s=>s.kind===kind).flatMap(s=>Object.values(s.feedback));const count={accurate:0,inaccurate:0,unknown:0,unassessed:0};values.forEach(v=>count[v.assessment==='准确'?'accurate':v.assessment==='不准确'?'inaccurate':v.assessment==='无法判断'?'unknown':'unassessed']++);const denominator=count.accurate+count.inaccurate;return `${kind}：准确 ${count.accurate}，不准确 ${count.inaccurate}，无法判断 ${count.unknown}，未反馈 ${count.unassessed}；准确率 ${denominator?Math.round(count.accurate/denominator*100)+'%':'—（暂无明确判定）'}。`}

function buildReport(){const sources=reportSources(),groups=reportGroups(sources),ref=s=>'[S'+(sources.findIndex(x=>x.id===s.id)+1)+']',tasksCount=new Set(sources.map(s=>s.taskId)).size;const lines=['# '+(state.frozenTitle||'订单服务专项审查报告'),'','## 概览',`本报告选取 ${sources.length} 个完整审查结果，来自 ${tasksCount} 个审查任务，覆盖 ${groups.length} 个仓库版本。结果、评价及评论均反映生成时的冻结内容。`,'','## 主要结论'];const issueSources=sources.filter(s=>s.findings?.length);if(issueSources.length)issueSources.forEach(s=>lines.push(`优先处理 ${s.name} 的支付重试与失败状态风险；这些问题属于 ${s.sha} 的问题审查结果。${ref(s)}`));const pattern=sources.find(s=>s.patterns);if(pattern)lines.push(`支付接口具有策略接口角色，可作为理解抽象边界的依据；尚未确认完整模块实现。${ref(pattern)}`);const coupling=sources.find(s=>s.coupling);if(coupling)lines.push(`依赖结果展示 ${coupling.sha} 的文件级关系，仅用于对应版本的结构阅读，不与其他版本合并为当前指标。${ref(coupling)}`);if(!issueSources.length&&!pattern&&!coupling)lines.push('所选结果未报告有代码依据的问题；不据此宣称业务已完整验证。');groups.forEach(group=>{lines.push('','## '+group.project+' · '+group.sha,`仓库：${group.repo}；以下结果均对应版本 ${group.sha}。`);group.sources.forEach(s=>{lines.push('','### '+s.name+' · '+s.kind+' '+ref(s),`来源任务：${s.taskTitle}；目标文件：${s.path}。`,s.summary);if(s.findings?.length)s.findings.forEach(f=>lines.push('',`${f.severity}优先级：${f.title}（第 ${f.start}–${f.end} 行）。${ref(s)}`,'原因：'+f.reason,'建议：'+f.suggestion));if(s.patterns)s.patterns.forEach(p=>lines.push(`模式候选：${p.name}；角色：${p.role}；依据：第 ${p.start}–${p.end} 行。${ref(s)}`,p.explanation));if(s.coupling)lines.push(`仓库内已解析出向依赖 ${s.coupling.resolved} 个，未可靠定位类型 ${s.coupling.unresolved} 个。`,`已解析依赖：${s.coupling.dependencies.join('、')}。`,s.coupling.explanation);s.limits.forEach(limit=>lines.push('边界：'+limit))})});lines.push('','## 人工反馈快照');['问题审查','设计模式','耦合度'].filter(kind=>sources.some(s=>s.kind===kind)).forEach(kind=>lines.push(reportFeedbackSummary(kind,sources)));sources.forEach(s=>Object.entries(s.feedback).filter(([,f])=>f.comment).forEach(([,f])=>lines.push(`评论 ${ref(s)}：${f.comment}`)));lines.push('','## 建议处理顺序');if(issueSources.length)lines.push('1. 先确认支付幂等与失败处理的实际契约，处理高优先级风险。','2. 为超时、重试和失败后的订单状态补充相应验证。');if(pattern||coupling)lines.push('结合对应版本的接口角色与依赖关系核查修改影响；跨版本结论须重新确认。');lines.push('','## 范围与限制','仅包含逐项勾选的完整结果；失败文件和未完成片段没有被自动纳入。','不同版本分章展示，不将历史依赖指标当作当前版本事实；不同类型的准确率分别统计。','所选专项结果不构成模块级联合调查；第三方资料缺口仍保留。','后续修改反馈、策略或来源配置不改变此报告及其下载正文。','','## 来源清单');sources.forEach((s,i)=>lines.push(`[S${i+1}] ${s.name} · ${s.kind} · ${s.repo}@${s.sha} · ${s.taskTitle}。`));lines.push('');return lines.join('\n')}

function agentShowReader(title,subtitle,body,text=''){readerText=text;$('#reader-title').textContent=title;$('#reader-subtitle').textContent=subtitle;$('#reader-body').innerHTML=body;$('#copy-reader').disabled=!text;if(!$('#reader-dialog').open)$('#reader-dialog').showModal();}
function openAgentCode(index,sha,start=1,end=null){const task=agentTasks[state.detailTaskId],saved=task?.evidence.find(e=>e.index===index&&e.sha===sha),lines=saved?saved.code:agentCodeAt(sha,index);const body=lines?`<div class="notice">固定演示版本 ${esc(sha)} · 原始行号${start>1?' · 引用第 '+start+'–'+(end||start)+' 行':''}</div><div class="codeview scope-preview"><div class="code-lines">${lines.map((line,i)=>`<div class="code-line ${i+1>=start&&i+1<=(end||0)?'marked':''}"><span class="ln">${i+1}</span><span class="source">${esc(line)}</span></div>`).join('')}</div></div>`:'<div class="notice amber">对应版本原文缺失，不能使用其他版本内容替代。</div>';agentShowReader(files[index]+' · 代码原文',paths[index]+' · '+sha,body,lines?.join('\n')||'');}

function agentCaseBar(){return `<div class="scenario agent-case-bar"><span>Agent 演示情境</span>${[['a1','完整结果'],['a2','非连续提交'],['a3','执行中'],['capacity','容量终止'],['calls','调用上限'],['time','时间上限'],['quota','额度上限'],['a5','材料不足'],['a6','关键失败'],['retry','暂态重试']].map(([key,label])=>`<button onclick="showAgentCase('${key}')">${label}</button>`).join('')}</div>`;}
function showAgentCase(key){if(agentTasks[key]){if(key==='a3'&&agentTasks.a3.status!=='running'){const fresh=makeAgentTask('a-running-'+(++agentSerial),'订单模块调查 · 执行情境',agentInput(),'running');syncAgentTaskRow(fresh);return openAgentTask(fresh.id)}return openAgentTask(key)}const task=makeAgentTask('a-preview-'+(++agentSerial),'Agent 边界情境演示',agentInput(),key==='retry'?'running':'limited');task.limitKind=key;task.limits=key==='calls'?{calls:task.visible}:key==='time'?{time:task.elapsed}:key==='quota'?{quota:task.calls.slice(0,task.visible).reduce((sum,c)=>sum+c.usage,0)}:{};task.reason=({capacity:'完整请求上下文达到演示阈值（80%），下一次模型调用未发送。',calls:'模型调用次数已达本情境的演示上限（4 次），没有继续调查。',time:'任务执行已达本情境的演示时间上限（31 秒），已停止。',quota:'输入与输出累计已达本情境的演示额度上限（3,880 tokens），已停止。'})[key]||'';if(key==='retry'){const original=agentClone(task.calls[0]);task.calls.unshift({...original,label:'读取目录前的模型暂态错误',tool:null,response:{error:{code:'MODEL_TIMEOUT',message:'首次调用超时；下次为一次有限重试，计入总预算。'}},usage:180,elapsed:10});task.calls.forEach((call,i)=>call.number=i+1);task.calls[1].label='模型超时后第 1 次重试';task.visible=2;}syncAgentTaskRow(task);openAgentTask(task.id);}

function renderAgentDetail(){const task=activeAgent(),running=task.status==='running',complete=task.status==='completed',input=task.input,visible=task.calls.slice(0,task.visible),tokens=visible.reduce((sum,c)=>sum+c.usage,0),limits={calls:20,time:600,quota:60000,capacity:80,...task.limits},usedCalls=visible.length,usedTime=task.elapsed,usedTokens=tokens,context=task.status==='limited'&&!['calls','time','quota'].includes(task.limitKind)?80:Math.min(63,18+task.visible*5);
 return `<button class="quiet" style="padding-left:0;margin-bottom:16px" onclick="go(state.returnPage==='browser'?'browser':'center')">← 返回${state.returnPage==='browser'?'代码浏览':'审查中心'}</button><div class="heading"><div><div class="row wrap"><h1>${esc(task.name)}</h1>${badge(...agentStatus[task.status])}</div><p>${esc(task.project)} / Agent 分析 / ${input.kind==='COMMITS'?'逐提交综合分析':input.kind==='TEXT'?'文字范围调查':'文件与调用链调查'} <span class="badge agent-label">只读</span></p></div><div class="actions">${running?'<button class="danger" onclick="cancelAgentTask()">取消任务</button>':''}<button onclick="openAgentForm({copy:'${task.id}'})">复制参数新建</button>${complete?`<button class="primary" onclick="openAgentReport('${task.id}')">选结果生成报告</button>`:''}</div></div>${!complete?`<div class="notice ${running?'':'amber'}"><strong>${running?'正在执行：'+esc(task.calls[task.visible]?.label||'准备调查'):esc(agentStatus[task.status][0])}</strong><br>${running?'已查范围与调用逐步保存。此处仅模拟工具动作，不显示模型内部思考。':esc(task.reason)}${running?'':' 已有记录仅供回看，未形成完整成功结果。'}</div>`:'<div class="notice">审查结果已固定保存。进一步分析可引用此结果新建任务；生成报告需另行选材。</div>'}<div class="agent-meters">${[['模型调用',usedCalls,limits.calls,'次'],['已用时间',usedTime,limits.time,'秒'],['累计额度',usedTokens,limits.quota,'tokens'],['上下文占用',context,limits.capacity,'%']].map(([label,used,max,unit])=>`<div class="agent-meter"><span class="muted small">${label}</span><strong>${Number(used).toLocaleString()} <small>/ ${Number(max).toLocaleString()} ${unit}</small></strong><progress aria-label="${label}" value="${used}" max="${max}"></progress></div>`).join('')}</div><div class="row wrap muted small" style="margin:-10px 0 22px"><span>预算与 80% 阈值为讨论用演示参数，具体计量与数值待 P33 设计确认。</span><span class="spacer"></span>${running?'<button onclick="advanceAgentDemo()">演示下一步 →</button>':''}</div><div class="tabbar agent-main-tabs">${[['result','审查结果'],['progress','执行记录'],['calls','实际调用'],['input','任务输入']].map(([key,label])=>`<button class="${state.agentTab===key?'active':''}" onclick="state.agentTab='${key}';render()">${label}${key==='calls'?' · '+visible.length:''}</button>`).join('')}</div>${state.agentTab==='calls'?renderAgentCalls(task):state.agentTab==='progress'?renderAgentProgress(task):state.agentTab==='input'?renderAgentInput(task):renderAgentResult(task)}${agentCaseBar()}`;

function advanceAgentDemo(){const task=activeAgent();if(task.status!=='running')return;task.visible=Math.min(task.calls.length,task.visible+1);task.elapsed+=task.calls[task.visible-1].elapsed+2;if(task.visible===task.calls.length){task.status=agentSupportsInput(task.input)?'completed':'insufficient';task.reason=task.status==='completed'?'':'此范围组合尚未提供对应的完整演示材料。未使用其他文件或未选提交的结论替代，请查看固定示例或调整范围新建任务。';publishAgentCandidate(task)}syncAgentTaskRow(task);render();toast(task.status==='completed'?'演示调查完成，审查结果已固定':task.status==='insufficient'?'当前选择未被完整演示材料覆盖':'已模拟下一次模型与工具调用');}
function cancelAgentTask(){const task=activeAgent();if(task.status!=='running')return;if(!confirm('取消此 Agent 任务？已保存的输入与调用记录会保留。'))return;task.status='cancelled';task.reason='用户取消了任务。后续响应不再发布审查结果，继续调查请新建任务。';syncAgentTaskRow(task);render();toast('Agent 演示任务已取消');}
function agentMarkdown(markdown,evidence=[]){return markdown.split('\n').map(line=>{const inline=text=>esc(text).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[E(\d+)\]/g,(match,n)=>{const e=evidence.find(e=>e.id==='E'+n);return e?`<button class="report-citation" onclick="openAgentCode(${e.index},'${e.sha}',${e.start},${e.end})">[E${n}] ↗</button>`:match});if(line.startsWith('## '))return '<h3>'+inline(line.slice(3))+'</h3>';if(line.startsWith('> '))return '<blockquote>'+inline(line.slice(2))+'</blockquote>';return line?'<p>'+inline(line)+'</p>':''}).join('');}
function renderAgentResult(task){const complete=task.status==='completed';return `<div class="agent-layout"><article class="card agent-article">${complete?`<div class="row wrap" style="margin-bottom:16px"><span class="badge agent-label">Markdown 审查结果</span><span class="spacer"></span><button class="quiet" onclick="openAgentMarkdown()">查看原始 Markdown</button></div><h2>${esc(task.result.title)}</h2><p class="muted">${esc(task.result.summary)}</p>${agentMarkdown(task.result.markdown,task.evidence)}<div class="row wrap" style="margin-top:22px"><button onclick="openAgentForm({reference:'${task.id}'})">引用此结果新建任务</button><span class="muted small">新任务重新确定版本与配置</span></div>`:`<h2>${task.status==='running'?'调查进行中，尚无完整审查结果':'本次调查未形成完整结果'}</h2><p>${task.status==='running'?'可切换到执行记录，查看已经取得的材料与当前动作。':esc(task.reason)}</p><div class="notice amber">已经取得的代码和部分调用记录不代表完整结论，不能选作完整报告材料。</div><div class="row wrap"><button onclick="state.agentTab='progress';render()">查看已有执行记录</button>${task.status!=='running'?`<button onclick="openAgentForm({copy:'${task.id}'})">调整范围新建任务</button>`:''}</div>`}</article><aside class="agent-side"><section class="card"><div class="section-top"><h3>${complete?'代码证据':'已取得的材料'}</h3><span class="spacer"></span><span class="muted small">固定版本</span></div><div class="pad">${complete?task.evidence.map(e=>`<div class="agent-evidence"><span class="muted small">${e.id} · ${e.role}</span><br><button class="source-link" onclick="openAgentCode(${e.index},'${e.sha}',${e.start},${e.end})">${e.name} : ${e.start}–${e.end} ↗</button><p class="muted small" style="margin-top:6px"><code>${e.sha}</code></p>${e.base?`<button class="quiet small" style="padding-left:0" onclick="openAgentCommitPreview('${e.sha}')">差异 ${e.base} → ${e.sha} ↗</button>`:''}</div>`).join(''):`<p class="muted small">${task.visible} 次已保存调用，包含目录、搜索等记录。展开执行记录核对返回完整性。</p><button class="quiet" style="padding-left:0" onclick="state.agentTab='progress';render()">查看材料范围 ↗</button>`}</div></section><section class="card" style="margin-top:18px"><div class="section-top"><h3>范围与边界</h3></div><div class="pad"><dl><dt>分析目标</dt><dd>${task.input.kind==='COMMITS'?task.input.commits.map(sha=>'<code>'+sha+'</code>').join(' '):task.input.chosen.length?task.input.chosen.map(i=>esc(files[i])).join('、'):esc(task.input.rangeText)}</dd><dt>相关背景</dt><dd>仓库内相关声明；不会自动成为分析目标。</dd><dt>尚未确认</dt><dd>第三方支付实现、实际幂等行为与完整事务配置。</dd></dl></div></section></aside></div>`;}
function renderAgentProgress(task){const calls=task.calls.slice(0,task.visible);return `<section class="card"><div class="section-top"><h2>可观察的执行记录</h2><span class="spacer"></span><span class="muted small">${calls.length} 次模型调用 · ${calls.filter(c=>c.tool).length} 次工具调用</span></div><div class="pad"><div class="agent-timeline">${calls.map((call,i)=>`<div class="agent-event"><div class="row wrap"><strong>${String(i+1).padStart(2,'0')} · ${esc(call.label)}</strong><span class="spacer"></span>${badge(call.response.error?'暂态失败':call.tool?.result.error?'工具失败':call.tool?.result.truncated?'返回已截断':'已保存',call.response.error||call.tool?.result.error?'red':call.tool?.result.truncated?'amber':'green')}<button class="quiet small" onclick="state.agentCall=${i};state.agentTab='calls';render()">查看调用 ↗</button></div><p>${call.tool?esc(call.tool.name)+' · '+esc(call.tool.result.version||call.tool.result.commit||task.input.version)+(call.tool.args.path?' · '+esc(call.tool.args.path):''):'模型返回 · '+(call.response.error?'一次有限重试计入总预算':'形成固定审查结果')}</p>${call.tool?.result.truncated?'<p class="agent-missing">只返回部分命中；不能据此认定查遍全仓。后续直接读取已定位文件补充核对。</p>':''}${call.tool?.result.error?'<p class="agent-missing">材料获取失败，不解释为空文件或不存在。</p>':''}</div>`).join('')||'<p class="muted small">任务已受理，尚未发送首次模型调用。</p>'}${task.status==='running'?`<div class="agent-event"><strong>当前：${esc(task.calls[task.visible]?.label||'准备调查')}</strong><p>演示下一步将追加实际调用与工具返回，不修改已有记录。</p></div>`:''}</div></div></section>`;}
function renderAgentCalls(task){const calls=task.calls.slice(0,task.visible);if(!calls.length)return '<div class="card empty">尚未发送模型调用，当前没有请求快照。</div>';state.agentCall=Math.min(state.agentCall||0,calls.length-1);const call=calls[state.agentCall],tab=state.agentCallTab||'request',content=tab==='request'?call.request:tab==='response'?call.response:call.tool?{tool:call.tool.name,arguments:call.tool.args,result:call.tool.result}:{message:'本次没有工具调用。'};return `<section class="card"><div class="section-top"><h2>逐次实际调用</h2><span class="spacer"></span><span class="muted small">本页保存的完整演示快照</span></div><div class="agent-call-layout"><aside class="agent-call-list">${calls.map((c,i)=>`<button class="${i===state.agentCall?'active':''}" onclick="state.agentCall=${i};render()">第 ${i+1} 次模型调用<small>${esc(c.label)}</small></button>`).join('')}</aside><div class="agent-call-content"><div class="row wrap"><strong>第 ${state.agentCall+1} 次 · ${esc(call.label)}</strong><span class="spacer"></span><span class="muted small">${call.elapsed} 秒 · ${call.usage.toLocaleString()} tokens（演示）</span></div><div class="preview-tabs" style="margin-top:16px">${[['request','完整请求'],['response','模型返回'],['tool','工具参数与返回']].map(([key,label])=>`<button class="${tab===key?'active':''}" onclick="state.agentCallTab='${key}';render()">${label}</button>`).join('')}</div><p class="muted small" style="margin-bottom:12px">${tab==='request'?'包含当次模型、全部消息、此前工具材料、工具定义及输出参数；不会用当前提示词重建。':tab==='tool'?'返回保留版本、路径、行号与完整性，错误和截断均独立标记。':'模型原始返回与错误，按调用顺序独立保存。'}</p><div class="preview-code agent-call-json"><pre>${esc(JSON.stringify(content,null,2))}</pre></div><button style="margin-top:14px" onclick="openAgentCallReader()">在阅读器中展开完整内容</button></div></div></section>`;}
function openAgentCallReader(){const task=activeAgent(),call=task.calls[state.agentCall],tab=state.agentCallTab||'request',content=tab==='request'?call.request:tab==='response'?call.response:call.tool;const text=JSON.stringify(content,null,2);agentShowReader('Agent · 第 '+(state.agentCall+1)+' 次调用',task.name+' · '+({request:'完整请求',response:'模型返回',tool:'工具参数与返回'})[tab],'<div class="notice">读取已保存的演示调用；模板或配置修改不改变此快照。</div><div class="preview-code" style="max-height:60vh"><pre>'+esc(text)+'</pre></div>',text);}
function renderAgentInput(task){const f=task.input;return `<section class="card"><div class="section-top"><h2>提交时保存的输入</h2><span class="spacer"></span><span class="muted small">历史快照</span></div><div class="pad"><dl class="small"><dt class="muted">范围描述</dt><dd style="margin:6px 0 20px">${esc(f.rangeText||'未补充文字说明')}</dd><dt class="muted">分析目标 / 固定版本</dt><dd style="margin:6px 0 20px">${f.kind==='COMMITS'?f.commits.map(sha=>{const c=agentCommits.find(x=>x.sha===sha);return `<p><button class="source-link" onclick="openAgentCommitPreview('${sha}')">${c.parent} → ${sha} ↗</button> ${c.merge?'合并提交 · 第一父提交':''}</p>`}).join(''):`<code>${f.version}</code> · ${f.chosen.length?f.chosen.map(i=>esc(paths[i])).join('<br>'):'按文字描述定位'}`}</dd><dt class="muted">审查要求</dt><dd style="margin:6px 0 20px;white-space:pre-wrap">${esc(f.requirements)}</dd><dt class="muted">模型与指导提示词</dt><dd style="margin:6px 0 20px">${esc(f.modelSnapshot.name)} / ${esc(f.modelSnapshot.modelName)}<br>${f.promptSnapshot?esc(f.promptSnapshot.name)+' · v'+f.promptSnapshot.version:'未选指导提示词；使用内置默认调查指令'}</dd></dl>${f.promptSnapshot?'<div class="preview-code"><pre>'+esc(f.promptSnapshot.content)+'</pre></div>':''}${f.referenceSnapshot?`<div class="notice" style="margin-top:16px">引用的旧结果：${esc(f.referenceSnapshot.title)}。旧结论仅作线索，未作为当前版本的代码证据。</div>`:''}<details style="margin-top:20px"><summary class="small muted">查看内置调查指令</summary><div class="preview-code" style="margin-top:10px"><pre>${esc(agentDefaultInstruction)}</pre></div></details></div></section>`;}
function openAgentMarkdown(){const task=activeAgent();agentShowReader(task.result.title+' · Markdown',task.name+' · 已固定的审查结果','<div class="preview-code" style="max-height:60vh"><pre>'+esc(task.result.markdown)+'</pre></div>',task.result.markdown);}

// Report adapters freeze Agent markdown, all evidence versions and source input.
function publishAgentCandidate(task){const id='result-'+task.id,ok=task.status==='completed';let candidate=candidates.find(c=>c.id===id);if(!candidate){candidate={id};candidates.push(candidate)}Object.assign(candidate,{name:task.name,kind:'Agent 分析',desc:ok?`${task.input.kind==='COMMITS'?'逐提交综合分析':'跨文件调查'} · 完整审查结果`:`${agentStatus[task.status][0]} · 没有完整结果`,ok});if(!ok){delete reportSourceData[id];return}reportSourceData[id]={taskId:task.id,taskTitle:task.name,project:task.project,repo:'shop/order',sha:task.input.kind==='COMMITS'?task.input.commits.join(' / '):task.input.version,kind:'Agent 分析',name:task.result.title,path:task.input.kind==='COMMITS'?'所选提交（各自比较）':task.input.chosen.map(i=>paths[i]).join('、')||task.input.rangeText,summary:task.result.summary,markdown:task.result.markdown,evidence:agentClone(task.evidence),versions:[...new Set(task.evidence.map(e=>e.sha))],comparisons:task.input.commits.map(sha=>agentCommits.find(c=>c.sha===sha)),input:agentClone(task.input),limits:task.result.limitations,code:null};}
Object.values(agentTasks).forEach(publishAgentCandidate);
function openAgentReport(id){openReportForm();state.reportSelection=new Set(['result-'+id]);document.querySelectorAll('#report-form-body input[type=checkbox]').forEach(el=>{el.checked=el.dataset.agentResult==='result-'+id});$('#report-title').value='订单支付专项与 Agent 综合报告';updateReportCount();}
const specialistFreezeReportSources=freezeReportSources,specialistOpenReportForm=openReportForm,specialistBuildReport=buildReport,specialistOpenFrozenSource=openFrozenSource;
freezeReportSources=function(ids,feedback){return [...new Set(ids)].map(id=>{if(!candidates.find(c=>c.id===id)?.ok)throw new Error('只有完整审查结果可以冻结');return reportSourceData[id]?.kind==='Agent 分析'?agentClone({...reportSourceData[id],id,feedback:{}}):specialistFreezeReportSources([id],feedback)[0]});};
openReportForm=function(){Object.values(agentTasks).forEach(publishAgentCandidate);specialistOpenReportForm();$('#report-form-body').innerHTML=$('#report-form-body').innerHTML.replace('订单服务 · 专项结果','订单服务 · 专项与 Agent 结果').replace('订单服务专项审查报告','订单服务综合审查报告');const checks=[...document.querySelectorAll('#report-form-body input[type=checkbox]')];checks.forEach((el,i)=>el.dataset.agentResult=candidates[i].id);};
buildReport=function(){const sources=reportSources(),agents=sources.filter(s=>s.kind==='Agent 分析');if(!agents.length)return specialistBuildReport();const lines=['# '+(state.frozenTitle||'专项与 Agent 综合审查报告'),'','## 概览',`本报告冻结 ${sources.length} 个完整审查结果，来自 ${new Set(sources.map(s=>s.taskId)).size} 个任务，其中 Agent 结果 ${agents.length} 项。各项结论仅对应其标注版本；多提交逐项保留比较关系。`];sources.forEach((source,i)=>{lines.push('','## '+source.name+' [S'+(i+1)+']',`类型：${source.kind}；来源：${source.taskTitle}；仓库版本：${source.repo}@${source.sha}。`,source.summary);if(source.markdown){lines.push('',source.markdown.replace(/\[E(\d+)\]/g,(_,n)=>'[S'+(i+1)+'-E'+n+']'));source.evidence.forEach(e=>lines.push(`证据 S${i+1}-${e.id}：${e.path}@${e.sha}，第 ${e.start}–${e.end} 行；${e.role}。`));source.comparisons?.forEach(c=>lines.push(`独立比较：${c.parent} → ${c.sha}${c.merge?'（合并提交，第一父提交）':''}。`))}else{source.findings?.forEach(f=>lines.push(`问题：${f.title}；第 ${f.start}–${f.end} 行。原因：${f.reason}建议：${f.suggestion}`));source.patterns?.forEach(p=>lines.push(`模式候选：${p.name}；${p.explanation}`));if(source.coupling)lines.push(source.coupling.explanation)}source.limits.forEach(limit=>lines.push('边界：'+limit));});lines.push('','## 专项人工反馈快照');['问题审查','设计模式','耦合度'].filter(kind=>sources.some(s=>s.kind===kind)).forEach(kind=>lines.push(reportFeedbackSummary(kind,sources)));sources.forEach((s,i)=>Object.values(s.feedback).filter(f=>f.comment).forEach(f=>lines.push(`评论 [S${i+1}]：${f.comment}`)));lines.push('','## 范围与限制','Agent 结果没有套用专项问题级或结果级准确率。未完成、取消、材料不足及限制终止的任务未被纳入。','结论、Markdown、版本、代码证据及当时反馈均已冻结；后续修改不替换本报告内容。','','## 来源清单');sources.forEach((s,i)=>lines.push(`[S${i+1}] ${s.name} · ${s.kind} · ${s.repo}@${s.sha} · ${s.taskTitle}。`));return lines.join('\n');};
const specialistReportInline=reportInline,specialistRenderReport=renderReport,specialistRenderReports=renderReports;
reportInline=function(text){return specialistReportInline(text).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[S(\d+)-E(\d+)\]/g,(match,s,e)=>{const source=reportSources()[Number(s)-1];return source?`<button class="report-citation" onclick="openFrozenAgentEvidence('${source.id}','E${e}')">[S${s}-E${e}] ↗</button>`:match});};
renderReport=function(){return specialistRenderReport().replace('类专项结果','类审查结果').replace('个仓库版本，分别展示','组版本来源，分别展示');};
renderReports=function(){return specialistRenderReports()+`<section class="card" style="margin-top:24px"><div class="section-top"><h2>专项与 Agent 混合报告示例</h2><span class="spacer"></span>${badge('已完成','green')}</div><div class="pad"><p>问题审查、设计模式与两份 Agent 结果一起选材；包含非连续提交及各版本证据。</p><button class="primary" style="margin-top:15px" onclick="openAgentMixedExample()">阅读混合报告 →</button></div></section>`;};
openFrozenSource=function(id){const source=reportSources().find(s=>s.id===id);if(source?.kind!=='Agent 分析')return specialistOpenFrozenSource(id);const text=JSON.stringify(source,null,2);agentShowReader(source.name+' · 冻结 Agent 来源',source.repo+' · '+source.sha,`<div class="notice">读取生成时冻结的 Markdown、输入和跨版本证据，不读取当前任务或分支。</div><div class="agent-article" style="padding:0"><h2>${esc(source.name)}</h2><p>${esc(source.summary)}</p>${source.markdown.split('\n').map(line=>line.startsWith('## ')?'<h3>'+esc(line.slice(3))+'</h3>':line?'<p>'+esc(line)+'</p>':'').join('')}</div><h3 style="margin-top:20px">冻结代码证据</h3>${source.evidence.map(e=>`<div class="agent-evidence"><button class="source-link" onclick="openFrozenAgentEvidence('${source.id}','${e.id}')">${e.id} · ${e.name} : ${e.start}–${e.end} ↗</button><p class="small muted">${e.sha} · ${e.role}</p></div>`).join('')}<details style="margin-top:18px"><summary>完整冻结数据</summary><div class="preview-code"><pre>${esc(text)}</pre></div></details>`,text);};
function openFrozenAgentEvidence(id,evidenceId){const source=reportSources().find(s=>s.id===id),e=source?.evidence.find(e=>e.id===evidenceId);if(!e)return;agentShowReader(e.name+' · 报告冻结代码',e.path+' · '+e.sha+' · '+e.id,e.code?'<div class="notice">保存的原文 · 引用第 '+e.start+'–'+e.end+' 行；不使用其他版本替代。</div>'+scopeCodeBlock(e.code):'<div class="notice amber">该版本原文缺失。</div>',e.code?.join('\n')||'');}
let agentMixedReport;
function openAgentMixedExample(){if(!canLeave())return;state.drafts={};Object.assign(state,agentClone(agentMixedReport));state.reportFailed=false;go('report');}

// Prompt purpose is shared by the launch form and management editor.
const specialistOpenManage=openManage,specialistSaveManage=saveManage;
openManage=function(kind,id=null){specialistOpenManage(kind,id);if(kind==='prompts'){const item=management.prompts.find(p=>p.id===id);const purposeLabel=[...$('#manage-body').querySelectorAll('.field')].find(el=>el.querySelector('label')?.textContent==='用途');if(purposeLabel)purposeLabel.innerHTML=`<label for="manage-purpose">用途</label><select id="manage-purpose" onchange="manageEditor.dirty=true">${opts(['SPECIALIST','AGENT'],['专项通用规则','Agent 指导提示词'],item?.purpose||'SPECIALIST')}</select>`;}if(kind==='strategies')$('#manage-promptId').querySelectorAll('option').forEach(option=>{const p=management.prompts.find(p=>p.id===option.value);if(p?.purpose==='AGENT')option.remove()});};
saveManage=function(){const kind=manageEditor.kind,id=manageEditor.id,purpose=$('#manage-purpose')?.value,name=$('#manage-name')?.value.trim();if(kind==='prompts'&&purpose==='AGENT'&&management.strategies.some(s=>s.promptId===id)){$('#manage-error').textContent='此提示词正被专项策略引用，请先调整策略再修改用途。';return}specialistSaveManage();if(kind==='prompts'&&!$('#manage-dialog').open){const saved=management.prompts.find(p=>p.name===name);if(saved)saved.purpose=purpose;render()}};
renderPrompts=function(){return managerHeader('prompts','提示词管理','维护专项通用规则与 Agent 调查指引，查看正文版本并比较修改。')+`<div class="notice">专项通过策略选用规则；Agent 可直接选用一份指导提示词，未选择仍提供默认调查指令。</div><section class="card">${managerFilter('prompts')}<div class="table-wrap"><table><thead><tr><th>名称 / 描述</th><th>用途</th><th>标签</th><th>正文版本</th><th>操作</th></tr></thead><tbody>${filteredManaged('prompts').map(p=>`<tr><td><strong>${esc(p.name)}</strong><span class="muted">${esc(p.description)}</span></td><td>${badge(p.purpose==='AGENT'?'Agent 指导提示词':'专项通用规则',p.purpose==='AGENT'?'blue':'')}</td><td>${esc(p.tags)||'—'}</td><td><code>v${currentPrompt(p.id).number}</code><span class="muted">${p.versions.length} 个版本</span></td><td>${manageActions('prompts',p.id)}</td></tr>`).join('')}</tbody></table></div>${!filteredManaged('prompts').length?'<div class="empty">暂无匹配的提示词。</div>':''}</section>`;};
$('#agent-scope-dialog').addEventListener('cancel',event=>{event.preventDefault();closeAgentScope()});
window.addEventListener('beforeunload',event=>{if($('#form-dialog').open&&form.route==='AGENT'&&agentForm.dirty){event.preventDefault();event.returnValue=''}});

document.querySelectorAll('dialog').forEach(d=>d.addEventListener('cancel',e=>{if(d.id==='form-dialog'){e.preventDefault();closeForm()}else if(d.id==='report-dialog'){e.preventDefault();closeReportForm()}else if(d.id==='manage-dialog'){e.preventDefault();closeManage()}else if(d.id==='scope-dialog'){e.preventDefault();closeScopePicker()}}));
window.addEventListener('beforeunload',e=>{if(Object.values(state.drafts).some(d=>d.dirty)||($('#form-dialog').open&&form.dirty)||($('#manage-dialog').open&&manageEditor.dirty)){e.preventDefault();e.returnValue=''}});
state.frozenTitle='订单服务多结果综合审查报告';
state.frozenSources=['r1','r2','r4','r5'];
state.frozenFeedback={'issue-1':{assessment:'准确',comment:'已复现重复支付请求，待补充服务端幂等验证。',revision:1},'issue-2':{assessment:'无法判断',comment:'需结合事务及补偿实现确认。',revision:1},'result-pattern':{assessment:'准确',comment:'目标接口角色判断与可见结构一致。',revision:1},'result-coupling':{assessment:null,comment:'作为 a84cd92 版本的结构参考。',revision:1}};
state.frozenSourceSnapshots=freezeReportSources(state.frozenSources,state.frozenFeedback);
state.reportFrozenAt='2026-10-20 11:05（演示）';
state.reportBody=buildReport();
multiResultReportExample=captureReport();
const specialistReportInitial=captureReport();
state.frozenTitle='订单支付专项与 Agent 综合审查报告';
state.reportFrozenAt='2026-10-21 11:30（演示）';
state.frozenSources=['r1','r4','result-a1','result-a2'];
state.frozenSourceSnapshots=freezeReportSources(state.frozenSources,state.frozenFeedback);
state.reportBody=buildReport();
agentMixedReport=captureReport();
Object.assign(state,specialistReportInitial);
state.reportIsExample=true;

render();
</script>
</body>
</html>
