ce amber">第三方 Payment 类型未可靠定位。此处不包含全仓入向关系，不将未解析类型计为零依赖。</div>${feedback('result-coupling','整个耦合度审查结果')}</div>`;return `<div class="issue"><div class="result-title">${badge('高','red')}<h3>重试支付可能造成重复扣款</h3><span class="spacer"></span><span class="muted small">正确性</span></div><button class="source-link" onclick="openCode('OrderService.java',16,17)">OrderService.java : 16–17 ${state.detailDiff?'· 修改后':''} ↗</button><div class="body"><strong>原因</strong><p>retryPayment 直接再次调用扣款接口，没有传递稳定的幂等标识；可见接口契约未承诺重复请求只扣款一次。客户端或调度器重试时，可能重复发起支付。</p><p style="margin-top:9px"><strong>建议</strong><br>为同一订单支付使用稳定的请求标识，并在调用前检查或记录支付状态，明确失败与超时后的查询流程。</p></div>${feedback('issue-1','此问题')}</div><div class="issue"><div class="result-title">${badge('中','amber')}<h3>支付失败后订单状态缺少明确处理</h3></div><button class="source-link" onclick="openCode('OrderService.java',10,13)">OrderService.java : 10–13 ↗</button><div class="body">订单保存后立即发起支付；支付抛出异常时，已有订单的状态和后续处理未在目标代码中体现。建议显式记录待支付状态并定义失败处理；事务及补偿实现尚未取得，需保留判断边界。</div>${feedback('issue-2','此问题')}</div>`}

function detailMaterialSource(){let task=tasks.find(t=>t.id===state.detailTaskId&&t.type===state.type)||tasks.find(t=>t.type===state.type);if(state.newTask)return {taskId:'new-task',project:'订单服务',headSha:state.lastInput?.version||'b7a312e',baseSha:state.detailDiff?'12ac80f':null};return {taskId:task.id,project:task.project,headSha:task.version,baseSha:state.detailDiff?'12ac80f':null}}
function demoMaterialCode(sha,file){if(sha==='b7a312e')return codeSamples[file]?.slice();if(sha==='a84cd92'&&file==='OrderService.java')return reportSourceData.r5.code.split('\n');if(sha==='12ac80f'){if(file==='OrderService.java')return sampleCode.slice(0,15).concat('}');if(file==='PaymentGateway.java')return codeSamples[file].slice()}if(sha==='e91bd20'){if(file==='OrderService.java')return sampleCode.map(l=>l.replace('charge(order.getPayment());','charge(order.getPayment(), order.getId());'));if(file==='PaymentGateway.java')return codeSamples[file].map(l=>l.replace('charge(Payment payment);','charge(Payment payment, String requestId);'))}return null}
function detailMaterials(){if(state.newTask)return [];const source=detailMaterialSource(),name=detailFiles()[state.target]||detailFiles()[0],i=files.indexOf(name),after=demoMaterialCode(source.headSha,name),before=source.baseSha?demoMaterialCode(source.baseSha,name):null;const materials=[{id:source.taskId+':'+name+':target',name,path:paths[i],role:'分析目标',disposition:'已发送',kind:source.baseSha?'DIFF':'CODE',sha:source.headSha,baseSha:source.baseSha,firstLine:1,content:after,fullContent:after,before,complete:true}];if(name==='OrderService.java'){const full=demoMaterialCode(source.headSha,'PaymentGateway.java');materials.push({id:source.taskId+':'+name+':contract',name:'PaymentGateway.java',path:paths[1],role:'辅助接口声明',disposition:'已发送',kind:'CODE',sha:source.headSha,firstLine:8,content:full?full.slice(7,14):null,fullContent:full,complete:false});const repo=demoMaterialCode(source.headSha,'OrderRepository.java');materials.push({id:source.taskId+':'+name+':unused',name:'OrderRepository.java',path:paths[2],role:'辅助成员签名',disposition:'已读取，未发送',kind:'CODE',sha:source.headSha,firstLine:3,content:repo?repo.slice(2,4):null,fullContent:repo,complete:false})}return materials}

function diffCodeHtml(before,after){const rows=scopeDiffRows(before,after);return `<div class="codeview scope-preview"><div class="code-lines">${rows.map(r=>`<div class="code-line ${r.kind}"><span class="ln">${r.oldLine||''}</span><span class="ln">${r.newLine||''}</span><span class="source">${r.kind==='added'?'＋':r.kind==='deleted'?'−':' '} ${esc(r.text)}</span></div>`).join('')}</div></div>`}
function materialViewText(material,mode='content'){if(!material)return '';if(material.kind==='DIFF'&&mode==='changes'){if(!material.before||!material.content)return '';const rows=scopeDiffRows(material.before,material.content);return `--- ${material.baseSha}/${material.path}\n+++ ${material.sha}/${material.path}\n`+rows.map(r=>(r.kind==='added'?'+':r.kind==='deleted'?'-':' ')+r.text).join('\n')}return (material.kind==='DIFF'&&mode==='before'?material.before:material.content)?.join('\n')||''}
function materialViewHtml(material,mode='content'){if(!material)return '<div class="empty">尚未准备材料，当前没有可阅读的代码快照。</div>';if(state.scenario==='missing-source')return '<div class="notice red">对应版本的材料原文不可取得，不能用当前分支或其他文件内容替换。</div>';if(material.kind==='DIFF'){if(mode==='before'&&!material.before)return '<div class="notice amber">修改前原文未保存，不能用修改后内容替代。</div>';if(!material.content)return '<div class="notice amber">修改后材料原文未保存，无法完整显示差异。</div>';if(mode==='changes'){if(!material.before)return '<div class="notice amber">修改前原文缺失，无法显示完整差异。</div>';return `<div class="small muted" style="margin-bottom:8px">修改前 ${material.baseSha} → 修改后 ${material.sha} · 前后侧原始行号</div>`+diffCodeHtml(material.before,material.content)}const lines=mode==='before'?material.before:material.content;return `<div class="small muted" style="margin-bottom:8px">${mode==='before'?'修改前 '+material.baseSha:'修改后 '+material.sha}</div>`+scopeCodeBlock(lines,1)}if(!material.content)return '<div class="notice amber">该版本的材料原文未保存。仅保留来源记录，不将缺失解释为空文件。</div>';return `<div class="small muted" style="margin-bottom:8px">${material.complete?'完整目标原文':'已保存的声明片段'} · 第 ${material.firstLine}–${material.firstLine+material.content.length-1} 行</div>`+scopeCodeBlock(material.content,material.firstLine)}
function materialLineRange(lines,firstLine=1){return lines?lines.length?`第 ${firstLine}–${firstLine+lines.length-1} 行`:'空文件，无代码行':'行范围未保存'}
function materialMetadata(material){return material.kind==='DIFF'?`修改前 ${material.baseSha} · ${materialLineRange(material.before)}<br>修改后 ${material.sha} · ${materialLineRange(material.content)}`:`${material.sha} · ${materialLineRange(material.content,material.firstLine)}`}
function renderMaterials(){const source=detailMaterialSource(),materials=detailMaterials();return `<div class="pad"><h3>实际分析材料</h3><p class="small muted" style="margin:8px 0 17px">目标：${esc(detailFiles()[state.target]||detailFiles()[0])} · ${esc(source.project)}<br>点击「查看代码」阅读保存的原文或变更，发送状态按材料逐项标记。</p>${materials.length?`<div class="table-wrap"><table><thead><tr><th>材料 / 固定版本</th><th>用途</th><th>调用输入</th><th>阅读</th></tr></thead><tbody>${materials.map(m=>`<tr><td><strong>${esc(m.name)}</strong><span class="muted small">${materialMetadata(m)}</span></td><td>${m.role}<span class="muted">${m.kind==='DIFF'?'修改前后与改动':m.complete?'完整目标文件':'必要声明片段'}</span></td><td>${badge(m.disposition,m.disposition==='已发送'?'blue':'')}</td><td><button class="quiet" onclick="selectDetailMaterial('${m.id}')">查看代码</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">尚未准备材料，当前没有可阅读的代码快照。</div>'}<div class="notice amber" style="margin-top:18px">第三方资料缺失与未发送材料分别记录。辅助声明仅作为背景，不自动成为审查目标。</div><button onclick="state.tab='calls';render()">查看完整调用</button></div>`}
function openMaterialReader(full=false){const material=activeDetailMaterial();if(!material)return;const viewed=full?{...material,kind:'CODE',content:material.fullContent,firstLine:1,complete:true}:material;const mode=full?'content':state.materialMode;readerText=state.scenario==='missing-source'?'':materialViewText(viewed,mode);$('#reader-title').textContent=material.name+' · '+(full?'固定版本全文':material.kind==='DIFF'?'提交差异':'代码原文');$('#reader-subtitle').textContent=material.sha+' · '+material.disposition+(full?' · 扩展阅读，不能视为全文已发送':'');const controls=material.kind==='DIFF'?`<div class="preview-tabs">${[['changes','提交差异'],['before','修改前原文'],['after','修改后原文']].map(([key,label])=>`<button data-material-mode="${key}" class="${mode===key?'active':''}" onclick="changeMaterialMode('${key}')">${label}</button>`).join('')}</div>`:material.fullContent&&!material.complete?`<div class="row wrap" style="margin-bottom:12px"><span class="muted small">${full?'扩展全文，不能视为全文已发送':'显示当时保存的声明片段'}</span><span class="spacer"></span><button onclick="openMaterialReader(${!full})">${full?'返回保存片段':'查看固定版本全文'}</button></div>`:'';$('#reader-body').innerHTML=`<p class="small muted" style="margin-bottom:14px;overflow-wrap:anywhere">${esc(material.path)}<br>${materialMetadata(material)}</p>`+controls+`<div id="material-code">${materialViewHtml(viewed,mode)}</div>`;$('#copy-reader').disabled=!readerText;if(!$('#reader-dialog').open)$('#reader-dialog').showModal()}
function materialCallText(){const request=JSON.parse(callText),materials=detailMaterials(),source=detailMaterialSource();request.messages[1].content='专项类型：'+typeLabel(state.type)+'\n固定版本：'+source.headSha+'\n通用规则：订单服务规范（本次快照）。\n文件说明：重点关注支付重试是否幂等。\n'+materials.filter(m=>m.disposition==='已发送').map(m=>m.role+' '+m.path+' '+(m.baseSha?m.baseSha+' → ':'')+m.sha+'\n'+materialViewText(m,m.kind==='DIFF'?'changes':'content')).join('\n\n')+'\n辅助资料缺口：第三方实现不可取得。';return JSON.stringify(request,null,2)}

function buildReport(){const sources=reportSources(),groups=reportGroups(sources),ref=s=>'[S'+(sources.findIndex(x=>x.id===s.id)+1)+']',tasksCount=new Set(sources.map(s=>s.taskId)).size;const lines=['# '+(state.frozenTitle||'订单服务专项审查报告'),'','## 概览',`本报告选取 ${sources.length} 个完整审查结果，来自 ${tasksCount} 个审查任务，覆盖 ${groups.length} 个仓库版本。结果、评价及评论均反映生成时的冻结内容。`,'','## 主要结论'];const issueSources=sources.filter(s=>s.findings?.length);if(issueSources.length)issueSources.forEach(s=>lines.push(`优先处理 ${s.name} 的支付重试与失败状态风险；这些问题属于 ${s.sha} 的问题审查结果。${ref(s)}`));const pattern=sources.find(s=>s.patterns);if(pattern)lines.push(`支付接口具有策略接口角色，可作为理解抽象边界的依据；尚未确认完整模块实现。${ref(pattern)}`);const coupling=sources.find(s=>s.coupling);if(coupling)lines.push(`依赖结果展示 ${coupling.sha} 的文件级关系，仅用于对应版本的结构阅读，不与其他版本合并为当前指标。${ref(coupling)}`);if(!issueSources.length&&!pattern&&!coupling)lines.push('所选结果未报告有代码依据的问题；不据此宣称业务已完整验证。');groups.forEach(group=>{lines.push('','## '+group.project+' · '+group.sha,`仓库：${group.repo}；以下结果均对应版本 ${group.sha}。`);group.sources.forEach(s=>{lines.push('','### '+s.name+' · '+s.kind+' '+ref(s),`来源任务：${s.taskTitle}；目标文件：${s.path}。`,s.summary);if(s.findings?.length)s.findings.forEach(f=>lines.push('',`${f.severity}优先级：${f.title}（第 ${f.start}–${f.end} 行）。${ref(s)}`,'原因：'+f.reason,'建议：'+f.suggestion));if(s.patterns)s.patterns.forEach(p=>lines.push(`模式候选：${p.name}；角色：${p.role}；依据：第 ${p.start}–${p.end} 行。${ref(s)}`,p.explanation));if(s.coupling)lines.push(`仓库内已解析出向依赖 ${s.coupling.resolved} 个，未可靠定位类型 ${s.coupling.unresolved} 个。`,`已解析依赖：${s.coupling.dependencies.join('、')}。`,s.coupling.explanation);s.limits.forEach(limit=>lines.push('边界：'+limit))})});lines.push('','## 人工反馈快照');['问题审查','设计模式','耦合度'].filter(kind=>sources.some(s=>s.kind===kind)).forEach(kind=>lines.push(reportFeedbackSummary(kind,sources)));sources.forEach(s=>Object.entries(s.feedback).filter(([,f])=>f.comment).forEach(([,f])=>lines.push(`评论 ${ref(s)}：${f.comment}`)));lines.push('','## 建议处理顺序');if(issueSources.length)lines.push('1. 先确认支付幂等与失败处理的实际契约，处理高优先级风险。','2. 为超时、重试和失败后的订单状态补充相应验证。');if(pattern||coupling)lines.push('结合对应版本的接口角色与依赖关系核查修改影响；跨版本结论须重新确认。');lines.push('','## 范围与限制','仅包含逐项勾选的完整结果；失败文件和未完成片段没有被自动纳入。','不同版本分章展示，不将历史依赖指标当作当前版本事实；不同类型的准确率分别统计。','所选专项结果不构成模块级联合调查；第三方资料缺口仍保留。','后续修改反馈、策略或来源配置不改变此报告及其下载正文。','','## 来源清单');sources.forEach((s,i)=>lines.push(`[S${i+1}] ${s.name} · ${s.kind} · ${s.repo}@${s.sha} · ${s.taskTitle}。`));lines.push('');return lines.join('\n')}
function reportText(){return state.reportBody||buildReport()}
function reportInline(text){return esc(text).replace(/\[S(\d+)\]/g,(match,n)=>{const source=reportSources()[Number(n)-1];return source?`<button class="report-citation" onclick="openFrozenSource('${source.id}')" title="查看冻结来源 S${n}">[S${n}]</button>`:match})}
function reportArticle(){return reportText().split('\n').map(line=>line.startsWith('# ')?'<h2>'+reportInline(line.slice(2))+'</h2>':line.startsWith('### ')?'<h4>'+reportInline(line.slice(4))+'</h4>':line.startsWith('## ')?'<h3>'+reportInline(line.slice(3))+'</h3>':line?'<p>'+reportInline(line)+'</p>':'').join('')}
function renderReport(){if(state.reportFailed)return `<div class="heading"><div><h1>报告生成失败</h1><p>输入材料已保留，可查看失败调用并重新生成新报告。</p></div><button onclick="openReportForm()">重新选材生成</button></div><div class="card pad"><div class="notice red">模型返回内容不完整，无法生成完整报告。没有可下载的成功正文。</div><p class="small muted">已保存来源、冻结时间和错误；没有把事实草稿标为已完成报告。</p><button style="margin-top:18px" onclick="openCall(1)">查看实际调用与错误</button></div>${scenarioBar()}`;const sources=reportSources(),groups=reportGroups(sources);return `<div class="heading"><div><h1>${esc(state.frozenTitle||'订单服务多结果综合审查报告')}</h1><p>已完成 · ${esc(state.reportFrozenAt||'2026-10-20 11:05（演示）')} · 来源和反馈已冻结</p></div><div class="actions"><button onclick="go('reports')">返回报告列表</button><button class="primary" onclick="downloadReport()">下载 Markdown</button></div></div><div class="report-overview"><div><b>${sources.length}</b><span>个审查结果</span></div><div><b>${new Set(sources.map(s=>s.taskId)).size}</b><span>个来源任务</span></div><div><b>${groups.length}</b><span>个仓库版本，分别展示</span></div><div><b>${new Set(sources.map(s=>s.kind)).size}</b><span>类专项结果</span></div></div><div class="report-layout"><article class="card report-body"><span class="badge blue">多结果报告 · 演示</span><div style="margin-top:15px">${reportArticle()}</div><div class="notice">正文与下载使用同一份保存内容。报告不自动补入未选结果，也不将不同版本合并为同一版本结论。</div></article><aside class="card report-sources"><div class="section-top"><h3>报告来源</h3><span class="spacer"></span><span class="muted small">${sources.length} 项</span></div>${sources.map((source,i)=>`<div class="source-card"><div class="row"><span class="badge">S${i+1}</span><span class="badge">${source.kind}</span></div><strong style="margin-top:8px">${esc(source.name)}</strong><span class="muted">${esc(source.project)} · <code>${source.sha}</code><br>${esc(source.taskTitle)}</span><br><button class="quiet" style="padding-left:0" onclick="openFrozenSource('${source.id}')">查看冻结来源 ↗</button></div>`).join('')}<div class="pad small muted">正文中的 [S1] 等引用可打开对应来源。<br>评价与评论均来自生成时的快照。</div></aside></div>${scenarioBar()}`}
function openFrozenSource(id){const sources=reportSources(),source=id?sources.find(s=>s.id===id):sources[0];if(!source){toast('该来源不在本报告的冻结材料中');return}const ordinal=sources.findIndex(s=>s.id===source.id)+1;readerText=JSON.stringify(source,null,2);$('#reader-title').textContent='S'+ordinal+' · '+source.name+' · 冻结来源';$('#reader-subtitle').textContent=source.project+' · '+source.sha+' · '+source.taskTitle;$('#reader-body').innerHTML=`<div class="notice">此处读取生成时保存的结果、版本和反馈，后续编辑不影响此内容。</div><h3>${esc(source.kind)} · ${esc(source.summary)}</h3><p class="small muted" style="margin:8px 0 15px">${esc(source.path)} · ${source.sha}</p>${source.findings?.map(f=>`<div class="file-note"><strong>${esc(f.title)}</strong><p class="small">第 ${f.start}–${f.end} 行 · ${esc(f.reason)}</p><p class="small muted">建议：${esc(f.suggestion)}</p></div>`).join('')||''}${source.patterns?`<div class="file-note">模式候选：${esc(source.patterns[0].name)} · ${esc(source.patterns[0].explanation)}</div>`:''}${source.coupling?`<div class="file-note">已解析出向依赖 ${source.coupling.resolved} 个，未解析类型 ${source.coupling.unresolved} 个。${esc(source.coupling.explanation)}</div>`:''}<h3 style="margin:18px 0 8px">当时反馈</h3>${Object.values(source.feedback).map(f=>`<p class="small">${esc(f.assessment||'未反馈')} · ${esc(f.comment||'无评论')}</p>`).join('')||'<p class="muted small">此结果没有问题级反馈对象。</p>'}<details style="margin-top:15px"><summary class="small muted" style="cursor:pointer">查看冻结数据</summary><div class="preview-code"><pre>${esc(readerText)}</pre></div></details><button style="margin-top:15px" onclick="openReportSourceCode('${source.id}')">阅读冻结代码原文</button>`;$('#copy-reader').disabled=false;$('#reader-dialog').showModal()}
function openReportSourceCode(id){const source=reportSources().find(s=>s.id===id);if(!source)return;readerText=source.code||'';$('#reader-title').textContent=source.name+' · 冻结代码原文';$('#reader-subtitle').textContent=source.project+' · '+source.sha+' · 报告来源';$('#reader-body').innerHTML=readerText?`<div class="notice">保存的演示代码 · 固定版本 ${source.sha}，不读取当前分支。</div>`+scopeCodeBlock(readerText.split('\n')):'<div class="notice amber">原文缺失，不能用当前代码替换。</div>';$('#copy-reader').disabled=!readerText}

function renderStrategies(){return managerHeader('strategies','策略管理','为专项选择模型和可选的通用规则提示词，保存为可复用配置。')+`<div class="notice">策略关联专项类型、模型及可选提示词。文件说明仍由每次任务分别填写，内置任务和输出协议集中管理。</div><section class="card">${managerFilter('strategies')}<div class="table-wrap"><table><thead><tr><th>策略名称</th><th>专项类型</th><th>关联模型</th><th>通用规则提示词</th><th>操作</th></tr></thead><tbody>${filteredManaged('strategies').map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${typeLabel(s.specialistType)}</td><td>${esc(managedName('models',s.modelId))}</td><td>${s.promptId?esc(managedName('prompts',s.promptId))+' <code>v'+currentPrompt(s.promptId).number+'</code>':'不选提示词'}</td><td>${manageActions('strategies',s.id)}</td></tr>`).join('')}</tbody></table></div>${!filteredManaged('strategies').length?'<div class="empty">暂无匹配的策略，可调整专项筛选或新建策略。</div>':''}</section><div class="notice" style="margin-top:18px">现有外部 API 预留配置按原契约保留，本轮不扩展其配置和交互。</div>`}
function managementInput(id,label,value='',extra=''){return `<div class="field"><label for="manage-${id}">${label}</label><input id="manage-${id}" value="${esc(value)}" ${extra}></div>`}
function openManage(kind,id=null){manageEditor={kind,id,dirty:false};const item=management[kind].find(x=>x.id===id)||{};$('#manage-title').textContent=(id?'编辑':'新建')+({projects:'项目',models:'模型',prompts:'提示词',strategies:'策略'})[kind];let fields=managementInput('name','名称',item.name||'');
 if(kind==='projects')fields+=managementInput('giteaUrl','仓库地址',item.giteaUrl||'',id?'readonly':'type="url" placeholder="https://git.example.com/owner/repo"')+managementInput('token','访问令牌（可选，留空保留）','','type="password" autocomplete="new-password"')+`<div class="notice full" style="margin:0">${id?'仓库地址保持锁定。':'请输入待接入的仓库地址。'}本原型模拟连接验证；不读取真实仓库或保存令牌正文。</div><div class="scenario full"><span>验证情境</span><button onclick="manageEditor.verifyFailed=true;toast('已模拟仓库验证失败，提交时保留当前输入')">模拟验证失败</button><button onclick="manageEditor.verifyFailed=false;toast('已恢复演示验证成功情境')">恢复验证成功</button></div>`;
 if(kind==='models')fields+=managementInput('modelName','模型名',item.modelName||'')+managementInput('baseUrl','接口地址',item.baseUrl||'', 'type="url"')+managementInput('token','凭据（可选，留空保留）','', 'type="password" autocomplete="new-password" placeholder="不回显已有凭据"')+managementInput('contextWindow','上下文窗口（tokens）',item.contextWindow||32768,'type="number" min="1"')+managementInput('maxOutput','最大输出（tokens）',item.maxOutput||4096,'type="number" min="1"')+'<div class="field full"><label>计量方式</label><p class="small muted">保守估算；对应 tokenizer 的适配需在实施阶段核实。</p></div>';
 if(kind==='prompts')fields+=managementInput('description','描述',item.description||'')+managementInput('tags','标签（逗号分隔）',item.tags||'')+`<div class="field"><label>用途</label><p>专项通用规则</p></div><div class="field full"><label for="manage-content">正文</label><textarea id="manage-content" style="min-height:220px" placeholder="输入可复用的审查关注点">${esc(id?currentPrompt(id).content:'')}</textarea></div>${id?'<label class="small full"><input id="manage-newVersion" type="checkbox" checked> 保存为新版本；取消勾选则更新当前版本。已保存的任务输入不改变。</label>':''}`;
 if(kind==='strategies')fields+=`<div class="field"><label for="manage-specialistType">专项类型</label><select id="manage-specialistType">${opts(['ISSUE','PATTERN','COUPLING'],['问题审查（含提交差异）','设计模式','耦合度'],item.specialistType||'ISSUE')}</select></div><div class="field"><label for="manage-modelId">关联模型</label><select id="manage-modelId">${management.models.map(m=>`<option value="${m.id}" ${item.modelId===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><button class="quiet small" onclick="switchManage('models')">管理模型 →</button></div><div class="field"><label for="manage-promptId">通用规则提示词（可选）</label><select id="manage-promptId"><option value="">不选提示词</option>${management.prompts.map(p=>`<option value="${p.id}" ${item.promptId===p.id?'selected':''}>${esc(p.name)} · v${currentPrompt(p.id).number}</option>`).join('')}</select><button class="quiet small" onclick="switchManage('prompts')">管理提示词 →</button></div>`;
 $('#manage-body').innerHTML=`<div class="form-grid">${fields}</div><div id="manage-error" class="error-text" role="alert"></div>`;if(!$('#manage-dialog').open)$('#manage-dialog').showModal();}
function closeManage(){if(manageEditor.dirty&&!confirm('尚未保存的管理表单将丢弃，是否关闭？'))return;$('#manage-dialog').close();manageEditor.dirty=false}
function switchManage(kind){if(manageEditor.dirty&&!confirm('离开将丢弃当前编辑，是否继续？'))return;$('#manage-dialog').close();manageEditor.dirty=false;go(kind)}
function saveManage(){const {kind,id}=manageEditor,existing=management[kind].find(x=>x.id===id),name=$('#manage-name').value.trim(),fail=s=>$('#manage-error').textContent=s;if(!name)return fail('请填写名称。');if(management[kind].some(x=>x.id!==id&&x.name===name))return fail('名称已存在，请使用其他名称。');let item={...existing,id:id||'new-'+(++management.serial),name};
 if(kind==='projects'){let giteaUrl=$('#manage-giteaUrl').value.trim(),parsed;try{parsed=new URL(giteaUrl)}catch{return fail('请填写有效的 HTTP(S) 仓库地址。')}if(!['http:','https:'].includes(parsed.protocol)||parsed.username||parsed.password)return fail('仓库地址仅接受 HTTP(S)，请在令牌字段填写凭据。');if(existing&&giteaUrl!==existing.giteaUrl)return fail('编辑项目不能修改仓库地址。');if(manageEditor.verifyFailed)return fail('仓库验证失败，项目与原令牌尚未修改，输入已保留，请重试。');item={...item,giteaUrl,currentBranch:existing?.currentBranch||'main',hasToken:!!$('#manage-token').value||!!existing?.hasToken};$('#manage-token').value='';}
 if(kind==='models'){const baseUrl=$('#manage-baseUrl').value.trim(),modelName=$('#manage-modelName').value.trim(),windowSize=Number($('#manage-contextWindow').value),maxOutput=Number($('#manage-maxOutput').value);if(!/^https?:\/\//.test(baseUrl)||!modelName)return fail('请填写 HTTP(S) 接口地址及模型名。');if(!Number.isInteger(windowSize)||!Number.isInteger(maxOutput)||maxOutput<1||windowSize<=maxOutput)return fail('窗口必须大于最大输出，且两者均为正整数。');item={...item,baseUrl,modelName,contextWindow:windowSize,maxOutput,tokenizer:'保守估算',hasToken:!!$('#manage-token').value||!!existing?.hasToken,revision:(existing?.revision||0)+1,verifiedRevision:0};$('#manage-token').value='';}
 if(kind==='prompts'){const content=$('#manage-content').value;if(!content.trim())return fail('请填写提示词正文。');const versions=existing?existing.versions.map(v=>({...v})):[];if(!existing||$('#manage-newVersion').checked)versions.push({number:(versions.at(-1)?.number||0)+1,content});else versions[versions.length-1].content=content;item={...item,description:$('#manage-description').value.trim(),tags:$('#manage-tags').value.trim(),versions};}
 if(kind==='strategies'){const modelId=$('#manage-modelId').value,promptId=$('#manage-promptId').value;if(!management.models.some(m=>m.id===modelId))return fail('请选择有效模型，可先在模型管理中创建。');if(promptId&&!management.prompts.some(p=>p.id===promptId))return fail('所选提示词已失效，请重新选择。');item={...item,specialistType:$('#manage-specialistType').value,modelId,promptId};}
 if(existing)management[kind][management[kind].indexOf(existing)]=item;else management[kind].push(item);manageEditor.dirty=false;$('#manage-dialog').close();render();toast('已保存演示配置，历史任务和调用快照保持不变');}
function removeManaged(kind,id){if(kind==='models'&&management.strategies.some(s=>s.modelId===id)){toast('模型正被策略引用，请先调整策略');return}if(kind==='prompts'&&management.strategies.some(s=>s.promptId===id)){toast('提示词正被策略引用，请先调整策略');return}if(!confirm('删除此项演示配置？历史任务快照保持不变。'))return;management[kind]=management[kind].filter(x=>x.id!==id);render();toast('已删除本页演示配置');}
function verifyManagedModel(id){const m=management.models.find(m=>m.id===id);m.verifiedRevision=m.revision;render();toast('演示验证通过：只展示可达性与简单 JSON 检查，未发起真实请求');}
function openPromptVersions(id){const p=management.prompts.find(p=>p.id===id),latest=currentPrompt(id);$('#reader-title').textContent=p.name+' · 版本与对比';$('#reader-subtitle').textContent='正文版本独立保存；实际调用输入按任务回看';$('#reader-body').innerHTML=`<div class="row wrap" style="margin-bottom:18px"><label class="small">旧版本 <select id="version-before">${opts(p.versions.map(v=>String(v.number)),p.versions.map(v=>'v'+v.number),String(p.versions[0].number))}</select></label><label class="small">新版本 <select id="version-after">${opts(p.versions.map(v=>String(v.number)),p.versions.map(v=>'v'+v.number),String(latest.number))}</select></label><button onclick="comparePromptVersions('${id}')">对比正文</button></div><div id="prompt-version-diff"></div>`;comparePromptVersions(id);$('#copy-reader').disabled=false;$('#reader-dialog').showModal();}
function comparePromptVersions(id){const p=management.prompts.find(p=>p.id===id),before=p.versions.find(v=>String(v.number)===$('#version-before').value)||p.versions[0],after=p.versions.find(v=>String(v.number)===$('#version-after').value)||currentPrompt(id);readerText=after.content;$('#prompt-version-diff').innerHTML=`${before.content===after.content?'<div class="notice">两版正文相同。</div>':''}<div class="form-grid"><div><h3 style="margin-bottom:10px">v${before.number}</h3><div class="preview-code"><pre>${esc(before.content)}</pre></div></div><div><h3 style="margin-bottom:10px">v${after.number}</h3><div class="preview-code"><pre>${esc(after.content)}</pre></div></div></div>`;}
function managedFormOptions(){const model=$('#form-model'),strategy=$('#form-strategy');if(model)model.innerHTML=opts(management.models.map(m=>m.name),management.models.map(m=>m.name),form.model);if(strategy)strategy.innerHTML=opts(['不选策略',...management.strategies.filter(s=>s.specialistType===form.type).map(s=>s.name)],['不选策略',...management.strategies.filter(s=>s.specialistType===form.type).map(s=>s.name)],form.strategy);}
const originalRenderForm=renderForm;
renderForm=function(){originalRenderForm();const valid=management.strategies.find(s=>s.name===form.strategy&&s.specialistType===form.type);if(!valid)form.strategy='不选策略';managedFormOptions();$('#form-strategy').onchange=()=>{form.strategy=$('#form-strategy').value;const s=management.strategies.find(s=>s.name===form.strategy);if(s){form.model=managedName('models',s.modelId);$('#form-model').value=form.model}$('#form-model').disabled=!!s;form.dirty=true;};const s=management.strategies.find(s=>s.name===form.strategy);if(s){form.model=managedName('models',s.modelId);$('#form-model').value=form.model}$('#form-model').disabled=!!s;$('#form-model').title=s?'采用策略关联的模型；修改关联请到策略管理':'未选策略，可单独选择模型';};
const originalOpenReportForm=openReportForm;
openReportForm=function(){originalOpenReportForm();$('#report-model').innerHTML=opts(management.models.map(m=>m.name),management.models.map(m=>m.name),management.models[0]?.name||'');};
const originalRenderBrowser=renderBrowser;
renderBrowser=function(){const project=management.projects.find(p=>p.id===(state.activeProjectId||'project-order'));if(!project)return '<div class="empty">当前项目不可用，请返回项目管理重新选择。</div>';const chooser=`<select aria-label="代码项目" onchange="changeBrowserProject(this.value)">${opts(management.projects.map(p=>p.id),management.projects.map(p=>p.name),project.id)}</select>`;if(project.id==='project-order')return originalRenderBrowser().replace('<select aria-label="代码项目"><option>订单服务</option></select>',chooser);return `<div class="heading"><div><h1>代码浏览</h1><p>${esc(project.name)} · ${esc(project.giteaUrl)}</p></div><button onclick="go('settings')">返回项目列表</button></div><section class="card"><div class="filters">${chooser}<code>${esc(project.currentBranch)}</code></div><div class="empty">此项目尚未提供演示代码。<br><span class="small">正式实现将读取此项目对应的仓库，不展示其他项目的文件。</span></div></section>`;};
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('cancel',e=>{if(d.id==='form-dialog'){e.preventDefault();closeForm()}else if(d.id==='report-dialog'){e.preventDefault();closeReportForm()}else if(d.id==='manage-dialog'){e.preventDefault();closeManage()}else if(d.id==='scope-dialog'){e.preventDefault();closeScopePicker()}}));
window.addEventListener('beforeunload',e=>{if(Object.values(state.drafts).some(d=>d.dirty)||($('#form-dialog').open&&form.dirty)||($('#manage-dialog').open&&manageEditor.dirty)){e.preventDefault();e.returnValue=''}});
state.frozenTitle='订单服务多结果综合审查报告';
state.frozenSources=['r1','r2','r4','r5'];
state.frozenFeedback={'issue-1':{assessment:'准确',comment:'已复现重复支付请求，待补充服务端幂等验证。',revision:1},'issue-2':{assessment:'无法判断',comment:'需结合事务及补偿实现确认。',revision:1},'result-pattern':{assessment:'准确',comment:'目标接口角色判断与可见结构一致。',revision:1},'result-coupling':{assessment:null,comment:'作为 a84cd92 版本的结构参考。',revision:1}};
state.frozenSourceSnapshots=freezeReportSources(state.frozenSources,state.frozenFeedback);
state.reportFrozenAt='2026-10-20 11:05（演示）';
state.reportBody=buildReport();
multiResultReportExample=captureReport();
state.reportIsExample=true;

render();
</script>
