<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>审查与报告删除交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#263247;font:14px/1.6 "Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer;border:1px solid #dce1e9;border-radius:6px;background:white;padding:7px 15px;color:#35415a}button:disabled{cursor:not-allowed;color:#a4acb9}.shell{display:flex;min-height:100vh}aside{width:210px;background:#fff;border-right:1px solid #e6eaf0;padding:26px 18px}aside strong{font-size:20px;color:#285cd7}nav{display:grid;gap:10px;margin-top:35px}nav button{text-align:left;border:none;padding:12px}nav button.active{background:#edf3ff;color:#2860d8}main{flex:1;padding:36px;max-width:1500px}h1{font-size:25px;margin:0}p{margin:7px 0;color:#6a768b}.intro{margin-bottom:25px}.demo{border:1px solid #d6e3fb;background:#eef4ff;padding:11px 16px;border-radius:7px;margin-bottom:24px;color:#48618d}.card{background:white;border:1px solid #e6eaf0;border-radius:9px;padding:22px}.tools{display:flex;gap:12px;margin-bottom:22px}input{border:1px solid #dce1e9;border-radius:6px;padding:9px 12px;width:300px;font:inherit}table{border-collapse:collapse;width:100%;text-align:left}th{background:#f7f9fc;color:#637087;font-weight:500}td,th{padding:18px 14px;border-bottom:1px solid #edf0f5}.name{font-weight:600}.muted{color:#8590a2;font-size:12px}.status{padding:3px 9px;border-radius:5px;background:#edf7f0;color:#278650}.status.running{background:#eef3ff;color:#3169d2}.status.failed{background:#fff1f0;color:#c94e4e}.link{border:0;padding:3px 8px;background:none;color:#386bd6}.danger{color:#d44646}.footer{margin-top:16px;color:#8b94a5;display:flex;justify-content:space-between}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;padding:12px 25px;box-shadow:0 4px 24px #27354b30;border-radius:8px;z-index:3}dialog{border:0;border-radius:10px;width:495px;padding:26px;box-shadow:0 14px 60px #152d4a35}dialog::backdrop{background:#17263c65}dialog h2{font-size:19px;margin:0 0 18px}dialog .record{padding:12px;background:#f5f7fb;border-radius:6px;margin-bottom:14px}dialog p{color:#566277;margin:9px 0}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}.confirm{background:#d84a4a;color:white;border-color:#d84a4a}.empty{text-align:center;padding:40px}.head{display:flex;justify-content:space-between;align-items:center}@media(max-width:850px){aside{display:none}main{padding:20px}.card{overflow:auto}table{min-width:700px}}
</style>
<div class="shell"><aside><strong>aiCodeReview</strong><nav><button class="active" data-tab="review">审查中心</button><button data-tab="report">报告</button></nav></aside><main>
<div class="demo">独立交互原型 · 所有记录均为模拟数据，操作不连接数据库。</div>
<div class="intro head"><div><h1 id="title">审查中心</h1><p id="subtitle">查看专项审查与 Agent 调查，将完整审查结果整理成报告。</p></div><button id="reset">重置演示</button></div>
<section class="card"><div class="tools"><input id="search" placeholder="按任务名称搜索"><button id="refresh">刷新</button></div><table><thead id="thead"></thead><tbody id="rows"></tbody></table><div class="footer"><span>按创建时间排序</span><span id="count"></span></div></section>
</main></div>
<dialog id="modal" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div class="record" id="recordName"></div><p id="effect"></p><p id="dependency"></p><div class="actions"><button id="cancel">取消</button><button id="confirm" class="confirm">确认删除</button></div></dialog>
<dialog id="info" aria-labelledby="infoTitle"><h2 id="infoTitle">冻结来源仍可阅读</h2><p>支付模块问题审查 · 已保存的来源快照</p><div class="record">问题说明、代码证据、固定版本和生成报告时的反馈保持可读。</div><p id="sourceState"></p><div class="actions"><button id="closeInfo">关闭</button></div></dialog>
<script>
const initialReviews=[{id:'r1',name:'支付模块问题审查',type:'问题审查',state:'已完成',targets:'3 个目标',reports:2},{id:'r2',name:'订单流程联合调查',type:'Agent 分析',state:'运行中',targets:'自主调查',reports:0},{id:'r3',name:'结算服务耦合度分析',type:'耦合度分析',state:'失败',targets:'1 个目标',reports:0}];
const initialReports=[{id:'p1',name:'支付模块审查汇总',type:'4 个审查结果',state:'已完成',targets:'2 个任务 · 1 个版本'},{id:'p2',name:'订单流程分析报告',type:'2 个审查结果',state:'生成中',targets:'1 个任务 · 1 个版本'},{id:'p3',name:'结算模块待生成报告',type:'3 个审查结果',state:'待生成',targets:'2 个任务 · 1 个版本'}];
let reviews=structuredClone(initialReviews),reports=structuredClone(initialReports),tab='review',pending=null;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const isReview=tab==='review';$('title').textContent=isReview?'审查中心':'报告';$('subtitle').textContent=isReview?'查看专项审查与 Agent 调查，将完整审查结果整理成报告。':'将多个审查结果整理成独立报告，保留各项来源和版本。';$('search').placeholder=isReview?'按任务名称搜索':'按报告名称搜索';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('thead').innerHTML='<tr><th>'+(isReview?'任务':'报告名称')+'</th><th>'+(isReview?'类型':'选取材料')+'</th><th>状态</th><th>操作</th></tr>';const rows=(isReview?reviews:reports).filter(r=>r.name.includes($('search').value));$('count').textContent='共 '+rows.length+' 条';$('rows').innerHTML=rows.map(r=>{const active=['运行中','生成中','排队中'].includes(r.state);return '<tr><td><div class="name">'+esc(r.name)+'</div><div class="muted">2026-10-28 15:30</div></td><td>'+esc(r.type)+'<div class="muted">'+esc(r.targets)+'</div></td><td><span class="status '+(active?'running':r.state==='失败'?'failed':'')+'">'+esc(r.state)+'</span></td><td><button class="link" data-view="'+r.id+'">查看详情</button>'+(r.id==='p1'?'<button class="link" data-source="1">阅读来源</button>':'')+'<button class="link danger" data-delete="'+r.id+'" '+(active?'disabled title="请等待执行结束后再删除"':'')+'>删除</button></td></tr>'}).join('')||'<tr><td colspan="4" class="empty">没有匹配的记录</td></tr>';}
function toast(s){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),2500)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$('search').value='';render()});$('search').oninput=render;$('refresh').onclick=()=>{render();toast('演示列表已刷新')};$('reset').onclick=()=>{reviews=structuredClone(initialReviews);reports=structuredClone(initialReports);render();toast('演示记录已恢复')};
$('rows').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.source){$('sourceState').textContent=reviews.some(r=>r.id==='r1')?'原审查仍可访问。可先回到审查中心删除「支付模块问题审查」，再阅读本来源。':'原审查已删除，无法打开原审查详情。当前冻结来源仍可阅读。';$('info').showModal();return}if(b.dataset.view){toast('本原型仅演示删除与冻结来源阅读');return}if(!b.dataset.delete||b.disabled)return;pending=(tab==='review'?reviews:reports).find(r=>r.id===b.dataset.delete);$('modalTitle').textContent=tab==='review'?'删除这条审查记录？':'删除这份报告？';$('recordName').textContent=pending.name;$('effect').textContent=tab==='review'?'删除后，该审查及其结果不再展示，也不能再选入新报告。':'删除后，该报告不再展示，也无法继续生成或下载。';$('dependency').textContent=tab==='review'?(pending.reports?'已有 '+pending.reports+' 份报告使用其结果，这些报告保留已冻结的内容。':'已经使用此结果生成的报告保留其冻结内容。'):'来源审查记录保留，可用于生成其他报告。';$('modal').showModal()};
$('cancel').onclick=()=>{$('modal').close();pending=null};$('confirm').onclick=()=>{if(!pending)return;if(tab==='review')reviews=reviews.filter(r=>r.id!==pending.id);else reports=reports.filter(r=>r.id!==pending.id);pending=null;$('modal').close();render();toast('模拟删除成功，记录已从列表移除')};$('closeInfo').onclick=()=>$('info').close();render();
</script>
</html>
