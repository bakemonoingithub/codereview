<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>详情页信息结构原型</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#18243b;background:#f5f7fb;line-height:1.6;font-size:14px}
    *{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #83aaff;outline-offset:2px}
    .prototype-bar{background:#172847;color:#fff;padding:12px 32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.prototype-bar strong{font-size:14px}.prototype-bar small{color:#c3d0e7}.prototype-bar label{margin-left:auto;color:#dfe9fb}.prototype-bar select{margin-left:8px;border:1px solid #526784;border-radius:6px;padding:5px 9px;background:#fff;color:#172847}
    .page-switch{display:flex;gap:6px}.page-switch button{background:transparent;border:1px solid #60718b;color:#e2eaff;border-radius:6px;padding:5px 12px}.page-switch button.active{background:#fff;border-color:#fff;color:#214f9f;font-weight:600}
    .workspace{max-width:1480px;margin:auto;padding:24px 40px 70px}.breadcrumb{color:#71809b;font-size:12px;margin-bottom:24px}.back{color:#3268ca;font-weight:600;text-decoration:none}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:18px 0 20px}.heading h1{font-size:26px;line-height:1.25;margin:0;letter-spacing:-.02em}.heading-title,.actions,.facts,.status-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.facts{color:#65758d;margin-top:10px}.facts span+span:before{content:'·';color:#b0bdcf;margin-right:10px}.actions button,.btn{border:1px solid #d5ddeb;border-radius:7px;background:#fff;padding:7px 13px;color:#263f65}.actions .primary,.btn.primary{background:#3268db;color:#fff;border-color:#3268db}.badge{display:inline-flex;align-items:center;border-radius:20px;padding:2px 9px;background:#e8f7ef;color:#25845a;font-size:12px;font-weight:600}.badge.running{background:#eaf2ff;color:#3064bd}.badge.warning{background:#fff4df;color:#96611c}.badge.error{background:#fff0ee;color:#b44b43}
    .notice{border:1px solid #ead4a7;background:#fff9ed;border-radius:9px;padding:13px 16px;margin:0 0 18px;color:#76521e}.notice.info{background:#eff6ff;border-color:#cfe1fc;color:#335982}.notice p{margin:3px 0 0}.alert-title{font-weight:700}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}.layout.report{grid-template-columns:minmax(0,1fr) 300px}.card{background:#fff;border:1px solid #e1e7f0;border-radius:12px;box-shadow:0 4px 18px rgba(36,57,91,.035);min-width:0}.card-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid #edf1f6}.card-header h2,.card-header h3{font-size:15px;margin:0}.subtle,.muted{color:#75849b}.small{font-size:12px}.side-list{padding:8px}.side-item{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:7px;padding:11px;color:#354861;overflow-wrap:anywhere}.side-item:hover{background:#f5f8fd}.side-item.selected{background:#edf3ff;box-shadow:inset 3px 0 #3870df;color:#1e4f9f}.side-item strong{font-size:13px}.side-item small{display:block;color:#72819a;margin-top:4px}.body-tabs{display:flex;gap:24px;border-bottom:1px solid #e8edf4;padding:0 22px;overflow:auto}.body-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:14px 0;color:#71809a;white-space:nowrap}.body-tabs button.active{color:#3268db;border-color:#3268db;font-weight:600}.content{padding:24px 26px}.eyebrow{font-size:12px;color:#74839a;margin:0 0 5px}.content h2{font-size:20px;line-height:1.4;margin:0 0 8px}.content h3{font-size:15px;margin:22px 0 8px}.content p{margin:8px 0;line-height:1.85}.result-summary{font-size:15px;color:#2e405a}.rule{height:1px;background:#edf1f6;margin:20px 0}.tag{font-size:12px;padding:3px 8px;border-radius:5px;background:#edf3ff;color:#3264bd;display:inline-block}.tag.amber{background:#fff4df;color:#96611c}.tag.green{background:#eaf7ef;color:#32805c}.link{border:0;padding:0;background:none;color:#3268ca;text-align:left}.location{background:#f4f7fc;border-radius:7px;padding:10px 12px;overflow-wrap:anywhere}.feedback{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f7f9fc;border-radius:8px;padding:12px;margin-top:20px}.feedback button{background:#fff;border:1px solid #d9e2f0;border-radius:6px;padding:4px 9px;color:#50627d}.feedback button.selected{border-color:#3771df;color:#255ac1;background:#edf3ff}.note{border-left:3px solid #e0ad50;background:#fff9ed;padding:11px 14px;margin:18px 0}.empty{padding:45px 10px;text-align:center;color:#77869c}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;vertical-align:top;border-bottom:1px solid #edf1f6;padding:11px 10px}.table th{color:#708097;font-weight:500}.pairs{display:grid;grid-template-columns:130px minmax(0,1fr);gap:13px 18px}.pairs dt{color:#75849b}.pairs dd{margin:0;overflow-wrap:anywhere}.version{font-family:Consolas,monospace}.block{background:#f6f8fb;border:1px solid #e9edf3;border-radius:8px;padding:13px 15px;white-space:pre-wrap;overflow-wrap:anywhere}.details{margin-top:16px}.details summary{color:#3268ca;cursor:pointer}.footer-note{color:#8090a8;font-size:12px;margin:22px 0 0}.call-row{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #edf1f6;padding:13px 0}.modal{border:0;padding:0;border-radius:12px;box-shadow:0 12px 60px #13243e55;width:min(760px,calc(100vw - 40px))}.modal::backdrop{background:#14243b70}.modal-head{padding:16px 20px;border-bottom:1px solid #e7ecf3;display:flex;justify-content:space-between}.modal-body{padding:18px 20px;max-height:65vh;overflow:auto}.code{font:13px/1.8 Consolas,monospace;background:#f5f7fb;padding:14px;white-space:pre-wrap;overflow:auto}
    @media(max-width:900px){.workspace{padding:20px}.layout,.layout.report{grid-template-columns:1fr}.layout.report aside{order:-1}.heading{flex-direction:column}.prototype-bar label{margin-left:0}.content{padding:20px}.pairs{grid-template-columns:100px minmax(0,1fr)}}
    .scenario-bar{background:#fff;border-bottom:1px solid #e1e7f0;padding:12px 32px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}.scenario-bar label{color:#5d6f89;font-size:13px}.scenario-bar select{font:inherit;margin-left:8px;padding:6px 10px;border:1px solid #d5ddeb;border-radius:7px;background:#fff;color:#233d63}.scenario-bar small{color:#8390a4}.input-intro{font-size:13px}.input-section{padding:20px 0;border-top:1px solid #edf1f6}.content .input-section h3{margin:0 0 15px;font-size:16px}.input-section .pairs{margin:0}.input-section .details{margin-left:148px}.input-section dd small{display:block;margin-top:4px}.current-file{background:#f7f9fd;border:1px solid #e5ebf4;border-radius:8px;padding:12px 14px;margin-bottom:16px;overflow-wrap:anywhere}.current-file code{font-size:13px}.material-group h4{font-size:13px;color:#6b7d98;margin:16px 0 8px}.material-list{border:1px solid #e3e9f2;border-radius:8px;overflow:hidden}.material-row{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:13px 14px;border-bottom:1px solid #edf1f6}.material-row:last-child{border-bottom:0}.material-main{min-width:0;overflow-wrap:anywhere}.material-main code{font-size:13px}.material-main small{display:block;margin-top:5px;color:#78889f}.material-row .link{flex-shrink:0;font-size:13px}.input-records{border-top:1px solid #edf1f6;padding-top:18px}.input-records .pairs{font-size:13px;margin:16px 0 0}.material-detail .pairs{font-size:13px;margin:4px 0 20px}.material-preview-label{color:#71829b;font-size:12px;margin:16px 0 6px}
    .scenario-bar[hidden]{display:none}
    .version-line{background:#f5f7fb;border-radius:5px;padding:3px 7px;line-height:1.8;box-decoration-break:clone;-webkit-box-decoration-break:clone}.input-section dd .details{margin:0}.input-section .record-details{margin-left:0}.record-details .pairs{margin-top:16px}
    @media(max-width:900px){.scenario-bar{padding:12px 20px;gap:12px}.input-section .details{margin-left:0}.material-row{align-items:flex-start}.input-section .pairs{grid-template-columns:96px minmax(0,1fr)}}
  </style>
</head>
<body>
  <div class="prototype-bar">
    <strong>详情页结构原型</strong>
    <div class="page-switch" aria-label="切换详情类型">
      <button data-page="specialist" class="active">专项审查</button><button data-page="agent">Agent 分析</button><button data-page="report">报告</button>
    </div>
    <label>演示状态<select id="state"></select></label>
    <small>示例数据 · 不连接真实服务</small>
  </div>
  <div class="scenario-bar" id="specialist-controls">
    <label>专项场景<select id="specialist-scenario"><option value="issueFiles">问题审查（选文件）</option><option value="issueCommit">问题审查（选提交）</option><option value="coupling">耦合度</option><option value="pattern">设计模式</option></select></label>
    <label>输入示例<select id="input-example"><option value="regular">通常情况</option><option value="noRule">未使用通用规则</option><option value="missing">部分记录缺失</option><option value="noMaterials">暂无材料记录</option><option value="split">允许按需拆分</option></select></label>
    <small>切换左侧文件，可查看各文件的本次要求和代码材料。</small>
  </div>
  <main class="workspace">
    <div class="breadcrumb" id="breadcrumb"></div>
    <a class="back" href="#" id="back">← 返回列表</a>
    <div id="app"></div>
    <p class="footer-note">此页面用于确认信息结构和交互方向。显示内容均为示例；按钮、反馈和状态切换不会修改业务数据。</p>
  </main>
  <dialog class="modal" id="reader"><div class="modal-head"><strong id="reader-title"></strong><button class="link" id="reader-close">关闭</button></div><div class="modal-body" id="reader-body"></div></dialog>
  <script>
    const options={specialist:[['done','已完成'],['running','执行中'],['partial','部分完成'],['failed','失败'],['cancelled','已取消']],agent:[['done','已完成 · 已回答'],['insufficient','已完成 · 材料不足'],['running','执行中'],['failed','失败'],['cancelled','已取消']],report:[['done','已完成'],['running','生成中'],['frozen','材料已冻结'],['failed','生成失败']]};
    const names={specialist:'专项审查',agent:'Agent 分析',report:'报告'};
    const specialistScenarios={issueFiles:{type:'问题审查',diff:false},issueCommit:{type:'问题审查',diff:true},coupling:{type:'耦合度',diff:false},pattern:{type:'设计模式',diff:false}};
    const params=new URLSearchParams(document.location.search);
    let specialistScenario=specialistScenarios[params.get('scenario')]?params.get('scenario'):'issueFiles';
    let inputExample=['regular','noRule','missing','noMaterials','split'].includes(params.get('example'))?params.get('example'):'regular';
    let page='specialist', state='done', tab='input', selectedFile=0, feedback='';
    const fileNames=['PaymentService.java','RetryPolicy.java','PaymentController.java'];
    const fileNotes=['检查重试时的重复处理，并说明外部服务规则缺失的影响。','','重点检查异常返回是否保留原始失败原因。'];
    const sampleHead='28eb23c'.padEnd(40,'1'),sampleBase='0343a95'.padEnd(40,'2');
    const $=s=>document.querySelector(s);
    const button=(text,kind='')=>`<button class="${kind}" data-demo="${text}">${text}</button>`;
    function status(){if(state==='running')return ['执行中','running'];if(state==='partial')return ['部分完成','warning'];if(state==='failed')return ['失败','error'];if(state==='cancelled')return ['已取消','warning'];if(state==='frozen')return ['材料已冻结','running'];return ['已完成',''];}
    function stateNotice(){
      if(state==='running')return `<div class="notice info"><div class="alert-title">${page==='report'?'报告正在生成':page==='agent'?'正在调查：读取相关代码':'正在审查文件'}</div><p>${page==='specialist'?'已完成 1 / 3 个文件，其余文件仍在处理。':page==='agent'?'当前动作与已查范围会随执行更新。':'正文生成后将在此显示，已冻结的来源可查看。'}</p></div>`;
      if(state==='partial')return '<div class="notice"><div class="alert-title">部分完成</div><p>已完成文件的结果可以阅读；失败文件没有完整结论，不能作为报告材料。</p></div>';
      if(state==='insufficient')return '<div class="notice"><div class="alert-title">材料不足</div><p>调查已结束，但部分问题尚无法回答。下方结果列出未解决事项；作为报告来源时应保留这一限制。</p></div>';
      if(state==='failed')return `<div class="notice"><div class="alert-title">${page==='report'?'报告生成失败':'任务未完成'}</div><p>示例原因：读取材料失败。${page==='report'?'冻结的来源仍可查看，未生成可下载正文。':'已保存的记录可供排查，未完成部分不作为完整结果。'} <button class="link" data-tab="calls">查看执行记录</button></p></div>`;
      if(state==='cancelled')return '<div class="notice"><div class="alert-title">任务已取消</div><p>已保存记录可以查看；未完成部分不会自动继续。</p></div>';
      if(state==='frozen')return '<div class="notice info"><div class="alert-title">来源已冻结，尚未生成报告</div><p>可查看已选来源，并选择生成配置。</p></div>';
      return '';
    }
    function header(){const [label,tone]=status();const title=page==='specialist'?`支付模块${specialistScenarios[specialistScenario].type}`:page==='agent'?'支付重试路径调查':'支付模块审查报告';const info=page==='specialist'?['订单服务',specialistScenarios[specialistScenario].type]:page==='agent'?['订单服务','Agent 分析']:['审查报告','2 个项目','4 个来源结果'];
      const actions=state==='running'?button('取消任务'):state==='frozen'?button('选择生成配置','primary'):page==='report'&&state==='done'?button('下载 Markdown','primary'):page==='agent'&&['done','insufficient'].includes(state)?button('下载 Markdown')+button('复制参数新建'):page!=='report'?button('复制参数新建'):'';
      return `<div class="heading"><div><div class="heading-title"><h1>${title}</h1><span class="badge ${tone}">${label}</span></div><div class="facts">${info.map(x=>`<span>${x}</span>`).join('')}</div></div><div class="actions">${button('刷新')}${actions}</div></div>${stateNotice()}`;
    }
    function tabs(){return `<div class="body-tabs">${[['result',page==='report'?'报告正文':'审查结果'],['input','输入与配置'],['calls','执行记录']].map(([key,label])=>`<button data-tab="${key}" class="${tab===key?'active':''}">${label}</button>`).join('')}</div>`;}
    function fileSide(){return `<aside class="card"><div class="card-header"><h2>目标文件</h2><span class="subtle small">3 个</span></div><div class="side-list">${['PaymentService.java','RetryPolicy.java','PaymentController.java'].map((name,i)=>`<button class="side-item ${selectedFile===i?'selected':''}" data-file="${i}"><strong>${name}</strong><small>${state==='failed'?'失败 · 读取材料失败':state==='partial'&&i===1?'失败 · 读取材料失败':state==='running'&&i>0?'等待处理':state==='cancelled'&&i>0?'已取消':'已完成'}</small></button>`).join('')}</div></aside>`;}
    function feedbackControls(){return `<div class="feedback"><span>人工反馈：</span>${['准确','不准确','无法判断'].map(x=>`<button data-feedback="${x}" class="${feedback===x?'selected':''}">${x}</button>`).join('')}<span class="subtle small">${feedback?`示例选择：${feedback}（未保存）`:'未反馈'}</span><button data-demo="填写评论与保存反馈">评论与保存</button></div>`;}
    function specialistResult(){if(state==='failed'||(state==='partial'&&selectedFile===1)||(state==='cancelled'&&selectedFile>0))return '<div class="empty">该文件没有完整结果。可在执行记录中查看原因。</div>';if(state==='running'&&selectedFile>0)return '<div class="empty">该文件尚未完成，结果发布后显示。</div>';if(['coupling','pattern'].includes(specialistScenario))return `<p class="eyebrow">当前文件 · ${fileNames[selectedFile]}</p><h2>${specialistScenarios[specialistScenario].type}结果</h2><p class="result-summary">${specialistScenario==='coupling'?'示例：目标文件依赖外部支付接口，相关关系需要结合接口约定解释。':'示例：目标文件存在策略模式候选，需要结合调用关系确认其角色。'}</p><div class="note">${specialistScenario==='coupling'?'依赖事实和关系解释保留在结果区域。':'模式候选及其代码依据保留在结果区域。'}本次原型调整重点为「输入与配置」。</div>${feedbackControls()}`;if(selectedFile>0)return `<p class="eyebrow">当前文件 · ${fileNames[selectedFile]}</p><h2>审查结果</h2><div class="empty">示例：基于本次材料未发现可说明的问题。未发现问题不等于完整验证了业务正确性。</div>`;return `<p class="eyebrow">当前文件 · PaymentService.java</p><h2>审查结果</h2><p class="result-summary">发现 1 项需要人工核对的风险，涉及支付重试时的重复处理。</p><div class="rule"></div><span class="tag amber">中风险</span> <span class="tag">可靠性</span><h3>重试分支可能重复处理同一请求</h3><p>示例：异常重试路径未展示足够的去重依据，需要结合调用方约束确认。</p><p><strong>建议：</strong>检查请求标识在重试前后是否保持一致，并验证重复请求的处理结果。</p><div class="location"><span class="subtle small">代码位置</span><br><button class="link" data-reader="code">src/payment/PaymentService.java · 86–102 行 ↗</button></div>${feedbackControls()}<div class="note"><strong>分析边界</strong><p>示例结论仅依据本次取得的材料，未核验外部支付平台的实际行为。</p></div><details class="details"><summary>查看本任务反馈汇总</summary><p>问题判定：准确 0 · 不准确 0 · 无法判断 0 · 未反馈 1</p><p class="subtle small">暂无明确判定。准确率仅统计人工判定为准确或不准确的问题。</p></details>`;}
    function agentResult(){if(['running','failed','cancelled'].includes(state))return `<div class="empty">${state==='running'?'调查尚未结束，结果发布后显示。':'没有已发布的完整结果。可查看保存的执行记录。'}</div>`;return `<p class="eyebrow">综合分析 · ${state==='insufficient'?'材料不足':'已回答'}</p><h2>支付重试路径调查</h2><p class="result-summary">当前材料显示，重试入口会沿用原请求标识；外部服务的去重行为仍需另行核实。</p>${state==='insufficient'?'<div class="note"><strong>未解决事项</strong><p>未取得外部服务的去重规则，无法确认跨系统重复处理是否被阻止。</p></div>':''}<h3>主要发现</h3><p>重试由调用方触发，应用侧保留了请求标识。建议进一步核对接收方是否以该标识做幂等校验。 <button class="link" data-reader="code">[E1]</button></p><h3>适用范围</h3><p>本次围绕两个所选提交及相关代码调查；范围外的读取作为背景，不代表已审查整个仓库。</p><div class="rule"></div><p class="subtle small">示例内容不代表真实任务结论。</p>`;}
    function evidenceSide(){if(!['done','insufficient'].includes(state))return '<aside class="card"><div class="card-header"><h2>代码证据</h2></div><div class="side-list"><p class="subtle small">结果尚未发布，暂无线索可展示。</p></div></aside>';return `<aside class="card"><div class="card-header"><h2>代码证据</h2><span class="subtle small">2 项</span></div><div class="side-list"><button class="side-item" data-reader="code"><strong>E1 · PaymentService.java</strong><small>86–102 行 · 修改后 · 28eb23c</small></button><button class="side-item" data-reader="code"><strong>E2 · RetryPolicy.java</strong><small>24–38 行 · 固定版本 · 28eb23c</small></button></div></aside>`;}
    function reportSide(){return `<aside class="card"><div class="card-header"><h2>报告来源</h2><span class="subtle small">4 项</span></div><div class="side-list">${[['S1','问题审查','订单服务 · PaymentService.java'],['S2','Agent 分析','订单服务 · 支付重试路径调查'],['S3','耦合度','库存服务 · InventoryService.java'],['S4','设计模式','库存服务 · StockPolicy.java']].map(x=>`<button class="side-item" data-reader="source"><span class="tag">${x[0]}</span>　<strong>${x[1]}</strong><small>${x[2]}</small></button>`).join('')}</div></aside>`;}
    function reportResult(){if(state==='failed')return '<div class="empty">报告生成失败，没有可阅读或下载的正文。冻结来源和执行记录仍可查看。</div>';if(state==='frozen')return '<div class="empty">材料已冻结。选择生成配置后，报告正文将在此显示。</div>';if(state==='running')return '<div class="empty">报告正在生成，正文发布后显示。</div>';return `<p class="eyebrow">基于 4 个冻结的审查结果</p><h2>支付与库存模块审查报告</h2><p class="result-summary">本报告汇总专项审查与 Agent 分析，重点关注重试处理及依赖边界。</p><h3>一、需要关注的事项</h3><p>支付重试路径需要进一步核对跨系统的幂等约定。相关问题见 <button class="link" data-reader="source">[S1]</button>，综合分析见 <button class="link" data-reader="source">[S2]</button>。</p><h3>二、分析范围与限制</h3><p>报告依据所选审查结果及生成时冻结的材料，不代表对全部代码的检查。部分外部服务规则未取得。</p><div class="rule"></div><p class="subtle small">引用可打开生成时保存的来源；后续修改不会替换本报告的来源快照。</p>`;}
    function specialistMaterials(){
      if(inputExample==='noMaterials'||state==='failed'||(state==='partial'&&selectedFile===1)||(state==='running'&&selectedFile>0)||(state==='cancelled'&&selectedFile>0))return [];
      const diff=specialistScenarios[specialistScenario].diff;
      const path=`src/payment/${fileNames[selectedFile]}`;
      const beforePath=selectedFile===1?'src/payment/LegacyRetryPolicy.java':path;
      const targets=diff?[
        {id:'target-before',path:beforePath,side:'修改前',purpose:'审查对象',content:'所选范围的完整内容',sent:true,sha:inputExample==='missing'?'':sampleBase,start:1,end:140},
        {id:'target-after',path,side:'修改后',purpose:'审查对象',content:inputExample==='split'?'代码片段（仅包含文件中的部分代码）':'所选范围的完整内容',sent:true,sha:sampleHead,start:inputExample==='split'?80:1,end:156}
      ]:[{id:'target',path,side:'',purpose:'审查对象',content:inputExample==='split'?'代码片段（仅包含文件中的部分代码）':'所选范围的完整内容',sent:true,sha:sampleHead,start:inputExample==='split'?80:1,end:156}];
      return [...targets,{id:'aux-declaration',path:'src/payment/PaymentGateway.java',side:diff?'修改后':'',purpose:'辅助参考',content:'声明摘要（仅保留类型声明和方法签名，已省略方法体）',sent:true,sha:sampleHead,start:1,end:45},
        {id:'aux-unused',path:'src/payment/PaymentException.java',side:diff?'修改后':'',purpose:'辅助参考',content:'部分内容（所选范围未完整返回）',sent:false,sha:sampleHead,start:1,end:24}];
    }
    function materialList(){
      const materials=specialistMaterials();
      if(!materials.length)return '<div class="block subtle">暂无关联材料记录</div>';
      return ['审查对象','辅助参考'].map(purpose=>`<div class="material-group"><h4>${purpose}</h4><div class="material-list">${materials.filter(m=>m.purpose===purpose).map(m=>`<div class="material-row"><div class="material-main"><code>${m.path}</code><small>${m.purpose}${m.side?` · ${m.side}`:''}</small></div><button class="link" data-material="${m.id}">查看代码</button></div>`).join('')}</div></div>`).join('');
    }
    function specialistInput(){
      const scenario=specialistScenarios[specialistScenario], missing=inputExample==='missing', hasRule=inputExample!=='noRule';
      const path=`src/payment/${fileNames[selectedFile]}`;
      const note=selectedFile===0?(specialistScenario==='coupling'?'重点说明目标文件的出向依赖；无法可靠定位的类型请单独说明。':specialistScenario==='pattern'?'说明模式候选的代码依据及适用边界。':fileNotes[0]):fileNotes[selectedFile];
      const branch=missing?'分支未记录':'dev';
      const versions=scenario.diff?`${branch} · ${missing?'比较基线未记录':sampleBase.slice(0,12)}（修改前）→ ${sampleHead.slice(0,12)}（修改后）`:`${branch} · ${sampleHead.slice(0,12)}`;
      const versionTitle=scenario.diff?`${missing?'比较基线未记录':sampleBase}（修改前）→ ${sampleHead}（修改后）`:sampleHead;
      const rule=hasRule?`代码审查规则 · ${missing?'版本未记录':'v2'}`:'未使用通用规则';
      const finished=state==='running'?'尚未结束':state==='cancelled'?'2026-10-25 10:03:42':'2026-10-25 10:03:35';
      return `<p class="eyebrow">任务创建时保存的信息</p><h2>输入与配置</h2><p class="subtle input-intro">查看本任务的配置，以及当前文件的要求和关联代码材料。</p>
        <section class="input-section" aria-label="任务配置"><h3>任务配置</h3><dl class="pairs">
          <dt>审查项目</dt><dd>订单服务</dd>
          <dt>分支与源码版本</dt><dd><code class="version version-line" title="${versionTitle}">${versions}</code></dd>
          <dt>使用的模型</dt><dd>${missing?'模型名称未记录':'审查模型（示例）'}</dd>
          <dt>文件处理设置</dt><dd>${inputExample==='split'?'允许按需拆分':'整文件提交'}</dd>
          <dt>当前审查文件</dt><dd><code>${path}</code>${scenario.diff&&selectedFile===1?'<small class="subtle">原路径：<code>src/payment/LegacyRetryPolicy.java</code></small>':''}</dd></dl>
        </section>
        <section class="input-section" aria-label="审查规则"><h3>审查规则</h3>
          <dl class="pairs"><dt>本次要求</dt><dd>${note||'<span class="subtle">未填写</span>'}</dd>
            <dt>通用规则</dt><dd>${rule}</dd>
            ${hasRule?`<dt>规则正文</dt><dd><details class="details"><summary>展开查看</summary><div class="block">${missing?'保存的规则正文不可用。':'示例规则：说明结论的依据和适用范围，不将未取得材料视为不存在。'}</div></details></dd>`:''}</dl>
        </section>
        <section class="input-section" aria-label="代码材料"><h3>代码材料</h3><p class="subtle small">以下是与当前文件关联的材料记录。可打开查看保存的内容、完整程度及是否已提供给模型。</p>${materialList()}</section>
        <section class="input-section" aria-label="任务信息"><h3>任务信息</h3><dl class="pairs"><dt>任务 ID</dt><dd><code>DEMO-TASK-001</code></dd><dt>创建与结束</dt><dd>创建：2026-10-25 10:03:00<br>结束：${finished}</dd><dt>模型配置修订</dt><dd>${missing?'未记录':'3'}</dd></dl></section>`;
    }
    function inputPanel(){if(page==='specialist')return specialistInput();let scope=page==='agent'?'<dt>范围</dt><dd>提交比较 · 2 个提交<br><span class="version">C1 28eb23c ← 0343a95<br>C2 b8b0b50 ← 28eb23c</span></dd><dt>本次要求</dt><dd>核对重试路径的幂等约定，并说明材料缺口。</dd>':'<dt>来源范围</dt><dd>4 个审查结果 · 2 个项目 · 2 个版本<br>查看右侧报告来源及冻结内容。</dd><dt>本次要求</dt><dd>优先说明支付重试风险，保留来源引用。</dd>';
      const pendingConfig=page==='report'&&state==='frozen';
      if(pendingConfig)scope=scope.replace('优先说明支付重试风险，保留来源引用。','尚未选择生成配置。');
      return `<p class="eyebrow">创建时保存的信息</p><h2>输入与配置</h2><p class="subtle">用于回看本次使用的范围与要求。规则正文以保存的快照为准。</p><div class="rule"></div><dl class="pairs">${scope}<dt>模型</dt><dd>${pendingConfig?'尚未选择':'示例模型'}</dd><dt>通用规则</dt><dd>${pendingConfig?'尚未选择':'代码审查规则 · v2'}</dd></dl>${pendingConfig?'':`<details class="details"><summary>查看保存的规则正文</summary><div class="block">示例规则：说明结论的依据和适用范围，不将未取得材料视为不存在。</div></details>`}<details class="details"><summary>查看标识与时间</summary><dl class="pairs"><dt>${page==='report'?'报告 ID':'任务 ID'}</dt><dd class="version">示例 ID · 可复制完整标识</dd><dt>创建时间</dt><dd>2026-10-25 10:03</dd></dl></details><p class="footer-note">原型说明：页面可用字段及多提交比较关系需在正式实现前逐项核对接口。</p>`;}
    function callsPanel(){return `<p class="eyebrow">排查与复核</p><h2>执行记录</h2><p class="subtle">${page==='agent'?'工具动作及模型调用应明确区分；当前原型分别示意入口。':'按需查看调用状态、错误及实际请求与返回。'}</p><div class="rule"></div>${page==='agent'?'<h3>工具调用</h3><div class="call-row"><span>第 1 轮 · 读取代码 <span class="tag green">成功</span></span><button class="link" data-reader="call">查看参数与返回</button></div>':''}<h3>模型调用</h3><div class="call-row"><span>第 1 次尝试 · ${state==='failed'?'<span class="tag amber">失败</span>':'<span class="tag green">成功</span>'}</span><button class="link" data-reader="call">查看完整请求与返回</button></div><p class="footer-note">原型只示意分类和入口，不代表现有接口已支持全部展示。</p>`;}
    function render(){const label=page==='report'?'报告': '审查中心';$('#breadcrumb').textContent=`工作空间 / ${label} / 详情`;$('#back').textContent=`← 返回${label}`;const el=$('#state');el.innerHTML=options[page].map(([v,l])=>`<option value="${v}" ${state===v?'selected':''}>${l}</option>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#specialist-controls').hidden=page!=='specialist';$('#specialist-scenario').value=specialistScenario;$('#input-example').value=inputExample;
      let content=tab==='input'?inputPanel():tab==='calls'?callsPanel():page==='specialist'?specialistResult():page==='agent'?agentResult():reportResult();
      const main=`<section class="card">${tabs()}<div class="content">${content}</div></section>`;
      $('#app').innerHTML=header()+(page==='specialist'?`<div class="layout">${fileSide()}${main}</div>`:`<div class="layout report">${main}${page==='agent'?evidenceSide():reportSide()}</div>`);
    }
    function openReader(kind){const data={code:['固定版本代码','<p class="subtle">示例证据 · 28eb23c · 修改后 · 86–102 行</p><pre class="code">86  // 示例：固定版本代码片段\n87  retry(requestId);\n88  // 完整代码与行号由正式页面读取</pre>'],source:['冻结的报告来源','<p><span class="tag">示例来源</span>　订单服务 · 问题审查</p><p>生成时保存的结果、版本、反馈和证据在此阅读。真实内容以冻结快照为准。</p>'],call:['执行记录','<p>这里按需展示该次调用保存的请求、返回和错误信息。</p><pre class="code">示例内容，不连接服务。</pre>']};$('#reader-title').textContent=data[kind][0];$('#reader-body').innerHTML=data[kind][1];$('#reader').showModal();}
    function openMaterial(id){const m=specialistMaterials().find(item=>item.id===id);if(!m)return;$('#reader-title').textContent='代码材料';$('#reader-body').innerHTML=`<div class="material-detail"><dl class="pairs"><dt>文件路径</dt><dd><code>${m.path}</code></dd><dt>版本</dt><dd>${m.sha?`<code class="version">${m.sha}</code>`:'版本未记录'}</dd><dt>行号</dt><dd>${m.start}–${m.end}</dd>${m.side?`<dt>代码版本</dt><dd>${m.side}</dd>`:''}<dt>材料用途</dt><dd>${m.purpose}</dd><dt>材料内容</dt><dd>${m.content}</dd><dt>模型使用情况</dt><dd>${m.sent?'已提供给模型':'未提供给模型'}</dd></dl><p class="material-preview-label">保存内容的阅读区域（以下仅为示例节选）</p><pre class="code">${m.start}  // ${m.path}\n${m.start+1}  // 示例代码，不代表实际审查材料。\n${m.start+2}  // 正式页面沿用现有材料阅读功能。</pre></div>`;$('#reader').showModal();}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;state='done';tab=page==='specialist'?'input':'result';selectedFile=0;feedback='';render();}else if(b.dataset.tab){tab=b.dataset.tab;render();}else if(b.dataset.file!==undefined){selectedFile=Number(b.dataset.file);feedback='';render();}else if(b.dataset.feedback){feedback=b.dataset.feedback;render();}else if(b.dataset.material){openMaterial(b.dataset.material);}else if(b.dataset.reader){openReader(b.dataset.reader);}else if(b.dataset.demo){$('#reader-title').textContent=b.dataset.demo;$('#reader-body').innerHTML='<p>这是交互位置示意；原型不会执行真实操作。</p>';$('#reader').showModal();}});
    $('#state').addEventListener('change',e=>{state=e.target.value;render();});$('#specialist-scenario').addEventListener('change',e=>{specialistScenario=e.target.value;tab='input';feedback='';render();});$('#input-example').addEventListener('change',e=>{inputExample=e.target.value;tab='input';render();});$('#reader-close').addEventListener('click',()=>$('#reader').close());$('#back').addEventListener('click',e=>e.preventDefault());render();
  </script>
</body>
</html>
