<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>通用提示词用途</title>
<style>body{font:16px system-ui;background:#f5f7fa;color:#1f2937;margin:40px}main{max-width:800px;margin:auto}section{background:white;padding:24px;border:1px solid #e5e7eb;border-radius:8px;margin:20px 0}select{padding:8px;min-width:220px}label{display:block;margin:12px 0}small{display:block;color:#64748b;margin:10px 0}</style>
<main><h1>提示词用途</h1><section><h2>提示词管理</h2><label>用途 <select id="purpose"><option value="SPECIALIST">专项审查</option><option value="AGENT">Agent 分析</option><option value="REPORT">报告生成</option><option value="COMMON">通用</option></select></label><small>通用用途可在专项审查、Agent 分析和报告生成中选择。每次仍只选择一份规则及具体版本。</small></section><section><h2>发起时选择</h2><div id="scenes"></div></section></main>
<script>
const scenes = [['SPECIALIST','专项审查'],['AGENT','Agent 分析'],['REPORT','报告生成']];
function render(){document.querySelector('#scenes').replaceChildren(...scenes.map(([scene,label])=>{const row=document.createElement('label');row.append(label+' ');const select=document.createElement('select');select.add(new Option('不使用通用规则',''));select.add(new Option(label+'专用规则','dedicated'));if(document.querySelector('#purpose').value==='COMMON'||document.querySelector('#purpose').value===scene)select.add(new Option('当前编辑的规则','current'));row.append(select);return row;}));}
document.querySelector('#purpose').addEventListener('change',render);render();
</script>
</html>
