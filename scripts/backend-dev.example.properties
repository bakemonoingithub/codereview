# Copy to backend/application-local.properties and replace every placeholder.
# Keep the actual file local. Agent and legacy databases must be different.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/code_review?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=REPLACE_WITH_LEGACY_USER
spring.datasource.password=${LOCAL_LEGACY_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.locations=classpath:db/migration

agent.datasource.url=jdbc:mysql://127.0.0.1:3306/ai_code_review_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
agent.datasource.username=REPLACE_WITH_AGENT_USER
agent.datasource.password=${LOCAL_AGENT_DB_PASSWORD}
agent.datasource.expected-database=ai_code_review_agent
agent.datasource.migration-location=classpath:db/agent-migration
