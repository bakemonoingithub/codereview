server:
  port: 8080

spring:
  application:
    name: code-review-backend
  datasource:
    url: jdbc:mysql://localhost:3306/code_review?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: <你的数据库密码>
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

deepseek:
  base-url: https://api.deepseek.com
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-chat
  # LLM 调用超时（毫秒）。**务必保持有限**：网关挂起时靠它把单元收敛为失败，
  # 否则记录会永远停在"执行中"并占满并发线程。配 0 或负数会被回退成默认值。
  connect-timeout-ms: 10000     # 建连超时
  read-timeout-ms: 300000       # 读超时（单次调用最长等待）

# 审查编排参数（均有默认值，可省略；以下为默认值示例）
review:
  concurrency: 4            # 并行限流并发数
  chunk-max-chars: 140000   # 分块阈值（字符数），超过才按类/方法切分；约 4 万 token（字符/3.5）
  retry-max: 3              # 单元级最大重试次数
  retry-base-millis: 1000   # 指数退避基数（1s→2s→4s）

# 报告生成参数（均有默认值，可省略）。报告要把多条审查记录的结果 JSON 拼进一次 LLM 调用，
# 没有预算就会无界增长、最后失败在网关侧（错误信息还不指向根因），所以这里必须有硬上限。
report:
  prompt-max-chars: 140000  # 单次报告 user prompt 上限（字符，**含**模板与用户补充要求）
  record-max-chars: 20000   # 单条审查记录在聚合里的上限；超出截断（summary 在最前所以先保留）
                            # 超出总预算的记录整条省略，并在提示词里写明裁剪了多少条

# GitHub REST API 兜底认证（建议通过环境变量 GITHUB_TOKEN 注入，勿硬编码/明文入库）
# 项目未填令牌时自动使用；认证后限额 5000 次/小时，匿名仅 60 次/小时/IP
github:
  token: ${GITHUB_TOKEN:}

# Git 宿主接入（单实例；均有默认值，通常可省略）
# api-base / raw-base 原先写死在 GitHubClient 里：部署到内网镜像站或自建企业版时，
# 只能改代码。现在可用这两个键覆盖（不带尾斜杠）。
git:
  api-base: https://api.github.com             # REST API 根（GitHub 用）
  raw-base: https://raw.githubusercontent.com  # 原始文件根（Contents API 不可用时兜底）
  cache:
    commit-detail-max-size: 200   # 单提交详情缓存条数上限
    raw-file-max-size: 500        # 文件内容缓存条数上限
    expire-minutes: 30            # 写入后过期时间（分钟）

  # Gitea 1.16.1 接入。**API 根不用配**：按各项目的仓库地址推导
  # （http://host/gitea/owner/repo → http://host/gitea/api/v1），内网子路径自动带上。
  # 内网站点（192.104.224.172/gitea）开箱可用：hosts 默认已含 localhost:3000 与 192.104.224.172。
  gitea:
    hosts:                        # 哪些 host[:port] 归 Gitea 客户端（白名单，未命中显式报「未接入的仓库宿主」）
      - localhost:3000            # 本机开发（默认值）
      - 192.104.224.172           # 内网站点（默认值；只写 host 也能匹配 http://192.104.224.172:80/...）
    api-base: ""                  # 可选覆盖（含 /api/v1）；仅 git@host:owner/repo 这类地址需要
    token: ${GITEA_TOKEN:}        # 兜底令牌；项目里填了 credential 时以项目为准（内网只申请了一个只读令牌时用它）
    local-clone-enabled: true     # Gitea 没有 compare 接口，靠本地 bare 镜像算三点差异；false 则 compare 直接报错
    work-dir: ${GITEA_MIRROR_DIR:}          # 本地镜像目录；容器部署建议挂持久卷（如 /app/data/git-mirrors），留空用临时目录
    mirror-timeout-seconds: 120   # 单次克隆/拉取超时（秒）；内网带宽小或仓库大可调大
    diff-max-bytes: 5242880       # 单个提交 .diff 文本上限；超限则整提交 patch 置空（走全文件兜底）
