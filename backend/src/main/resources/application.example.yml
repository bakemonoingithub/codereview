server:
  port: 8080

spring:
  application:
    name: code-review-backend
  datasource:
    url: jdbc:mysql://localhost:3306/code_review?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: <你的数据库密码>
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

deepseek:
  base-url: https://api.deepseek.com
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-chat

# 审查编排参数（均有默认值，可省略；以下为默认值示例）
review:
  concurrency: 4            # 并行限流并发数
  chunk-max-chars: 140000   # 分块阈值（字符数），超过才按类/方法切分；约 4 万 token（字符/3.5）
  retry-max: 3              # 单元级最大重试次数
  retry-base-millis: 1000   # 指数退避基数（1s→2s→4s）

# GitHub REST API 兜底认证（建议通过环境变量 GITHUB_TOKEN 注入，勿硬编码/明文入库）
# 项目未填令牌时自动使用；认证后限额 5000 次/小时，匿名仅 60 次/小时/IP
github:
  token: ${GITHUB_TOKEN:}

# Git 侧内存缓存（单实例；均有默认值，可省略）
# 只缓存 commit sha 下的不可变内容——分支名会移动，按分支缓存会读到过期数据
git:
  cache:
    commit-detail-max-size: 200   # 单提交详情缓存条数上限
    raw-file-max-size: 500        # 文件内容缓存条数上限
    expire-minutes: 30            # 写入后过期时间（分钟）
